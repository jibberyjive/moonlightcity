      function openDialogue(npc) {
        dialogue.active    = true;
        dialogue.npc       = npc;
        dialogue.lineIndex = 0;
        // NPC turns to face the player
        const dx = player.x - npc.x, dy = player.y - npc.y;
        npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
        npc.vx = 0; npc.vy = 0;
        npc.wanderTimer = 4; // pause wander after chat
        player.vx = 0; player.vy = 0;
      }

      function advanceDialogue() {
        if (!dialogue.active) return;
        const isLast = dialogue.lineIndex >= (dialogue.npc.lines || []).length - 1;
        if (isLast && game.save && dialogue.npc.id !== "__player__") {
          if (!game.save.friendship) game.save.friendship = {};
          const id = dialogue.npc.id;
          game.save.friendship[id] = Math.min(10, (game.save.friendship[id] || 0) + 1);
          writeSave(game.save);
        }
        dialogue.lineIndex++;
        if (dialogue.lineIndex >= (dialogue.npc.lines || []).length) {
          dialogue.active = false;
          dialogue.npc    = null;
        }
      }

      function dungeonTileAt(wx, wy) {
        if (!dungeon.data) return DTILE.WALL;
        const tx = Math.floor(wx / DTILE_SIZE);
        const ty = Math.floor(wy / DTILE_SIZE);
        if (tx < 0 || ty < 0 || tx >= dungeon.data.w || ty >= dungeon.data.h) return DTILE.WALL;
        return dungeon.tiles[ty * dungeon.data.w + tx];
      }

      function isDungeonBlockingTile(tile) {
        return tile === DTILE.WALL || tile === DTILE.CHEST || tile === DTILE.BARREL
            || tile === DTILE.STAIRS_LOCKED || tile === DTILE.ORE_VEIN || tile === DTILE.CRYSTAL;
      }

      function collidesDungeonCircle(x, y, radius) {
        const minX = Math.floor((x - radius) / DTILE_SIZE);
        const maxX = Math.floor((x + radius) / DTILE_SIZE);
        const minY = Math.floor((y - radius) / DTILE_SIZE);
        const maxY = Math.floor((y + radius) / DTILE_SIZE);
        for (let ty = minY; ty <= maxY; ty++) {
          for (let tx = minX; tx <= maxX; tx++) {
            const tile = dungeonTileAt(tx * DTILE_SIZE + DTILE_SIZE / 2, ty * DTILE_SIZE + DTILE_SIZE / 2);
            if (!isDungeonBlockingTile(tile)) continue;
            const tileX = tx * DTILE_SIZE;
            const tileY = ty * DTILE_SIZE;
            const nearestX = clamp(x, tileX, tileX + DTILE_SIZE);
            const nearestY = clamp(y, tileY, tileY + DTILE_SIZE);
            const dx = x - nearestX;
            const dy = y - nearestY;
            if (dx * dx + dy * dy < radius * radius) return true;
          }
        }
        return false;
      }

      function unlockDungeonStairs() {
        if (dungeon.stairsUnlocked || !dungeon.data) return;
        dungeon.stairsUnlocked = true;
        const sp = dungeon.data.stairsPos;
        dungeon.tiles[sp.y * dungeon.data.w + sp.x] = DTILE.STAIRS_UNLOCKED;
        showNotice("The stairs unlocked!", 1.8);
      }

      function updateDungeon(dt) {
        if (!dungeon.data) return;

        let inputX = 0, inputY = 0;
        if (keys.left)  inputX -= 1;
        if (keys.right) inputX += 1;
        if (keys.up)    inputY -= 1;
        if (keys.down)  inputY += 1;

        const len = Math.hypot(inputX, inputY) || 1;
        inputX /= len;
        inputY /= len;

        const onSlime = dungeonTileAt(player.x, player.y) === DTILE.SLIME_PUDDLE;
        const onLava  = dungeonTileAt(player.x, player.y) === DTILE.LAVA;
        const moveSpeed = player.speed * (onSlime ? 0.45 : onLava ? 0.6 : 1);

        // Lava burns 1 HP per second
        if (onLava) {
          if (!player._lavaTick) player._lavaTick = 0;
          player._lavaTick += dt;
          if (player._lavaTick >= 1) {
            player._lavaTick -= 1;
            player.hp = Math.max(0, player.hp - 1);
            showNotice("🔥 Lava burns! -1 HP", 0.8);
          }
        } else { player._lavaTick = 0; }
        const targetVX = inputX * moveSpeed;
        const targetVY = inputY * moveSpeed;
        const step = player.accel * dt;
        player.vx += clamp(targetVX - player.vx, -step, step);
        player.vy += clamp(targetVY - player.vy, -step, step);

        if (Math.abs(inputX) > 0.01 || Math.abs(inputY) > 0.01) {
          if (Math.abs(inputX) > Math.abs(inputY)) {
            player.dir = inputX > 0 ? "right" : "left";
          } else {
            player.dir = inputY > 0 ? "down" : "up";
          }
        }

        if (Math.hypot(player.vx, player.vy) > 4) {
          player.walkTime += dt * 9;
        }

        const nextX = player.x + player.vx * dt;
        if (!collidesDungeonCircle(nextX, player.y, player.radius)) {
          player.x = nextX;
        } else {
          player.vx = 0;
        }

        const nextY = player.y + player.vy * dt;
        if (!collidesDungeonCircle(player.x, nextY, player.radius)) {
          player.y = nextY;
        } else {
          player.vy = 0;
        }

        if (player.attackCooldown > 0) player.attackCooldown -= dt;
        if (justPressedKeys.attack && player.attackCooldown <= 0) {
          player.attackCooldown = 0.4;
          const range = 38;
          dungeon.enemies.forEach(en => {
            if (!en.alive) return;
            if (Math.hypot(en.x - player.x, en.y - player.y) >= range) return;
            const dmg = 5 + Math.floor(Math.random() * 4);
            en.hp -= dmg;
            en.hitFlash = 0.15;
            dungeon.dmgNumbers.push({ x: en.x, y: en.y - 20, val: `-${dmg}`, age: 0, color: "#ffffff" });
            if (en.hp <= 0) {
              en.alive = false;
              const minGold = en.stats.gold[0];
              const maxGold = en.stats.gold[1];
              const gold = minGold + Math.floor(Math.random() * (maxGold - minGold + 1));
              addCarriedGold(gold);
              dungeon.dmgNumbers.push({ x: en.x, y: en.y - 36, val: `+${gold}`, age: 0, color: "#ffd700" });
            }
          });
          if (dungeon.enemies.every(e => !e.alive)) unlockDungeonStairs();
        }

        dungeon.enemies.forEach(en => {
          if (!en.alive) return;
          en.hitFlash = Math.max(0, en.hitFlash - dt);
          en.attackCooldown = Math.max(0, en.attackCooldown - dt);

          if (en.ai === "patrol" && en.patrol && en.patrol.length) {
            const target = en.patrol[en.patrolIdx];
            const dx = target.x - en.x;
            const dy = target.y - en.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 4) {
              en.patrolIdx = (en.patrolIdx + 1) % en.patrol.length;
            } else {
              en.x += (dx / dist) * en.stats.speed * dt;
              en.y += (dy / dist) * en.stats.speed * dt;
            }
          }

          const hitRange = en.type === "small_slime" ? 28 : 22;
          if (Math.hypot(en.x - player.x, en.y - player.y) < hitRange && en.attackCooldown <= 0) {
            en.attackCooldown = en.ai === "stationary" ? 1.2 : 1.0;
            const dmg = en.stats.damage;
            player.hp = Math.max(0, player.hp - dmg);
            dungeon.dmgNumbers.push({ x: player.x, y: player.y - 20, val: `-${dmg}`, age: 0, color: "#ff6060" });
          }
        });

        dungeon.chests.forEach(ch => {
          if (ch.opened) return;
          const cx = ch.x * DTILE_SIZE + DTILE_SIZE / 2;
          const cy = ch.y * DTILE_SIZE + DTILE_SIZE / 2;
          if (Math.hypot(player.x - cx, player.y - cy) < 36 && justPressedKeys.interact) {
            ch.opened = true;
            dungeon.tiles[ch.y * dungeon.data.w + ch.x] = DTILE.FLOOR;
            const gold = 8 + Math.floor(Math.random() * 8);
            addCarriedGold(gold);
            dungeon.dmgNumbers.push({ x: cx, y: cy - 20, val: `+${gold}`, age: 0, color: "#ffd700" });
            showNotice("Chest opened!", 1.4);
          }
        });

        dungeon.barrels.forEach(br => {
          if (br.broken) return;
          const bx = br.x * DTILE_SIZE + DTILE_SIZE / 2;
          const by = br.y * DTILE_SIZE + DTILE_SIZE / 2;
          if (Math.hypot(player.x - bx, player.y - by) < 36 && (justPressedKeys.interact || justPressedKeys.attack)) {
            br.broken = true;
            dungeon.tiles[br.y * dungeon.data.w + br.x] = DTILE.FLOOR;
            if (Math.random() < 0.6) {
              const gold = 1 + Math.floor(Math.random() * 3);
              addCarriedGold(gold);
              dungeon.dmgNumbers.push({ x: bx, y: by - 20, val: `+${gold}`, age: 0, color: "#ffd700" });
            }
          }
        });

        const sp = dungeon.data.stairsPos;
        const sx = sp.x * DTILE_SIZE + DTILE_SIZE / 2;
        const sy = sp.y * DTILE_SIZE + DTILE_SIZE / 2;
        // Descend stairs
        if (dungeon.stairsUnlocked && Math.hypot(player.x - sx, player.y - sy) < 32 && justPressedKeys.interact) {
          const nextFloor = dungeon.floor + 1;
          if (FLOOR_DATA[nextFloor]) {
            enterDungeon(nextFloor);
          } else {
            showNotice(`Floor ${nextFloor} — Coming soon!`, 2.5);
          }
        }

        // Ascend / go back up (E at up-stairs position or at spawn on floor 1)
        const up = dungeon.data.upStairsPos;
        const upX = up ? up.x * DTILE_SIZE + DTILE_SIZE / 2 : dungeon.data.playerSpawn.x * DTILE_SIZE + DTILE_SIZE / 2;
        const upY = up ? up.y * DTILE_SIZE + DTILE_SIZE / 2 : dungeon.data.playerSpawn.y * DTILE_SIZE + DTILE_SIZE / 2;
        if (Math.hypot(player.x - upX, player.y - upY) < 32 && justPressedKeys.back) {
          if (dungeon.floor > 1) {
            enterDungeon(dungeon.floor - 1);
          } else {
            switchScene(SCENE.CITY, () => {
              player.x = 17 * TILE_SIZE + TILE_SIZE / 2;
              player.y = 56 * TILE_SIZE + TILE_SIZE / 2;
              player.vx = 0; player.vy = 0; player.attackCooldown = 0;
            });
          }
        }

        if (player.hp <= 0) {
          setCarriedGold(getCarriedGold() * 0.8);
          player.hp = player.maxHp;
          syncPlayerVitals();
          writeSave(game.save);
          showNotice("You blacked out and dropped some gold.", 2.5);
          switchScene(SCENE.CITY, () => {
            player.x = 20 * TILE_SIZE + TILE_SIZE / 2;
            player.y = 13 * TILE_SIZE + TILE_SIZE / 2;
            player.vx = 0;
            player.vy = 0;
            player.attackCooldown = 0;
          });
          return;
        }

        dungeon.dmgNumbers = dungeon.dmgNumbers.filter(d => d.age < 1.2);
        dungeon.dmgNumbers.forEach(d => { d.age += dt; });
        syncPlayerVitals();

        const dungeonW = dungeon.data.w * DTILE_SIZE;
        const dungeonH = dungeon.data.h * DTILE_SIZE;
        camera.x = clamp(player.x - canvas.width / 2, 0, Math.max(0, dungeonW - canvas.width));
        camera.y = clamp(player.y - canvas.height / 2, 0, Math.max(0, dungeonH - canvas.height));
      }

      // ==================================================
      // === RENDERING ====================================
      // ==================================================

      function drawGrass(x, y, tileX, tileY, base) {
        ctx.fillStyle = base;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        for (let i = 0; i < 4; i++) {
          const nx = noise(tileX * 2 + i, tileY, i);
          const ny = noise(tileX, tileY * 3 + i, i + 11);
          const px = x + 3 + Math.floor(nx * 24);
          const py = y + 3 + Math.floor(ny * 24);
          ctx.fillStyle = shade(base, i % 2 === 0 ? 10 : -12);
          ctx.fillRect(px, py, 3 + (i % 2), 2 + ((i + 1) % 2));
        }

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(x + 2, y + 2, 1, 1);
        ctx.fillRect(x + 18, y + 8, 1, 1);
        ctx.fillRect(x + 25, y + 20, 1, 1);
      }

      function drawPath(x, y, tileX, tileY) {
        ctx.fillStyle = COLORS.path;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "rgba(110,80,38,0.18)";
        for (let i = 0; i < 5; i++) {
          const px = x + 2 + Math.floor(noise(tileX, tileY, i + 20) * 26);
          const py = y + 2 + Math.floor(noise(tileY, tileX, i + 30) * 26);
          ctx.fillRect(px, py, 2, 2);
        }
        ctx.fillStyle = "rgba(255,230,180,0.10)";
        ctx.fillRect(x + 5, y + 4, 18, 3);
      }

      function drawWater(x, y, tileX, tileY, time) {
        ctx.fillStyle = COLORS.water;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        const shimmer = 0.18 + 0.12 * Math.sin(time * 2.8 + tileX * 0.8 + tileY * 0.45);
        ctx.fillStyle = `rgba(141, 201, 255, ${shimmer.toFixed(3)})`;
        ctx.fillRect(x + 3, y + 7, 22, 3);
        ctx.fillRect(x + 10, y + 17, 16, 2);
        ctx.fillRect(x + 6, y + 25, 12, 2);

        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 12);
        ctx.quadraticCurveTo(x + 12, y + 8, x + 20, y + 12);
        ctx.quadraticCurveTo(x + 25, y + 15, x + 29, y + 12);
        ctx.stroke();
      }

      function drawFlowers(x, y, tileX, tileY) {
        drawGrass(x, y, tileX, tileY, COLORS.grass);
        const palette = ["#f1d84e", "#db5d5d", "#b777ea", "#ffef8f"];
        for (let i = 0; i < 8; i++) {
          const px = x + 4 + Math.floor(noise(tileX, tileY, i + 40) * 24);
          const py = y + 4 + Math.floor(noise(tileY, tileX, i + 50) * 24);
          ctx.fillStyle = palette[i % palette.length];
          ctx.fillRect(px, py, 2, 2);
        }
      }

      function drawStone(x, y, tileX, tileY) {
        const isCandy = tileX >= CANDY_STORE.x1 && tileX <= CANDY_STORE.x2 &&
                        tileY >= CANDY_STORE.y1 && tileY <= CANDY_STORE.y2;
        const isSchool = tileX >= SCHOOL.x1 && tileX <= SCHOOL.x2 &&
                         tileY >= SCHOOL.y1 && tileY <= SCHOOL.y2;
        const isPrestige = tileX >= PRESTIGE_STORE.x1 && tileX <= PRESTIGE_STORE.x2 &&
                           tileY >= PRESTIGE_STORE.y1 && tileY <= PRESTIGE_STORE.y2;
        const isMansion = tileX >= MANSION.x1 && tileX <= MANSION.x2 &&
                          tileY >= MANSION.y1 && tileY <= MANSION.y2;
        const isTheater = tileX >= THEATER.x1 && tileX <= THEATER.x2 &&
                          tileY >= THEATER.y1 && tileY <= THEATER.y2;
        const isPetShop = tileX >= PET_SHOP.x1 && tileX <= PET_SHOP.x2 &&
                          tileY >= PET_SHOP.y1 && tileY <= PET_SHOP.y2;

        if (isCandy) {
          // ── Candy Store roof — pink tiles ───────────────────────
          const pinkA = noise(tileX, tileY, 99) < 0.45 ? "#e8608a" : "#f07aa0";
          ctx.fillStyle = pinkA;
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          // Shingle lines in deeper pink
          ctx.fillStyle = "rgba(180,40,80,0.3)";
          for (let row = 1; row < 4; row++) ctx.fillRect(x, y + row * 8, TILE_SIZE, 1);
          const stg = ((tileX + tileY) % 2 === 0) ? 0 : 8;
          ctx.fillStyle = "rgba(180,40,80,0.18)";
          for (let row = 0; row < 4; row++) {
            ctx.fillRect(x + stg + row * 16,     y + row * 8, 1, 8);
            ctx.fillRect(x + stg + row * 16 + 8, y + row * 8, 1, 8);
          }
          // Candy cane stripe accent on roof
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.fillRect(x + 4, y, 3, TILE_SIZE);
          ctx.fillRect(x + 20, y, 3, TILE_SIZE);

          // South-edge pink wall face
          const southTile = (tileY + 1 < MAP_H) ? map[tileY + 1][tileX] : -1;
          const isEdge = southTile !== TILE.STONE;
          if (isEdge) {
            // Candy-stripe wall: alternating pink & white bands
            for (let i = 0; i < 5; i++) {
              ctx.fillStyle = i % 2 === 0 ? "#ffd6e8" : "#ff8ab8";
              ctx.fillRect(x + i * 7, y + TILE_SIZE - 9, 7, 9);
            }
            ctx.fillRect(x + 35, y + TILE_SIZE - 9, TILE_SIZE - 35, 9);  // fill remainder
            // Roof overhang shadow
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
            // Heart windows
            ctx.fillStyle = "#ffe0f0";
            ctx.fillRect(x + 4,            y + TILE_SIZE - 8, 5, 5);
            ctx.fillRect(x + TILE_SIZE - 9, y + TILE_SIZE - 8, 5, 5);
            ctx.fillStyle = "rgba(200,60,100,0.5)";
            ctx.strokeStyle = "rgba(200,60,100,0.5)";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 4,            y + TILE_SIZE - 8, 5, 5);
            ctx.strokeRect(x + TILE_SIZE - 9, y + TILE_SIZE - 8, 5, 5);

            // "Sweet Dreams" sign above door tile (centre column)
            if (tileX === 32) {
              ctx.fillStyle = "#ff4d88";
              ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("🍬 Sweet Dreams", x + TILE_SIZE / 2, y + TILE_SIZE - 11);
              ctx.textAlign = "left";
            }
          }

          // West-edge
          const westTile = (tileX - 1 >= 0) ? map[tileY][tileX - 1] : -1;
          if (westTile !== TILE.STONE) {
            ctx.fillStyle = "#f0a0c8";
            ctx.fillRect(x, y, 4, TILE_SIZE);
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.fillRect(x, y, 1, TILE_SIZE);
          }

        } else if (isPrestige) {
          ctx.fillStyle = "#c8a820";
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = "rgba(90,65,0,0.28)";
          for (let row = 1; row < 4; row++) ctx.fillRect(x, y + row * 8, TILE_SIZE, 1);
          const stg = ((tileX + tileY) % 2 === 0) ? 0 : 8;
          ctx.fillStyle = "rgba(255,236,170,0.2)";
          for (let row = 0; row < 4; row++) {
            ctx.fillRect(x + stg + row * 16,     y + row * 8, 1, 8);
            ctx.fillRect(x + stg + row * 16 + 8, y + row * 8, 1, 8);
          }
          ctx.fillStyle = "#e6cc5a";
          ctx.fillRect(x, y, TILE_SIZE, 3);

          const southTile = (tileY + 1 < MAP_H) ? map[tileY + 1][tileX] : -1;
          const isEdge = southTile !== TILE.STONE;
          if (isEdge) {
            ctx.fillStyle = "#f5e8c0";
            ctx.fillRect(x, y + TILE_SIZE - 10, TILE_SIZE, 10);
            ctx.fillStyle = "rgba(196,170,120,0.45)";
            for (let px = 2; px < TILE_SIZE; px += 3) {
              ctx.fillRect(x + px, y + TILE_SIZE - 10, 1, 10);
            }
            ctx.fillStyle = "rgba(0,0,0,0.28)";
            ctx.fillRect(x, y + TILE_SIZE - 10, TILE_SIZE, 2);
            ctx.fillStyle = "#dfbf55";
            ctx.fillRect(x, y + TILE_SIZE - 10, TILE_SIZE, 2);
            ctx.fillStyle = "#ffd060";
            ctx.fillRect(x + 5, y + TILE_SIZE - 9, 6, 6);
            ctx.fillRect(x + TILE_SIZE - 11, y + TILE_SIZE - 9, 6, 6);
            ctx.strokeStyle = "#cda434";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 5, y + TILE_SIZE - 9, 6, 6);
            ctx.strokeRect(x + TILE_SIZE - 11, y + TILE_SIZE - 9, 6, 6);
            ctx.beginPath();
            ctx.arc(x + 8, y + TILE_SIZE - 9, 3, Math.PI, 0);
            ctx.arc(x + TILE_SIZE - 8, y + TILE_SIZE - 9, 3, Math.PI, 0);
            ctx.stroke();

            if (tileX === 49 && tileY === 21) {
              ctx.fillStyle = "#fff2c0";
              ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("💎 Prestige Furnishings", x + TILE_SIZE / 2, y + TILE_SIZE - 12);
              ctx.textAlign = "left";
            }
          }

          const westTile = (tileX - 1 >= 0) ? map[tileY][tileX - 1] : -1;
          if (westTile !== TILE.STONE) {
            ctx.fillStyle = "#ead9ad";
            ctx.fillRect(x, y, 4, TILE_SIZE);
            ctx.fillStyle = "rgba(160,120,40,0.25)";
            ctx.fillRect(x + 1, y, 1, TILE_SIZE);
          }
        } else {
          // Detect if this tile belongs to a purchasable house
          let houseConfig = null;
          for (const h of HOUSE_LISTINGS) {
            if (tileX >= h.x1 && tileX <= h.x2 && tileY >= h.y1 && tileY <= h.y2) {
              houseConfig = h; break;
            }
          }

          // ── Roof colour ──────────────────────────────────────────
          const roofColor = houseConfig ? houseConfig.roofColor
                          : isMansion ? "#2a3a80"
                          : isPetShop ? "#7a5a36"
                          : isSchool  ? "#6b2a1a"
                          : COLORS.stone;
          ctx.fillStyle = roofColor;
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

          // Shingle texture — horizontal rows + staggered verticals
          ctx.fillStyle = "rgba(0,0,0,0.20)";
          for (let row = 1; row < 4; row++) ctx.fillRect(x, y + row * 8, TILE_SIZE, 1);
          ctx.fillStyle = "rgba(0,0,0,0.12)";
          const stg = ((tileX + tileY) % 2 === 0) ? 0 : 8;
          for (let row = 0; row < 4; row++) {
            ctx.fillRect(x + stg + row * 16,     y + row * 8, 1, 8);
            ctx.fillRect(x + stg + row * 16 + 8, y + row * 8, 1, 8);
          }
          // Ridge highlight at top of each roof tile
          ctx.fillStyle = "rgba(255,255,255,0.13)";
          ctx.fillRect(x, y, TILE_SIZE, 2);

          // ── South wall face ──────────────────────────────────────
          const southTile = (tileY + 1 < MAP_H) ? map[tileY + 1][tileX] : -1;
          const isEdge = southTile !== TILE.STONE;
          if (isEdge) {
            if (houseConfig) {
              // ── Sims 4-style house wall ──────────────────────────
              const wc = houseConfig.wallColor;
              const tc = houseConfig.trimColor;
              const wh = 11; // wall height in px
              // Siding background
              ctx.fillStyle = wc;
              ctx.fillRect(x, y + TILE_SIZE - wh, TILE_SIZE, wh);
              // Horizontal clapboard siding lines
              ctx.fillStyle = "rgba(0,0,0,0.18)";
              ctx.fillRect(x, y + TILE_SIZE - wh, TILE_SIZE, 1);   // roof shadow
              ctx.fillStyle = "rgba(0,0,0,0.10)";
              ctx.fillRect(x, y + TILE_SIZE - wh + 4, TILE_SIZE, 1);
              ctx.fillRect(x, y + TILE_SIZE - wh + 7, TILE_SIZE, 1);
              // Eave trim band
              ctx.fillStyle = tc;
              ctx.fillRect(x, y + TILE_SIZE - wh, TILE_SIZE, 2);
              // Sims 4 windows: two per tile, rounded frames, glass + cross pane
              const owned = game.save && game.save.ownedHouses && game.save.ownedHouses.includes(houseConfig.num);
              const isPlayerHouse = game.save && game.save.player && game.save.player.houseNum === houseConfig.num;
              const wX1 = x + 3, wX2 = x + TILE_SIZE - 11;
              const wY  = y + TILE_SIZE - wh + 3, wW = 7, wH = 6;
              ctx.fillStyle = houseConfig.winColor;
              ctx.fillRect(wX1, wY, wW, wH);
              ctx.fillRect(wX2, wY, wW, wH);
              // Glass shine
              ctx.fillStyle = "rgba(255,255,255,0.5)";
              ctx.fillRect(wX1, wY, 2, 2);
              ctx.fillRect(wX2, wY, 2, 2);
              // Window frames
              ctx.strokeStyle = tc;
              ctx.lineWidth = 1;
              ctx.strokeRect(wX1, wY, wW, wH);
              ctx.strokeRect(wX2, wY, wW, wH);
              // Cross pane divider
              ctx.beginPath();
              ctx.moveTo(wX1 + 3, wY); ctx.lineTo(wX1 + 3, wY + wH);
              ctx.moveTo(wX1, wY + 3); ctx.lineTo(wX1 + wW, wY + 3);
              ctx.moveTo(wX2 + 3, wY); ctx.lineTo(wX2 + 3, wY + wH);
              ctx.moveTo(wX2, wY + 3); ctx.lineTo(wX2 + wW, wY + 3);
              ctx.strokeStyle = "rgba(0,0,0,0.25)";
              ctx.stroke();
              // FOR SALE / owner name sign on door tile
              const dt = houseConfig.doorTile;
              const [dtx, dty] = dt.split(",").map(Number);
              if (tileX === dtx && tileY === dty) {
                if (!owned && !isPlayerHouse) {
                  ctx.fillStyle = "rgba(255,248,210,0.92)";
                  ctx.fillRect(x + 1, y + TILE_SIZE - wh - 8, TILE_SIZE - 2, 7);
                  ctx.fillStyle = "#8b1a1a";
                  ctx.font = "bold 5px Trebuchet MS, Arial, sans-serif";
                  ctx.textAlign = "center";
                  ctx.fillText(`FOR SALE  ${houseConfig.price}g`, x + TILE_SIZE / 2, y + TILE_SIZE - wh - 2);
                  ctx.textAlign = "left";
                } else if (isPlayerHouse) {
                  ctx.fillStyle = "rgba(40,90,40,0.85)";
                  ctx.fillRect(x + 1, y + TILE_SIZE - wh - 8, TILE_SIZE - 2, 7);
                  ctx.fillStyle = "#c8f0a0";
                  ctx.font = "bold 5px Trebuchet MS, Arial, sans-serif";
                  ctx.textAlign = "center";
                  ctx.fillText(`🏠 ${game.save.player.name}`, x + TILE_SIZE / 2, y + TILE_SIZE - wh - 2);
                  ctx.textAlign = "left";
                }
              }
            } else if (isMansion) {
              // ── Mansion wall (unchanged logic, fixed coords) ─────
              const wallColor = "#1a2a6c";
              ctx.fillStyle = wallColor;
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 9);
              ctx.fillStyle = "rgba(5,10,40,0.45)";
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
              ctx.fillStyle = "#d8b24c";
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
              if ((tileX - MANSION.x1) % 3 === 0) {
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                ctx.fillRect(x + 2, y + TILE_SIZE - 9, 3, 9);
                ctx.fillRect(x + TILE_SIZE - 5, y + TILE_SIZE - 9, 3, 9);
              }
              // Windows on mansion
              ctx.fillStyle = "#fff0a0";
              ctx.fillRect(x + 6, y + TILE_SIZE - 8, 4, 6);
              ctx.fillRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 4, 6);
              ctx.strokeStyle = "rgba(255,255,255,0.8)";
              ctx.lineWidth = 1;
              ctx.strokeRect(x + 6, y + TILE_SIZE - 8, 4, 6);
              ctx.strokeRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 4, 6);
              ctx.beginPath();
              ctx.moveTo(x + 8, y + TILE_SIZE - 8); ctx.lineTo(x + 8, y + TILE_SIZE - 2);
              ctx.moveTo(x + TILE_SIZE - 8, y + TILE_SIZE - 8); ctx.lineTo(x + TILE_SIZE - 8, y + TILE_SIZE - 2);
              ctx.stroke();
              // Sign on door tile (73,16)
              if (tileX === 73 && tileY === 16) {
                const mansionOwned = !!(game.save && game.save.houseUpgrades && game.save.houseUpgrades.includes("mansion_deed"));
                ctx.fillStyle = "#f7dc7a";
                ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🏰 Moonlight Mansion", x + TILE_SIZE / 2, y + TILE_SIZE - 12);
                if (!mansionOwned) {
                  ctx.fillStyle = "#f5f0dc";
                  ctx.fillRect(x - 1, y + TILE_SIZE - 22, TILE_SIZE + 2, 7);
                  ctx.fillStyle = "#8b1a1a";
                  ctx.font = "bold 6px Trebuchet MS, Arial, sans-serif";
                  ctx.fillText("FOR SALE 5000g", x + TILE_SIZE / 2, y + TILE_SIZE - 16);
                }
                ctx.textAlign = "left";
              }
            } else {
              // ── Pet shop / school / generic stone ───────────────
              const wallColor = isPetShop ? "#e8d2ae" : isSchool ? "#8b3a2a" : "#d2c49a";
              const trimColor = isPetShop ? "#9b6c3d" : isSchool ? "#e8d080" : "#d2c49a";
              const frameColor = isPetShop ? "rgba(100,70,35,0.7)" : isSchool ? "rgba(90,40,20,0.75)" : "rgba(80,50,20,0.6)";
              ctx.fillStyle = wallColor;
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 9);
              ctx.fillStyle = isPetShop ? "rgba(70,45,18,0.4)" : isSchool ? "rgba(60,20,10,0.45)" : "rgba(0,0,0,0.35)";
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
              ctx.fillStyle = trimColor;
              ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
              ctx.fillStyle = isPetShop ? "#fff4d8" : "#a8d8ff";
              ctx.fillRect(x + 5,             y + TILE_SIZE - 8, 5, 5);
              ctx.fillRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 5, 5);
              ctx.strokeStyle = frameColor;
              ctx.lineWidth = 1;
              ctx.strokeRect(x + 5,             y + TILE_SIZE - 8, 5, 5);
              ctx.strokeRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 5, 5);
              if (isPetShop && tileX === 46 && tileY === 62) {
                ctx.fillStyle = "#fff0d8";
                ctx.fillRect(x - 2, y + TILE_SIZE - 21, TILE_SIZE + 4, 8);
                ctx.fillStyle = "#7a4a18";
                ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🐾 Pawsome Pets", x + TILE_SIZE / 2, y + TILE_SIZE - 15);
                ctx.textAlign = "left";
              }
              if (isSchool && tileX === 35 && tileY === 48) {
                ctx.fillStyle = "#e8d080";
                ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🎓 Moonlight Academy", x + TILE_SIZE / 2, y + TILE_SIZE - 11);
                ctx.textAlign = "left";
              }
            }
          }

          // ── West-edge side wall ──────────────────────────────────
          const westTile = (tileX - 1 >= 0) ? map[tileY][tileX - 1] : -1;
          if (westTile !== TILE.STONE) {
            if (houseConfig) {
              // Darker shade of wall color for side
              ctx.fillStyle = houseConfig.trimColor;
              ctx.fillRect(x, y, 4, TILE_SIZE);
              ctx.fillStyle = "rgba(0,0,0,0.25)";
              ctx.fillRect(x, y, 1, TILE_SIZE);
            } else {
              ctx.fillStyle = isMansion ? "#162257" : isPetShop ? "#c29a6c" : isSchool ? "#7a3022" : "#b8a882";
              ctx.fillRect(x, y, 4, TILE_SIZE);
              ctx.fillStyle = isMansion ? "rgba(255,255,255,0.2)" : isPetShop ? "rgba(80,55,28,0.25)" : isSchool ? "rgba(70,20,10,0.28)" : "rgba(0,0,0,0.2)";
              ctx.fillRect(x, y, 1, TILE_SIZE);
            }
          }
        } // end else (non-candy buildings)


        // Door on this tile (if it's a designated door tile)
        const doorFacing = BUILDING_DOOR_TILES[`${tileX},${tileY}`];
        if (doorFacing) {
          const doorY = doorFacing === "south" ? y + TILE_SIZE - 9 : y;
          const doorH = 9;
          if (isCandy) {
            // Pink candy door
            ctx.fillStyle = "#c0185a";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#f04880";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(x + 18, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,220,240,0.3)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else if (isSchool) {
            ctx.fillStyle = "#5a1810";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#8f2a1e";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#e8d080";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,235,190,0.2)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else if (isPrestige) {
            ctx.fillStyle = "#2a0f06";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#4a1a08";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#e8c55a";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,225,170,0.2)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else if (isMansion) {
            ctx.fillStyle = "#230705";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#3a0a08";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#e8c55a";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,236,180,0.18)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else if (isPetShop) {
            ctx.fillStyle = "#5a3216";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#7a4a22";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#f0d080";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,245,220,0.18)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else {
            // House-specific or generic door
            let hConf = null;
            for (const h of HOUSE_LISTINGS) {
              if (h.doorTile === `${tileX},${tileY}`) { hConf = h; break; }
            }
            const dc = hConf ? hConf.doorColor : "#3a1e08";
            const dcLight = hConf ? hConf.trimColor : "#7a4a18";
            ctx.fillStyle = dc;
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = dcLight;
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          }
        }

        // Highlight top-left corner (light source hint)
        ctx.fillStyle = isCandy ? "rgba(255,200,230,0.12)" : isPetShop ? "rgba(255,235,190,0.12)" : isSchool ? "rgba(255,230,180,0.12)" : isPrestige ? "rgba(255,235,170,0.12)" : isMansion ? "rgba(255,245,190,0.14)" : "rgba(255,255,220,0.08)";
        ctx.fillRect(x, y, TILE_SIZE, 3);
      }

      function drawDarkPath(x, y, tileX, tileY) {
        // Slums cracked cobblestone
        ctx.fillStyle = COLORS.darkPath;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // Cobble grain
        ctx.fillStyle = "rgba(80,60,40,0.22)";
        for (let i = 0; i < 4; i++) {
          const px = x + 2 + Math.floor(noise(tileX + i, tileY, i + 60) * 26);
          const py = y + 2 + Math.floor(noise(tileY + i, tileX, i + 70) * 26);
          ctx.fillRect(px, py, 3, 2);
        }
        // Crack line
        if (noise(tileX, tileY, 80) > 0.55) {
          ctx.strokeStyle = COLORS.darkPathCrack;
          ctx.lineWidth = 1;
          ctx.beginPath();
          const cx1 = x + 4 + Math.floor(noise(tileX, tileY, 81) * 18);
          const cx2 = x + 6 + Math.floor(noise(tileX, tileY, 82) * 18);
          ctx.moveTo(cx1, y + 3);
          ctx.lineTo(cx2, y + 16);
          ctx.lineTo(cx1 + 4, y + 28);
          ctx.stroke();
        }
      }

      function drawGroundTile(tile, tileX, tileY, time) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;

        switch (tile) {
          case TILE.DARK_GRASS:
            drawGrass(x, y, tileX, tileY, COLORS.darkGrass);
            break;
          case TILE.PATH:
            drawPath(x, y, tileX, tileY);
            break;
          case TILE.WATER:
            drawWater(x, y, tileX, tileY, time);
            break;
          case TILE.FLOWERS:
            drawFlowers(x, y, tileX, tileY);
            break;
          case TILE.STONE:
            drawStone(x, y, tileX, tileY);
            break;
          case TILE.DARK_PATH:
            drawDarkPath(x, y, tileX, tileY);
            break;
          default:
            drawGrass(x, y, tileX, tileY, COLORS.grass);
            break;
        }

        // Drop shadow cast by buildings to the north
        if (tile !== TILE.STONE && tileY > 0 && map[tileY - 1][tileX] === TILE.STONE) {
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          ctx.fillRect(x, y, TILE_SIZE, 7);
        }

        // Doorstep — draw a welcome mat on the tile just outside a door
        const southDoor = BUILDING_DOOR_TILES[`${tileX},${tileY - 1}`];
        const northDoor = BUILDING_DOOR_TILES[`${tileX},${tileY + 1}`];
        if (southDoor === "south" || northDoor === "north") {
          const matY = southDoor === "south" ? y + 2 : y + TILE_SIZE - 9;
          ctx.fillStyle = "#8a3010";
          ctx.fillRect(x + 8, matY, 16, 6);
          ctx.fillStyle = "#c05020";
          ctx.fillRect(x + 10, matY + 1, 12, 4);
        }
      }

      function drawRock(tileX, tileY) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;
        ctx.fillStyle = COLORS.rock;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 24);
        ctx.quadraticCurveTo(x + 5, y + 12, x + 13, y + 10);
        ctx.quadraticCurveTo(x + 20, y + 4, x + 26, y + 11);
        ctx.quadraticCurveTo(x + 30, y + 16, x + 27, y + 25);
        ctx.quadraticCurveTo(x + 18, y + 29, x + 6, y + 24);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.20)";
        ctx.beginPath();
        ctx.ellipse(x + 15, y + 15, 7, 4, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(80,80,80,0.35)";
        ctx.beginPath();
        ctx.moveTo(x + 11, y + 13);
        ctx.lineTo(x + 16, y + 18);
        ctx.lineTo(x + 13, y + 23);
        ctx.stroke();
      }

      function drawTree(tileX, tileY, time) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;
        const sway = Math.sin(time * 1.3 + tileX * 0.7 + tileY * 0.5) * 1.4;

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 23, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.trunk;
        ctx.fillRect(x + 13, y + 15, 6, 13);

        ctx.fillStyle = COLORS.leaves;
        ctx.beginPath();
        ctx.arc(x + 16 + sway, y + 10, 12, 0, Math.PI * 2);
        ctx.arc(x + 10 + sway * 0.8, y + 14, 9, 0, Math.PI * 2);
        ctx.arc(x + 22 + sway * 0.8, y + 14, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.leavesHi;
        ctx.beginPath();
        ctx.arc(x + 12 + sway, y + 8, 5, 0, Math.PI * 2);
        ctx.arc(x + 20 + sway, y + 11, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawObstacle(tile, tileX, tileY, time) {
        if (tile === TILE.TREE) drawTree(tileX, tileY, time);
        if (tile === TILE.ROCK) drawRock(tileX, tileY);
      }

      function drawPlayerSprite(time, p) {
        const skinColor = SKIN_TONES[p.skin]        || SKIN_TONES[0];
        const hairColor = HAIR_COLORS[p.hairColour]  || HAIR_COLORS[0];
        const outfit    = OUTFIT_COLORS[p.outfit]    || OUTFIT_COLORS[0];
        // Convert player's indexed colours into the same NPC-style hex object,
        // then let drawNpcSprite handle all the drawing.
        drawNpcSprite(time, {
          id: "__player__", name: "",
          x: p.x, y: p.y,
          vx: p.vx || 0, vy: p.vy || 0,
          dir: p.dir || "down",
          walkTime: p.walkTime || 0,
          homeX: p.x,
          skin:      skinColor,
          hair:      hairColor,
          torso:     outfit.torso,
          legs:      outfit.legs,
          hairStyle: p.hairStyle || 0,
          ageType:   p.ageType   || "adult"
        });
      }
      // drawPlayer uses the live player object — called by city scene
      function drawPlayer(time) { drawPlayerSprite(time, player); }

      function drawToddlerSprite(time, npc) {
        const skin  = npc.skin, hair = npc.hair;
        const skinS = shade(skin, -12);
        const skinD = shade(skin, -22);
        const blush = shade(skin, 18);
        const T = npc.torso, L = npc.legs;
        const SH = "#2a1808";

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        const bob   = moving ? Math.sin(npc.walkTime * Math.PI * 2) * 0.4 : Math.sin(time * 1.6 + (npc.homeX||0)*0.01) * 0.25;
        const frame = moving ? Math.floor(npc.walkTime * 2) % 4 : 0;
        // Toddler waddle — legs alternate, arms barely swing
        const ls = [0, 1.5, 0, -1.5][frame];
        const as = [0, -1, 0, 1][frame];
        const x = npc.x, y = npc.y + bob, d = npc.dir;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.14)";
        ctx.beginPath();
        ctx.ellipse(x, y + 11, 7, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cell origin: 16 wide, 24 tall — huge head takes rows 0-13
        const px = x - 8, py = y - 17;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        if (d === "down") {
          // ── Shoes ──────────────────────────────────────────────
          r(1-ls, 20, 6, 3, SH);  r(9+ls, 20, 6, 3, SH);
          // ── Stubby legs ────────────────────────────────────────
          r(2-ls, 16, 5, 5, L);   r(9+ls, 16, 5, 5, L);
          // ── Tiny round torso ───────────────────────────────────
          r(3, 13, 10, 4, T);
          // ── Arm stubs (barely there) ───────────────────────────
          r(0+as, 13, 3, 4, skin); r(13-as, 13, 3, 4, skin);
          // ── Big round head (dominant feature) ──────────────────
          r(1, 0, 14, 14, skin);
          // rounded corners
          r(0, 2, 1, 10, skin); r(15, 2, 1, 10, skin);
          r(2, 13, 12, 1, skin);
          // side shading
          r(0, 3, 2, 8, skinD);  r(14, 3, 2, 8, skinD);
          // ── Chubby cheeks ──────────────────────────────────────
          r(2, 9, 4, 3, blush);  r(10, 9, 4, 3, blush);
          // ── Big Stardew-style eyes ─────────────────────────────
          // white sclera
          r(3, 3, 4, 5, "#fff"); r(9, 3, 4, 5, "#fff");
          // iris + pupil
          r(4, 4, 3, 4, "#1a1a2e"); r(10, 4, 3, 4, "#1a1a2e");
          // eye shine
          r(4, 4, 1, 1, "#ffffff"); r(10, 4, 1, 1, "#ffffff");
          // ── Tiny nose dot ──────────────────────────────────────
          r(7, 9, 2, 1, skinS);
          // ── Smile ──────────────────────────────────────────────
          r(5, 11, 6, 1, skinS);
          r(5, 11, 1, 2, skinS); r(10, 11, 1, 2, skinS);
          // ── Ear nubs ───────────────────────────────────────────
          r(0, 5, 1, 4, skin); r(15, 5, 1, 4, skin);

        } else if (d === "up") {
          r(1-ls, 20, 6, 3, SH);  r(9+ls, 20, 6, 3, SH);
          r(2-ls, 16, 5, 5, shade(L,-12)); r(9+ls, 16, 5, 5, shade(L,-12));
          r(3, 13, 10, 4, shade(T,-15));
          r(0-as, 13, 3, 4, skinD); r(13+as, 13, 3, 4, skinD);
          r(1, 0, 14, 14, skinD);
          r(0, 2, 1, 10, skinD); r(15, 2, 1, 10, skinD);
          r(0, 3, 2, 8, shade(skin,-30)); r(14, 3, 2, 8, shade(skin,-30));

        } else if (d === "left") {
          r(2, 20, 6, 3, SH);
          r(2-ls*0.5, 16, 5, 5, L); r(7+ls*0.5, 16, 5, 5, shade(L,-10));
          r(2, 13, 10, 4, T); r(11, 13, 2, 4, shade(T,-12));
          r(0, 13+as*0.4, 3, 4, skin); r(13, 13, 2, 4, skinD);
          // head
          r(1, 0, 13, 14, skin); r(13, 1, 2, 12, skinD);
          r(0, 2, 1, 10, skin); r(14, 2, 2, 10, skinD);
          r(1, 13, 12, 1, skin);
          r(0, 4, 2, 6, skinD);
          // blush left side
          r(2, 9, 3, 3, blush);
          // single eye
          r(3, 3, 4, 5, "#fff"); r(4, 4, 3, 4, "#1a1a2e"); r(4, 4, 1, 1, "#fff");
          r(6, 9, 2, 1, skinS);
          r(4, 11, 5, 1, skinS); r(4, 11, 1, 2, skinS); r(8, 11, 1, 2, skinS);

        } else { // right
          r(8, 20, 6, 3, SH);
          r(4-ls*0.5, 16, 5, 5, shade(L,-10)); r(9+ls*0.5, 16, 5, 5, L);
          r(4, 13, 10, 4, T); r(4, 13, 2, 4, shade(T,-12));
          r(13, 13+as*0.4, 3, 4, skin); r(1, 13, 2, 4, skinD);
          // head
          r(2, 0, 13, 14, skin); r(1, 1, 2, 12, skinD);
          r(15, 2, 1, 10, skin); r(0, 2, 2, 10, skinD);
          r(3, 13, 12, 1, skin);
          r(14, 4, 2, 6, skinD);
          // blush right side
          r(11, 9, 3, 3, blush);
          // single eye
          r(9, 3, 4, 5, "#fff"); r(9, 4, 3, 4, "#1a1a2e"); r(11, 4, 1, 1, "#fff");
          r(8, 9, 2, 1, skinS);
          r(7, 11, 5, 1, skinS); r(7, 11, 1, 2, skinS); r(11, 11, 1, 2, skinS);
        }

        // ── Hair ───────────────────────────────────────────────────
        // Stardew toddler hair: simple short cap covering top of head
        const h = hair, hd = shade(hair, -20);
        if (d === "down" || d === "left" || d === "right") {
          if (npc.hairStyle <= 1) {
            // Short crop
            r(2, 0, 12, 4, h); r(1, 1, 2, 3, h); r(13, 1, 2, 3, h);
            r(2, 0, 12, 1, hd);
          } else if (npc.hairStyle === 2) {
            // Pigtails
            r(1, 0, 14, 4, h); r(0, 1, 1, 4, h); r(15, 1, 1, 4, h);
            r(0, 4, 2, 3, h); r(14, 4, 2, 3, h); // little bunches
          } else if (npc.hairStyle === 3) {
            // Bowl cut
            r(1, 0, 14, 5, h); r(0, 2, 1, 5, h); r(15, 2, 1, 5, h);
            r(1, 0, 14, 1, hd);
          } else {
            // Curly mop
            r(1, 0, 14, 5, h); r(0, 1, 2, 4, h); r(14, 1, 2, 4, h);
            r(4, 0, 3, 2, hd); r(9, 0, 3, 2, hd);
          }
        } else {
          r(1, 0, 14, 4, shade(h,-15));
        }

        // ── Name tag ───────────────────────────────────────────────
        if (npc.name) {
          const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
          if (dist < 80) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.font = "9px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            const tw = ctx.measureText(npc.name).width + 6;
            ctx.fillRect(x - tw/2, y - 28, tw, 12);
            ctx.fillStyle = "#ffe8c0";
            ctx.fillText(npc.name, x, y - 19);
            ctx.textAlign = "left";
          }
        }
      }

      function drawChildSprite(time, npc) {
        const skin = npc.skin, hair = npc.hair;
        const skinS = shade(skin, -14), hairD = shade(hair, -22);
        const blazer = "#1e3a8a", blazerS = "#172c68";
        const bottoms = "#4a4a5a", bottomsS = "#373744";
        const tie = "#b42028", shoes = "#1a1a1a", bag = "#4a2e1d";

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        const bob = moving ? Math.sin(npc.walkTime * Math.PI) * 0.55 : Math.sin(time * 1.7 + (npc.homeX || 0) * 0.01) * 0.35;
        const frame = moving ? Math.floor(npc.walkTime) % 4 : 0;
        const ls = [0, 1.5, 0, -1.5][frame];
        const as = [0, -1.2, 0, 1.2][frame];
        const x = npc.x, y = npc.y + bob, d = npc.dir;

        ctx.fillStyle = "rgba(0,0,0,0.17)";
        ctx.beginPath();
        ctx.ellipse(x, y + 12, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        const px = x - 9, py = y - 18;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        if (d === "down") {
          r(3-ls, 24, 5, 4, shoes); r(10+ls, 24, 5, 4, shoes);
          r(4-ls, 18, 4, 7, bottoms); r(10+ls, 18, 4, 7, bottoms);
          r(1-as*0.5, 13, 3, 8, skin); r(15+as*0.5, 13, 3, 8, skin);
          r(3, 11, 12, 8, blazer); r(3, 11, 2, 8, blazerS); r(13, 11, 2, 8, blazerS);
          r(7, 11, 4, 2, "#ffffff"); r(8, 13, 2, 4, tie);
          r(6, 8, 6, 3, skin);
          r(3, 0, 12, 11, skin); r(3, 0, 2, 11, skinS); r(13, 0, 2, 11, skinS);
          r(0, 3, 2, 4, skin); r(16, 3, 2, 4, skin);
          r(6, 3, 3, 4, "#fff"); r(10, 3, 3, 4, "#fff");
          r(7, 4, 2, 3, "#1a1a2e"); r(10, 4, 2, 3, "#1a1a2e");
          r(7, 4, 1, 1, "#fff"); r(10, 4, 1, 1, "#fff");
          r(7, 8, 4, 1, skinS);
        } else if (d === "up") {
          r(3-ls, 24, 5, 4, shoes); r(10+ls, 24, 5, 4, shoes);
          r(4-ls, 18, 4, 7, bottomsS); r(10+ls, 18, 4, 7, bottomsS);
          r(1+as*0.5, 13, 3, 8, shade(skin, -10)); r(15-as*0.5, 13, 3, 8, shade(skin, -10));
          r(2, 10, 14, 10, blazerS);
          r(6, 11, 6, 6, bag);
          r(6, 8, 6, 3, shade(skin, -12));
          r(3, 0, 12, 11, shade(skin, -12)); r(3, 0, 2, 11, shade(skin, -22)); r(13, 0, 2, 11, shade(skin, -22));
        } else if (d === "left") {
          r(4-ls*0.5, 24, 5, 4, shoes); r(9+ls*0.5, 24, 5, 4, shoes);
          r(4-ls*0.5, 18, 4, 7, bottoms); r(9+ls*0.5, 18, 4, 7, bottomsS);
          r(0, 13+as*0.4, 3, 7, skin); r(14, 12-as*0.4, 3, 6, skinS);
          r(3, 11, 11, 8, blazer); r(12, 11, 2, 8, blazerS);
          r(7, 11, 3, 2, "#ffffff"); r(7, 13, 2, 4, tie);
          r(6, 8, 5, 3, skin); r(10, 8, 2, 3, skinS);
          r(3, 0, 12, 11, skin); r(13, 0, 2, 11, skinS);
          r(2, 4, 1, 4, skinS); r(6, 3, 3, 4, "#fff"); r(7, 4, 2, 3, "#1a1a2e"); r(7, 4, 1, 1, "#fff");
        } else {
          r(4-ls*0.5, 24, 5, 4, shoes); r(9+ls*0.5, 24, 5, 4, shoes);
          r(4-ls*0.5, 18, 4, 7, bottomsS); r(9+ls*0.5, 18, 4, 7, bottoms);
          r(15, 13-as*0.4, 3, 7, skin); r(1, 12+as*0.4, 3, 6, skinS);
          r(4, 11, 11, 8, blazer); r(4, 11, 2, 8, blazerS);
          r(8, 11, 3, 2, "#ffffff"); r(9, 13, 2, 4, tie);
          r(7, 8, 5, 3, skin); r(7, 8, 2, 3, skinS);
          r(3, 0, 12, 11, skin); r(3, 0, 2, 11, skinS);
          r(15, 4, 1, 4, skinS); r(9, 3, 3, 4, "#fff"); r(9, 4, 2, 3, "#1a1a2e"); r(10, 4, 1, 1, "#fff");
        }

        if (d !== "up") {
          r(3, 0, 12, npc.hairStyle >= 2 ? 4 : 3, hair);
          r(3, 0, 2, 4, hairD); r(13, 0, 2, 4, hairD);
          if (npc.hairStyle >= 3) r(7, 0, 4, 2, hairD);
        } else {
          r(3, 0, 12, 4, shade(hair, -12));
          r(5, 0, 8, 2, hairD);
        }

        if (npc.name) {
          const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
          if (dist < 80) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.font = "9px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            const tw = ctx.measureText(npc.name).width + 6;
            ctx.fillRect(x - tw/2, y - 30, tw, 12);
            ctx.fillStyle = "#ffe8c0";
            ctx.fillText(npc.name, x, y - 21);
            ctx.textAlign = "left";
          }
        }
      }

      // ── Sims-style adult sprite (20 wide × 36 tall pixel cell) ──────────────
      // Layout (from top):  hair(-3..0), head(0..14), neck(14..17),
      //   shoulders(17..19), torso(17..28), arms(17..28), belt(28..30),
      //   legs(30..39), shoes(39..44)
      function drawNpcSprite(time, npc) {
        if (npc.ageType === "toddler") { drawToddlerSprite(time, npc); return; }
        if (npc.ageType === "child")   { drawChildSprite(time, npc);   return; }

        const skin  = npc.skin;
        const hair  = npc.hair;
        const skinS = shade(skin, -18);
        const skinD = shade(skin, -30);
        const blush = shade(skin, 20);
        const hairD = shade(hair, -28);
        const hairL = shade(hair, 18);
        const T     = npc.torso;
        const TL    = shade(T, 14);
        const TS    = shade(T, -22);
        const TM    = shade(T, -10);
        const L     = npc.legs;
        const LS    = shade(L, -20);
        const SH    = "#2a1a0e";           // shoe dark
        const SHL   = shade(SH, 18);       // shoe highlight
        const BELT  = shade(L, -40);
        const COLLAR = shade(T, 30);

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        const bob    = moving ? Math.sin(npc.walkTime * Math.PI) * 0.7 : Math.sin(time * 1.8 + npc.homeX * 0.01) * 0.35;
        const frame  = moving ? Math.floor(npc.walkTime) % 4 : 0;
        // leg swing ±3, arm counter-swing ±2
        const ls = [0, 3, 0, -3][frame];
        const as = [0, -2, 0, 2][frame];
        const x  = npc.x, y = npc.y + bob, d = npc.dir;

        // Drop shadow
        ctx.fillStyle = "rgba(0,0,0,0.20)";
        ctx.beginPath();
        ctx.ellipse(x, y + 16, 9, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cell origin: sprite is 20 px wide, tall ~44 px; anchor at foot-centre
        const px = x - 10, py = y - 30;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }
        // rounded rect helper (1-px corner trim)
        function rr(rx, ry, rw, rh, c) {
          r(rx+1, ry, rw-2, rh, c);
          r(rx, ry+1, rw, rh-2, c);
        }

        if (d === "down") {
          // ── Shoes ─────────────────────────────────────
          r(2-ls, 38, 7, 5, SH);   r(11+ls, 38, 7, 5, SH);
          r(2-ls, 38, 3, 2, SHL);  r(11+ls, 38, 3, 2, SHL);
          // ── Legs (tapered) ────────────────────────────
          r(3-ls, 29, 6, 10, L);   r(11+ls, 29, 6, 10, L);
          r(3-ls, 35, 6,  3, LS);  r(11+ls, 35, 6,  3, LS);
          // ── Belt ──────────────────────────────────────
          r(4, 28, 12, 2, BELT);  r(9, 28, 2, 2, shade(BELT, 20)); // buckle
          // ── Torso (Sims trapezoid: wider shoulders) ───
          r(3, 17, 14, 12, T);
          r(3, 17,  2, 12, TL);  // left shoulder light
          r(15,17,  2, 12, TS);  // right shadow
          r(4, 25,  2,  3, TM);  r(14,25,  2,  3, TM); // side seam
          // ── Collar V-notch ────────────────────────────
          r(8, 17, 4, 3, COLLAR);
          r(9, 17, 2, 5, COLLAR);
          // ── Arms (round shoulders, taper to wrist) ────
          r(0+as, 17, 4, 10, skin);  r(16-as, 17, 4, 10, skin);
          r(0+as, 17, 2,  4, shade(skin,10)); // shoulder highlight L
          r(18-as,17, 2,  4, skinS);          // shoulder shadow R
          r(0+as, 24, 4,  3, skinS);          // forearm shadow L
          r(16-as,24, 4,  3, skinS);
          // ── Neck ──────────────────────────────────────
          r(7, 13, 6, 5, skin);
          // ── Head (large, Sims rounded square) ─────────
          rr(2, 0, 16, 14, skin);
          r(2, 0,  2,  9, shade(skin, 8));  // left cheek light
          r(16,0,  2,  9, skinD);            // right shadow
          // ── Cheeks ────────────────────────────────────
          r(3, 8, 4, 3, blush);  r(13, 8, 4, 3, blush);
          // ── Eyes (Sims style: large, spaced) ──────────
          r(4,  3, 5, 5, "#fff");  r(11, 3, 5, 5, "#fff");
          r(5,  4, 3, 4, "#1a1a2e"); r(12, 4, 3, 4, "#1a1a2e");
          r(5,  4, 1, 1, "#e0e8ff"); r(12, 4, 1, 1, "#e0e8ff"); // catchlight
          r(4,  3, 1, 1, "#888"); r(11, 3, 1, 1, "#888"); // upper lash corner
          r(4,  8, 6, 1, "#1a1a2e"); r(11, 8, 6, 1, "#1a1a2e"); // lower lash
          // ── Nose (subtle triangle) ─────────────────────
          r(8, 8, 1, 2, skinS);  r(10, 8, 1, 2, skinS);  r(8,10, 4, 1, skinS);
          // ── Smile ─────────────────────────────────────
          r(6, 11, 8, 1, skinS);
          r(6, 11, 1, 2, skinS);  r(13, 11, 1, 2, skinS);
          // ── Ear lobes ─────────────────────────────────
          r(1, 5, 2, 4, skin);  r(17, 5, 2, 4, skin);
          r(1, 6, 1, 2, skinD); r(18, 6, 1, 2, skinS);

        } else if (d === "up") {
          r(2-ls, 38, 7, 5, SH);   r(11+ls, 38, 7, 5, SH);
          r(3-ls, 29, 6, 10, LS);  r(11+ls, 29, 6, 10, LS);
          r(4, 28, 12, 2, BELT);
          r(3, 17, 14, 12, TS);
          r(0-as, 17, 4, 10, skinD); r(16+as, 17, 4, 10, skinD);
          r(7, 13, 6, 5, skinD);
          rr(2, 0, 16, 14, shade(skin,-18));
          r(2, 0,  2,  9, shade(skin,-12)); r(16,0,  2,  9, shade(skin,-26));

        } else if (d === "left") {
          r(3, 38, 7, 5, SH);   r(10-ls, 38, 7, 5, SH);
          r(4, 29, 5, 10, LS);  r(9+ls, 29, 5, 10, L);
          r(4, 28, 12, 2, BELT);
          r(3, 17, 13, 12, T);  r(14, 17, 3, 12, TS);
          r(16+as, 17, 4, 10, skin);   // near arm
          r(1-as,  17, 3,  9, skinD);  // far arm
          r(7, 13, 5, 5, skin); r(11, 13, 2, 5, skinS);
          rr(2, 0, 14, 14, skin); r(14, 0, 4, 14, skinD);
          r(2, 0, 2, 9, shade(skin, 8));
          r(3, 8, 3, 3, blush);
          r(4, 3, 5, 5, "#fff"); r(5, 4, 3, 4, "#1a1a2e"); r(5, 4, 1, 1, "#e0e8ff");
          r(4, 8, 6, 1, "#1a1a2e");
          r(7, 8, 2, 2, skinS); r(6, 11, 6, 1, skinS);
          r(6, 11, 1, 2, skinS); r(11, 11, 1, 2, skinS);
          r(1, 5, 2, 4, skin); r(1, 6, 1, 2, skinD);
          // profile collar
          r(13, 17, 2, 4, COLLAR);

        } else { // right
          r(10+ls, 38, 7, 5, SH); r(3, 38, 7, 5, SH);
          r(11-ls, 29, 5, 10, L);  r(4, 29, 5, 10, LS);
          r(4, 28, 12, 2, BELT);
          r(4, 17, 13, 12, T);  r(3, 17, 3, 12, TS);
          r(0-as, 17, 4, 10, skin);   // near arm (right side)
          r(16+as, 17, 3,  9, skinD); // far arm
          r(8, 13, 5, 5, skin); r(7, 13, 2, 5, skinS);
          rr(4, 0, 14, 14, skin); r(2, 0, 4, 14, skinD);
          r(16,0, 2, 9, shade(skin,8));
          r(14, 8, 3, 3, blush);
          r(11, 3, 5, 5, "#fff"); r(12, 4, 3, 4, "#1a1a2e"); r(14, 4, 1, 1, "#e0e8ff");
          r(10, 8, 6, 1, "#1a1a2e");
          r(11, 8, 2, 2, skinS); r(8, 11, 6, 1, skinS);
          r(8, 11, 1, 2, skinS); r(13, 11, 1, 2, skinS);
          r(17, 5, 2, 4, skin); r(18, 6, 1, 2, skinS);
          r(5, 17, 2, 4, COLLAR);
        }

        // ── Hair ─────────────────────────────────────────────────
        const h = hair, hd = hairD, hl = hairL;
        if (npc.hairStyle === 0) { // short crop
          if (d==="down")  { rr(2,-3,16,6,h); r(3,-3,12,3,hl); r(1,2,3,4,hd); r(16,2,3,4,hd); }
          if (d==="up")    { rr(2,-3,16,7,h); r(3,-3,12,3,hl); }
          if (d==="left")  { rr(2,-3,13,6,h); r(3,-3,10,3,hl); r(13,-1,3,5,hd); }
          if (d==="right") { rr(5,-3,13,6,h); r(6,-3,10,3,hl); r(4,-1,3,5,hd); }
        } else if (npc.hairStyle === 1) { // side fringe
          if (d==="down")  { rr(2,-3,16,7,h); r(3,-3,12,3,hl); r(1,2,4,6,hd); r(15,2,4,6,hd); r(4,4,4,5,h); r(12,4,4,5,h); }
          if (d==="up")    { rr(2,-3,16,8,h); r(3,-3,12,3,hl); r(3,5,14,3,hd); }
          if (d==="left")  { rr(2,-3,14,7,h); r(3,-3,10,3,hl); r(2,3,5,6,hd); r(13,-1,4,6,h); }

      function drawWorldMap() {
        const W = canvas.width, H = canvas.height;

        // Dark overlay
        ctx.fillStyle = "rgba(4, 8, 18, 0.92)";
        ctx.fillRect(0, 0, W, H);

        // Choose scale so the map fits with margins
        const ts = Math.max(3, Math.floor(Math.min(W * 0.88, H * 0.82) / MAP_W));
        const mapW = MAP_W * ts, mapH = MAP_H * ts;
        const ox = Math.round((W - mapW) / 2);
        const oy = Math.round((H - mapH) / 2 + 12);

        // Tile colour palette for minimap
        const TC = {
          [TILE.GRASS]:      "#3d6e2a",
          [TILE.DARK_GRASS]: "#2a5018",
          [TILE.PATH]:       "#b8a86a",
          [TILE.STONE]:      "#7a6e5e",
          [TILE.WATER]:      "#3878c0",
          [TILE.TREE]:       "#1e4e14",
          [TILE.ROCK]:       "#5a5a4a",
          [TILE.FLOWERS]:    "#c860a8",
        };

        // Draw every tile
        for (let ty = 0; ty < MAP_H; ty++) {
          for (let tx = 0; tx < MAP_W; tx++) {
            const tile = map[ty][tx];
            ctx.fillStyle = TC[tile] || "#3d6e2a";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
          }
        }

        // Map border
        ctx.strokeStyle = "rgba(200,190,150,0.5)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(ox, oy, mapW, mapH);

        // ── Landmark labels ──────────────────────────────────────
        const labels = [
          { text: "Downtown",       tx: 28, ty:  6 },
          { text: "Park",           tx: 34, ty: 30 },
          { text: "Residential",    tx: 50, ty: 20 },
          { text: "💎 Prestige",    tx: 50, ty: 17 },
          { text: "🏰 Mansion",     tx: 73, ty:  4 },
          { text: "Slums",          tx:  5, ty: 38 },
          { text: "Docks",          tx: 48, ty: 55 },
          { text: "Sweet Dreams 🍬",tx: 58, ty: 51 },
          { text: "🎓 School",      tx: 35, ty: 44 },
          { text: "Eastern Hills",  tx: 80, ty: 30 },
          { text: "Southern Coast", tx: 48, ty: 75 },
        ];
        ctx.font = `bold ${Math.max(7, ts + 2)}px Trebuchet MS, Arial, sans-serif`;
        ctx.textAlign = "center";
        for (const lb of labels) {
          const lx = ox + lb.tx * ts, ly = oy + lb.ty * ts;
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillText(lb.text, lx + 1, ly + 1);
          ctx.fillStyle = "#f0e8c0";
          ctx.fillText(lb.text, lx, ly);
        }

        // ── NPC dots ─────────────────────────────────────────────
        const npcDotSize = Math.max(3, ts - 1);
        for (const npc of npcs) {
          const nx = ox + (npc.x / TILE_SIZE) * ts - npcDotSize / 2;
          const ny = oy + (npc.y / TILE_SIZE) * ts - npcDotSize / 2;
          ctx.fillStyle = npcNameColour(npc.id);
          ctx.fillRect(nx, ny, npcDotSize, npcDotSize);
        }

        // ── Dog dots ─────────────────────────────────────────────
        for (const dog of dogs) {
          const dx = ox + (dog.x / TILE_SIZE) * ts - 2;
          const dy = oy + (dog.y / TILE_SIZE) * ts - 2;
          ctx.fillStyle = dog.coat || "#c07a3a";
          ctx.fillRect(dx, dy, npcDotSize, npcDotSize);
        }

        // ── Player dot ───────────────────────────────────────────
        const px = ox + (player.x / TILE_SIZE) * ts;
        const py = oy + (player.y / TILE_SIZE) * ts;
        // Pulsing ring
        const pulse = 0.55 + 0.45 * Math.sin(game.elapsed * 5);
        ctx.strokeStyle = `rgba(255,240,80,${pulse})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px, py, ts + 1, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#ffe840";
        ctx.beginPath();
        ctx.arc(px, py, Math.max(2, ts - 1), 0, Math.PI * 2);
        ctx.fill();

        // ── Title and hint ───────────────────────────────────────
        ctx.textAlign = "center";
        ctx.font = "bold 18px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#f0e8c0";
        ctx.fillText("🗺  Moonlight City", W / 2, oy - 10);

        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,170,140,0.8)";
        ctx.fillText("Press X or B to close", W / 2, oy + mapH + 16);
        ctx.textAlign = "left";
      }

      function useInventoryItem(idx) {
        const items = game.save && game.save.inventory ? game.save.inventory : [];
        const item = items[idx];
        if (!item) return;
        if (item.hp && item.hp > 0) {
          const healed = Math.min(item.hp === 999 ? player.maxHp : item.hp, player.maxHp - player.hp);
          player.hp = Math.min(player.maxHp, player.hp + (item.hp === 999 ? player.maxHp : item.hp));
          if (game.save) game.save.player.hp = player.hp;
          showNotice(`Used ${item.emoji} ${item.name}! +${healed} HP 💗`, 2);
        }
        if (item.speed && item.speed > 0) {
          player.speedBoost = item.speed;
          showNotice(`Used ${item.emoji} ${item.name}! Speed boost for ${item.speed}s ⚡`, 2);
        }
        items.splice(idx, 1);
        inventory.selected = Math.min(inventory.selected, Math.max(0, items.length - 1));
        if (game.save) { game.save.inventory = items; writeSave(game.save); }
      }

      function drawInventory() {
        const W = canvas.width, H = canvas.height;
        const items = game.save && game.save.inventory ? game.save.inventory : [];

        // (input handled in tick loop)

        // Overlay
        ctx.fillStyle = "rgba(4, 8, 20, 0.88)";
        ctx.fillRect(0, 0, W, H);

        const mw = 360, mh = Math.max(240, 80 + items.length * 52 + 60);
        const mx = Math.round((W - mw) / 2), my = Math.round((H - Math.min(mh, H - 40)) / 2);
        const mhClamped = Math.min(mh, H - 40);

        // Panel
        ctx.fillStyle = "#0e1a2e";
        roundRect(ctx, mx, my, mw, mhClamped, 14);
        ctx.fill();
        ctx.strokeStyle = "#3a7aaa";
        ctx.lineWidth = 2;
        roundRect(ctx, mx, my, mw, mhClamped, 14);
        ctx.stroke();

        // Title
        ctx.textAlign = "center";
        ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#e8f4ff";
        ctx.fillText("🎒  Inventory", mx + mw / 2, my + 28);

        // Gold
        ctx.font = "13px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`⬡ ${getCarriedGold()} gold`, mx + mw / 2, my + 48);

        // Speed boost indicator
        if (player.speedBoost > 0) {
          ctx.fillStyle = "#80ffff";
          ctx.fillText(`⚡ Speed boost: ${Math.ceil(player.speedBoost)}s`, mx + mw / 2, my + 64);
        }

        const listTop = player.speedBoost > 0 ? my + 74 : my + 60;

        if (items.length === 0) {
          ctx.fillStyle = "rgba(140,160,180,0.6)";
          ctx.font = "14px Trebuchet MS, Arial, sans-serif";
          ctx.fillText("Your bag is empty.", mx + mw / 2, listTop + 40);
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "rgba(100,120,140,0.6)";
          ctx.fillText("Buy items at 🍬 Sweet Dreams in the docks!", mx + mw / 2, listTop + 62);
        } else {
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const iy = listTop + i * 52;
            if (iy + 52 > my + mhClamped - 40) break;
            const sel = i === inventory.selected;

            ctx.fillStyle = sel ? "rgba(58,122,200,0.35)" : "rgba(255,255,255,0.04)";
            roundRect(ctx, mx + 12, iy, mw - 24, 46, 8);
            ctx.fill();
            if (sel) {
              ctx.strokeStyle = "#4a9aee";
              ctx.lineWidth = 1.5;
              roundRect(ctx, mx + 12, iy, mw - 24, 46, 8);
              ctx.stroke();
            }

            // Emoji
            ctx.font = "22px serif";
            ctx.textAlign = "left";
            ctx.fillStyle = "#fff";
            ctx.fillText(item.emoji, mx + 22, iy + 31);

            // Name
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = "#e8f4ff";
            ctx.fillText(item.name, mx + 54, iy + 19);

            // Effect desc
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = "#8ab8d8";
            const desc = item.hp === 999 ? "Fully restores HP"
                       : item.hp > 0 ? `Restores ${item.hp} HP`
                       : item.speed > 0 ? `Speed boost for ${item.speed}s`
                       : "?";
            ctx.fillText(desc, mx + 54, iy + 35);

            // Use badge on selected
            if (sel) {
              ctx.textAlign = "right";
              ctx.font = "bold 11px Trebuchet MS, Arial, sans-serif";
              ctx.fillStyle = "#4aeeaa";
              ctx.fillText("E — Use", mx + mw - 18, iy + 26);
            }
          }
        }

        // Hint
        ctx.textAlign = "center";
        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(140,160,180,0.7)";
        ctx.fillText("↑↓ navigate  •  E to use  •  I or Esc to close", mx + mw / 2, my + mhClamped - 14);
        ctx.textAlign = "left";
      }

      function drawCheatBox(time) {
        const W = canvas.width, H = canvas.height;

        // Cheat toggle: 6 held + 7 pressed
        if (keys.d6 && justPressedKeys.d7) { cheatBox.open = !cheatBox.open; cheatBox.selected = 0; }
        if (cheatBox.open) {
          if (justPressedKeys.pause) { cheatBox.open = false; return; }
          if (justPressedKeys.up)   cheatBox.selected = (cheatBox.selected - 1 + CHEATS.length) % CHEATS.length;
          if (justPressedKeys.down) cheatBox.selected = (cheatBox.selected + 1) % CHEATS.length;
          if (justPressedKeys.interact || justPressedKeys.confirm) {
            const msg = CHEATS[cheatBox.selected].fn();
            cheatBox.flash = msg;
            cheatBox.flashTimer = 2;
          }
        }
        if (!cheatBox.open) return;

        // Dim
        ctx.fillStyle = "rgba(0,10,0,0.80)";
        ctx.fillRect(0, 0, W, H);

        const mw = 370, mh = 60 + CHEATS.length * 42 + 44;
        const mx = Math.round((W - mw) / 2), my = Math.round((H - mh) / 2);

        // Panel — dark green hacker feel
        ctx.fillStyle = "#041408";
        roundRect(ctx, mx, my, mw, mh, 10);
        ctx.fill();
        ctx.strokeStyle = "#00ff44";
        ctx.lineWidth = 2;
        roundRect(ctx, mx, my, mw, mh, 10);
        ctx.stroke();

        // Title
        ctx.textAlign = "center";
        ctx.font = "bold 15px 'Courier New', monospace";
        ctx.fillStyle = "#00ff44";
        ctx.fillText(">> CHEAT CONSOLE <<", mx + mw/2, my + 22);
        ctx.font = "10px 'Courier New', monospace";
        ctx.fillStyle = "#006622";
        ctx.fillText("access code: 6+7", mx + mw/2, my + 36);

        // Flash message
        if (cheatBox.flash) {
          ctx.fillStyle = "#ffff00";
          ctx.font = "bold 12px 'Courier New', monospace";
          ctx.fillText(cheatBox.flash, mx + mw/2, my + 52);
        }

        // Cheat entries
        for (let i = 0; i < CHEATS.length; i++) {
          const iy = my + 62 + i * 42;
          const sel = i === cheatBox.selected;

          ctx.fillStyle = sel ? "rgba(0,255,68,0.15)" : "rgba(0,255,68,0.03)";
          roundRect(ctx, mx+10, iy, mw-20, 36, 6);
          ctx.fill();
          if (sel) {
            ctx.strokeStyle = "#00ff44";
            ctx.lineWidth = 1;
            roundRect(ctx, mx+10, iy, mw-20, 36, 6);
            ctx.stroke();
          }

          ctx.textAlign = "left";
          ctx.font = sel ? "bold 13px 'Courier New', monospace" : "12px 'Courier New', monospace";
          ctx.fillStyle = sel ? "#00ff88" : "#008833";
          ctx.fillText((sel ? "> " : "  ") + CHEATS[i].label, mx + 20, iy + 23);
        }

        // Hint
        ctx.textAlign = "center";
        ctx.font = "10px 'Courier New', monospace";
        ctx.fillStyle = "#005520";
        ctx.fillText("↑↓ navigate  •  E/Enter to activate  •  Esc to close", mx + mw/2, my + mh - 12);
        ctx.textAlign = "left";
      }
