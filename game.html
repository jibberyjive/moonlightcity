      // ── Procedural Mine Floor Generator (floors 4–25) ───────────────
      // Deterministic seeded RNG so every floor is always the same layout
      function generateMineFloor(floorNum) {
        let seed = (floorNum * 2654435761) >>> 0;
        function rand() {
          seed = Math.imul(seed ^ seed >>> 15, 2246822519) >>> 0;
          seed = Math.imul(seed ^ seed >>> 13, 3266489917) >>> 0;
          seed = (seed ^ seed >>> 16) >>> 0;
          return seed / 4294967296;
        }
        function ri(lo, hi) { return lo + Math.floor(rand() * (hi - lo + 1)); }

        const W = 22, H = 16;
        const tiles = new Array(W * H).fill(DTILE.WALL);
        const setT  = (x, y, t) => { if (x > 0 && x < W-1 && y > 0 && y < H-1) tiles[y*W+x] = t; };
        const getT  = (x, y)    => (x >= 0 && x < W && y >= 0 && y < H) ? tiles[y*W+x] : DTILE.WALL;
        function carveRect(x1, y1, x2, y2) {
          for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) setT(x, y, DTILE.FLOOR);
        }
        function carveCorridor(ax, ay, bx, by) {
          const sx = ax < bx ? 1 : -1, sy = ay < by ? 1 : -1;
          for (let x = ax; x !== bx + sx; x += sx) setT(x, ay, DTILE.FLOOR);
          for (let y = ay; y !== by + sy; y += sy) setT(bx, y, DTILE.FLOOR);
        }

        // Carve rooms
        const numRooms = ri(4, 7);
        const rooms = [];
        for (let attempt = 0; attempt < numRooms * 4 && rooms.length < numRooms; attempt++) {
          const rw = ri(3, 6), rh = ri(3, 5);
          const rx = ri(1, W - rw - 2), ry = ri(1, H - rh - 2);
          carveRect(rx, ry, rx + rw - 1, ry + rh - 1);
          rooms.push({ x: rx, y: ry, w: rw, h: rh,
            cx: rx + Math.floor(rw/2), cy: ry + Math.floor(rh/2) });
        }
        if (rooms.length < 2) { // fallback: two guaranteed rooms
          carveRect(1, 1, 5, 4);   rooms.push({ x:1,  y:1,  w:5, h:4, cx:3,  cy:2  });
          carveRect(15, 10, 20, 14); rooms.push({ x:15, y:10, w:6, h:5, cx:17, cy:12 });
        }
        // Connect rooms with corridors
        for (let i = 1; i < rooms.length; i++) carveCorridor(rooms[i-1].cx, rooms[i-1].cy, rooms[i].cx, rooms[i].cy);

        // Tier determines visuals + enemies
        // 4–8 Upper Mines, 9–14 Deep Mines, 15–20 Crystal Caverns, 21–25 Lava Depths
        const tier = floorNum <= 8 ? 0 : floorNum <= 14 ? 1 : floorNum <= 20 ? 2 : 3;
        const tierEnemies = [
          ["cave_bat", "goblin"],
          ["goblin", "mine_crawler", "stone_golem"],
          ["crystal_spider", "crystal_golem", "mine_crawler"],
          ["lava_slime", "lava_bat", "lava_golem"]
        ][tier];

        // Scatter ore/crystal/lava decorations in walls
        const wallOre = tier <= 1 ? DTILE.ORE_VEIN : tier === 2 ? DTILE.CRYSTAL : DTILE.LAVA;
        for (let y = 1; y < H-1; y++) {
          for (let x = 1; x < W-1; x++) {
            if (getT(x, y) === DTILE.WALL && rand() < 0.055) setT(x, y, wallOre);
            // Deep floors: scatter lava pools on floor tiles
            if (tier === 3 && getT(x, y) === DTILE.FLOOR && rand() < 0.04) setT(x, y, DTILE.LAVA);
          }
        }

        // Player spawn (room 0, top-left corner)
        const spawnR = rooms[0];
        const playerSpawn = { x: spawnR.x + 1, y: spawnR.y + 1 };

        // Stairs down (last room, near bottom-right)
        const stairR = rooms[rooms.length - 1];
        const stairsPos = { x: stairR.x + stairR.w - 2, y: stairR.y + stairR.h - 2 };
        setT(stairsPos.x, stairsPos.y, DTILE.STAIRS_LOCKED);

        // Up-stairs = same as spawn
        const upStairsPos = { x: playerSpawn.x, y: playerSpawn.y };

        // Enemies — more and harder as floor increases
        const numEnemies = Math.min(3 + Math.floor(floorNum * 0.6), 12);
        const enemySpawns = [];
        const midRooms = rooms.slice(1, rooms.length - 1);
        const fightRooms = midRooms.length > 0 ? midRooms : rooms;
        for (let i = 0; i < numEnemies; i++) {
          const room = fightRooms[i % fightRooms.length];
          const ex = room.x + ri(0, room.w - 1);
          const ey = room.y + ri(0, room.h - 1);
          const etype = tierEnemies[i % tierEnemies.length];
          const ai = rand() < 0.45 ? "stationary" : "patrol";
          const sp = { type: etype, x: ex, y: ey, ai };
          if (ai === "patrol") {
            const px2 = Math.min(ex + ri(1, 3), room.x + room.w - 1);
            sp.patrol = [{ x: ex, y: ey }, { x: px2, y: ey }];
          }
          enemySpawns.push(sp);
        }

        // Chests (every 3 floors, in a mid room)
        const chests = [];
        if (floorNum % 3 === 0 && fightRooms.length > 0) {
          const cr = fightRooms[ri(0, fightRooms.length - 1)];
          chests.push({ x: cr.x + 1, y: cr.y + 1, opened: false });
        }

        // Barrels
        const barrels = [];
        if (rand() < 0.65 && rooms.length > 1) {
          const br = rooms[ri(0, rooms.length - 1)];
          barrels.push({ x: br.x, y: br.y, broken: false });
        }

        return { w: W, h: H, tiles: Array.from(tiles), playerSpawn, stairsPos, upStairsPos, chests, barrels, enemySpawns };
      }

      // Populate floors 4–25
      for (let _f = 4; _f <= 25; _f++) FLOOR_DATA.push(generateMineFloor(_f));

      function clamp(value, min, max) {

      function lerp(a, b, t) {

      function noise(x, y, seed = 0) {

        const n = parseInt(hex.slice(1), 16);
        const r = clamp(((n >> 16) & 255) + amt, 0, 255);
        const g = clamp(((n >> 8) & 255) + amt, 0, 255);
        const b = clamp((n & 255) + amt, 0, 255);
        return `rgb(${r},${g},${b})`;
      }

      function migrateSave(raw) {
        let save = raw || createNewSave();
        if (typeof save.gold === "number") {
          save.gold = { carried: save.gold, banked: 0 };
        }
        if (typeof save.version !== "number") save.version = 0;
        while (save.version < SCHEMA_VERSION) {
          switch (save.version) {
            case 0:
              save.gold        = save.gold        || { carried: 0, banked: 0 };
              save.relationships = save.relationships || { ella: 0, rex: 0, lumi: 0 };
              save.version = 1;
              break;
            case 1:
              save.friendship = save.friendship || { ella: 0, will: 0, pipper: 0, rose: 0, lumi: 0, rex: 0, mabel: 0, finn: 0, doc: 0, nora: 0, sam: 0, cleo: 0 };
              save.married  = save.married  ?? null;
              save.hasRing  = save.hasRing  ?? false;
              save.version = 2;
              break;
            case 2:
              save.ownedPets = Array.isArray(save.ownedPets) ? save.ownedPets : [];
              save.marriageDay = save.marriageDay || 0;
              save.hasBaby = !!save.hasBaby;
              save.version = 3;
              break;
            default:
              return createNewSave();
          }
        }
        // Fill any missing keys from a fresh save (safe forward-compat)
        const fresh = createNewSave();
        save.player    = Object.assign({}, fresh.player,    save.player);
        save.gold      = Object.assign({}, fresh.gold,      save.gold);
        save.dungeon   = Object.assign({}, fresh.dungeon,   save.dungeon);
        save.house     = Object.assign({}, fresh.house,     save.house);
        save.flags     = Object.assign({}, fresh.flags,     save.flags);
        save.time      = Object.assign({}, fresh.time,      save.time);
        save.houseUpgrades = Array.isArray(save.houseUpgrades) ? save.houseUpgrades.slice() : fresh.houseUpgrades.slice();
        save.ownedHouses   = Array.isArray(save.ownedHouses)   ? save.ownedHouses.slice()   : fresh.ownedHouses.slice();
        save.ownedPets     = Array.isArray(save.ownedPets)     ? save.ownedPets.slice()     : fresh.ownedPets.slice();
        save.friendship    = Object.assign({}, fresh.friendship, save.friendship || {});
        if (save.married  === undefined) save.married  = null;
        if (save.marriageDay === undefined) save.marriageDay = 0;
        if (save.hasBaby === undefined) save.hasBaby = false;
        if (save.hasRing  === undefined) save.hasRing  = false;
        return save;
      }

      const map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(TILE.GRASS));

      function setTile(x, y, type) {
        if (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H) {
          map[y][x] = type;
        }
      }

      function fillRectTiles(x, y, w, h, type) {
        for (let yy = y; yy < y + h; yy++) {
          for (let xx = x; xx < x + w; xx++) {
            setTile(xx, yy, type);
          }
        }
      }

      function stampTiles(points, type) {
        for (const [x, y] of points) {
          setTile(x, y, type);
        }
      }

      function paintLine(points, radius, type) {
        for (let i = 0; i < points.length - 1; i++) {
          const [x1, y1] = points[i];
          const [x2, y2] = points[i + 1];
          const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) * 3 + 1;
          for (let step = 0; step <= steps; step++) {
            const t = step / steps;
            const x = x1 + (x2 - x1) * t;
            const y = y1 + (y2 - y1) * t;
            for (let oy = -radius; oy <= radius; oy++) {
              for (let ox = -radius; ox <= radius; ox++) {
                if (ox * ox + oy * oy <= radius * radius + 0.2) {
                  setTile(Math.round(x + ox), Math.round(y + oy), type);
                }
              }
            }
          }
        }
      }

      function createPlayer(save) {
        const s = save ? save.player : {};
        const maxHp = s.hpMax || s.maxHp || 30;
        return {
          x: s.spawn ? s.spawn.x : 20 * TILE_SIZE + TILE_SIZE / 2,
          y: s.spawn ? s.spawn.y : 13 * TILE_SIZE + TILE_SIZE / 2,
          vx: 0, vy: 0,
          radius: 9, speed: 96, accel: 700, speedBoost: 0,
          dir: "down", walkTime: 0,
          hp: clamp(s.hp == null ? maxHp : s.hp, 0, maxHp),
          maxHp,
          attackCooldown: 0,
          skin:       s.skin       || 0,
          hairStyle:  s.hairStyle  || 0,
          hairColour: s.hairColour || 0,
          outfit:     s.outfit     || 0,
          ageType:    s.ageType    || "adult"
        };
      }

          dir: "down",

      function createOwnedPetEntity(petId, followSlot = 0, spawnX = player.x, spawnY = player.y) {
        const pet = PETS_FOR_SALE.find(p => p.id === petId);
        if (!pet) return null;
        const offsetX = 24 + (followSlot % 3) * 16;
        const offsetY = 24 + Math.floor(followSlot / 3) * 16;
        return {
          id: `pet_${pet.id}`,
          name: pet.name,
          kind: pet.kind,
          isOwnedPet: true,
          followSlot,
          homeX: spawnX + offsetX,
          homeY: spawnY + offsetY,
          x: spawnX + offsetX,
          y: spawnY + offsetY,
          vx: 0, vy: 0, dir: "right", walkTime: 0, wagTime: followSlot * 0.8,
          wanderTimer: 1, targetX: spawnX + offsetX, targetY: spawnY + offsetY, chasing: false,
          coat: pet.color, coatD: shade(pet.color, -28), ridge: shade(pet.color, -38),
          ear: shade(pet.color, -18), nose: "#1a0800", eye: pet.kind === "cat" ? "#2a9d8f" : "#3a1800",
          belly: shade(pet.color, 16), emoji: pet.emoji

      function updateNpcs(dt) {
        for (const npc of npcs) {
          if (npc.isFollowingSpouse) {
            const spouseNpc = npcs.find(n => n.id === npc.spouseId);
            const target = spouseNpc || player;
            const dx = target.x - npc.x, dy = target.y - npc.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 36) {
              const spd = 50;
              npc.vx = (dx / dist) * spd;
              npc.vy = (dy / dist) * spd;
              npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              npc.x += npc.vx * dt; npc.y += npc.vy * dt;
              npc.walkTime += dt * 2;
            } else {
              npc.vx *= 0.8; npc.vy *= 0.8;
            }
            continue;
          }
          // Married NPC follows the player
          if (npc.married && game.scene === SCENE.CITY) {
            const dx = player.x - npc.x, dy = player.y - npc.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 52) {
              const spd = 70;
              npc.vx = (dx / dist) * spd;
              npc.vy = (dy / dist) * spd;
              npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              npc.x += npc.vx * dt; npc.y += npc.vy * dt;
              npc.walkTime += dt * 2;
            } else {
              npc.vx *= 0.8; npc.vy *= 0.8;
            }
            continue;
          }
          npc.wanderTimer -= dt;
          if (npc.wanderTimer <= 0) {
            const angle = Math.random() * Math.PI * 2;
            const dist  = 24 + Math.random() * 48;
            npc.targetX    = npc.homeX + Math.cos(angle) * dist;
            npc.targetY    = npc.homeY + Math.sin(angle) * dist;
            npc.wanderTimer = 2.5 + Math.random() * 4;
          }
          const dx = npc.targetX - npc.x;
          const dy = npc.targetY - npc.y;
          const d  = Math.hypot(dx, dy);
          if (d > 6) {
            const spd = 26;
            npc.vx = (dx / d) * spd;
            npc.vy = (dy / d) * spd;
            npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
            npc.walkTime += dt * 5;
          } else {
            npc.vx = 0; npc.vy = 0;
          }
          npc.x += npc.vx * dt;
          npc.y += npc.vy * dt;
        }
      }

      function updateDogs(dt) {
        for (const dog of dogs) {
          dog.wagTime += dt * 6;

          const distToPlayer = Math.hypot(player.x - dog.x, player.y - dog.y);

          if (dog.isOwnedPet) {
            const angle = Math.PI * 0.9 + dog.followSlot * 0.85;
            const targetX = player.x + Math.cos(angle) * 28;
            const targetY = player.y + Math.sin(angle) * 20;
            const dx = targetX - dog.x, dy = targetY - dog.y;
            const d = Math.hypot(dx, dy) || 1;
            if (d > 12) {
              const spd = dog.kind === "cat" ? 78 : 74;
              dog.vx = (dx / d) * spd;
              dog.vy = (dy / d) * spd;
              dog.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              dog.walkTime += dt * 9;
            } else {
              dog.vx *= 0.65;
              dog.vy *= 0.65;
            }
            dog.x += dog.vx * dt;
            dog.y += dog.vy * dt;
            continue;
          }

          if (distToPlayer < 80 && distToPlayer > 20) {
            // Chase player when nearby
            dog.chasing = true;
            const dx = player.x - dog.x, dy = player.y - dog.y;
            const d = Math.hypot(dx, dy) || 1;
            const spd = 72;
            dog.vx = (dx / d) * spd;
            dog.vy = (dy / d) * spd;
            dog.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
            dog.walkTime += dt * 9;
          } else {
            dog.chasing = false;
            dog.wanderTimer -= dt;
            if (dog.wanderTimer <= 0) {
              const angle = Math.random() * Math.PI * 2;
              const dist  = 20 + Math.random() * 60;
              dog.targetX = dog.homeX + Math.cos(angle) * dist;
              dog.targetY = dog.homeY + Math.sin(angle) * dist;
              dog.wanderTimer = 1.5 + Math.random() * 3;
            }
            const dx = dog.targetX - dog.x, dy = dog.targetY - dog.y;
            const d  = Math.hypot(dx, dy);
            if (d > 6) {
              const spd = 38;
              dog.vx = (dx / d) * spd;
              dog.vy = (dy / d) * spd;
              dog.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              dog.walkTime += dt * 7;
            } else {
              dog.vx = 0; dog.vy = 0;
            }
          }

          dog.x += dog.vx * dt;
          dog.y += dog.vy * dt;
        }
      }

      function drawDogSprite(time, dog) {
        if (dog.kind === "cat") {
          const coat = dog.coat || "#808080";
          const coatD = dog.coatD || shade(coat, -28);
          const belly = dog.belly || shade(coat, 18);
          const eye = dog.eye || "#3a1800";
          const x = dog.x, y = dog.y;
          const moving = Math.hypot(dog.vx, dog.vy) > 6;
          const frame = moving ? Math.floor(dog.walkTime) % 4 : 0;
          const pawA = [0, 2, 0, -2][frame];
          const pawB = [0, -2, 0, 2][frame];
          const tail = Math.sin(dog.wagTime * 1.3) * 5;
          const px = x - 10, py = y - 9;
          function r(rx, ry, rw, rh, c) {
            ctx.fillStyle = c;
            ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
          }
          ctx.fillStyle = "rgba(0,0,0,0.18)";
          ctx.beginPath();
          ctx.ellipse(x, y + 7, 9, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          if (dog.dir === "left") {
            r(15, 1 + tail * 0.35, 3, 2, coatD);
            r(4, 5, 10, 6, coat);
            r(5, 9, 8, 2, belly);
            r(4, 10 + pawA, 2, 4, coatD); r(10, 10 + pawB, 2, 4, coatD);
            r(0, 2, 6, 7, coat); r(1, 0, 2, 3, coatD); r(3, 0, 2, 3, coatD);
            r(1, 1, 1, 2, eye); r(0, 5, 2, 2, "#f3d0d0");
          } else {
            r(2, 1 + tail * 0.35, 3, 2, coatD);
            r(6, 5, 10, 6, coat);
            r(7, 9, 8, 2, belly);
            r(8, 10 + pawA, 2, 4, coatD); r(14, 10 + pawB, 2, 4, coatD);
            r(14, 2, 6, 7, coat); r(15, 0, 2, 3, coatD); r(17, 0, 2, 3, coatD);
            r(18, 1, 1, 2, eye); r(18, 5, 2, 2, "#f3d0d0");
          }
          return;
        }
        const coat   = dog.coat  || "#c07a3a";
        const coatD  = dog.coatD || shade(coat, -30);
        const ridge  = dog.ridge || shade(coat, -40);
        const ear    = dog.ear   || shade(coat, -20);
        const nose   = dog.nose  || "#1a0800";
        const eye    = dog.eye   || "#3a1800";
        const belly  = dog.belly || shade(coat, 18);

        const moving = Math.hypot(dog.vx, dog.vy) > 6;
        const frame  = moving ? Math.floor(dog.walkTime) % 4 : 0;
        const legA   = [0, 3, 0, -3][frame];   // front leg pair swing
        const legB   = [0, -3, 0, 3][frame];   // back leg pair swing
        // Tail wag — always wagging
        const wag = Math.sin(dog.wagTime) * 4;

        const x = dog.x, y = dog.y;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.20)";
        ctx.beginPath();
        ctx.ellipse(x, y + 6, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        const px = x - 11, py = y - 8;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        const d = dog.dir;

        if (d === "right") {
          // Tail (left/back), wagging vertically
          r(0, 2 + wag * 0.4, 3, 2, coat);
          r(-1, 0 + wag * 0.7, 3, 2, coatD);
          // Body
          r(2, 5, 14, 6, coat);
          r(3, 5, 12, 2, ridge);   // ridge stripe on back
          r(3, 10, 11, 1, belly);  // belly highlight
          // Back legs
          r(3, 10 + legB, 3, 5, coat); r(5, 10 + legB, 2, 5, coatD);
          // Front legs
          r(11, 10 + legA, 3, 5, coat); r(12, 10 + legA, 2, 5, coatD);
          // Neck
          r(15, 2, 3, 6, coat);
          // Head
          r(15, 0, 7, 8, coat);
          // Ear
          r(16, -2, 3, 5, ear);
          // Muzzle
          r(19, 3, 4, 4, coatD);
          // Eye
          r(17, 2, 2, 2, eye);  r(17, 2, 1, 1, "#fff"); // white glint
          // Nose
          r(22, 4, 1, 2, nose);

        } else if (d === "left") {
          // Tail (right/back), wagging
          r(19, 2 + wag * 0.4, 3, 2, coat);
          r(20, 0 + wag * 0.7, 3, 2, coatD);
          // Body
          r(6, 5, 14, 6, coat);
          r(7, 5, 12, 2, ridge);
          r(7, 10, 11, 1, belly);
          // Back legs
          r(14, 10 + legB, 3, 5, coat); r(14, 10 + legB, 2, 5, coatD);
          // Front legs
          r(6, 10 + legA, 3, 5, coat);  r(6, 10 + legA, 2, 5, coatD);
          // Neck
          r(4, 2, 3, 6, coat);
          // Head
          r(0, 0, 7, 8, coat);
          // Ear
          r(3, -2, 3, 5, ear);
          // Muzzle
          r(0, 3, 4, 4, coatD);
          // Eye
          r(3, 2, 2, 2, eye);  r(4, 2, 1, 1, "#fff");
          // Nose
          r(0, 4, 1, 2, nose);

        } else if (d === "down") {
          // Body (front view — short & wide)
          r(3, 6, 16, 6, coat);
          r(4, 6, 14, 2, ridge);
          // Front legs
          r(3, 11 + legA, 3, 5, coat); r(16, 11 + legA, 3, 5, coat);
          // Neck
          r(8, 2, 6, 5, coat);
          // Head
          r(5, -2, 12, 10, coat);
          // Ears (floppy sides)
          r(3, -1, 4, 6, ear); r(15, -1, 4, 6, ear);
          // Eyes
          r(8, 1, 2, 2, eye);  r(8, 1, 1, 1, "#fff");
          r(12, 1, 2, 2, eye); r(12, 1, 1, 1, "#fff");
          // Muzzle
          r(8, 4, 6, 4, coatD);
          // Nose
          r(10, 5, 2, 2, nose);
          // Tail wag (behind body — barely visible)
          r(10, 11 + wag * 0.3, 3, 3, coat);

        } else { // up — back view
          // Tail (top centre), wagging side to side
          r(8, -3 + wag * 0.4, 3, 6, coat);
          r(9, -5 + wag * 0.6, 2, 4, coatD);
          // Body
          r(3, 2, 16, 6, coat);
          r(4, 2, 14, 2, ridge);
          // Butt
          r(5, 7, 12, 3, coatD);
          // Back legs
          r(3, 8 + legB, 3, 5, coat); r(16, 8 + legB, 3, 5, coat);
          // Head (back of head — just a rounded lump)
          r(6, -2, 10, 6, coat);
          r(5, -1, 2, 4, ear); r(15, -1, 2, 4, ear);
        }

        // Name tag when player nearby
        if (Math.hypot(player.x - dog.x, player.y - dog.y) < 60) {
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.65)";
          ctx.fillRect(Math.round(x - 20), Math.round(y - 24), 40, 14);
          ctx.fillStyle = "#f5d080";
          ctx.font = "bold 9px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`${dog.name} 🐾`, Math.round(x), Math.round(y - 13));
          ctx.textAlign = "left";
          ctx.restore();
        }
      }

      function isBlockingTile(tx, ty) {
        if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
        return BLOCKING.has(map[ty][tx]);
      }

      function collidesCircle(x, y, radius) {
        const minX = Math.floor((x - radius) / TILE_SIZE);
        const maxX = Math.floor((x + radius) / TILE_SIZE);
        const minY = Math.floor((y - radius) / TILE_SIZE);
        const maxY = Math.floor((y + radius) / TILE_SIZE);
        for (let ty = minY; ty <= maxY; ty++) {
          for (let tx = minX; tx <= maxX; tx++) {
            if (!isBlockingTile(tx, ty)) continue;
            const tileX = tx * TILE_SIZE;
            const tileY = ty * TILE_SIZE;
            const nearestX = clamp(x, tileX, tileX + TILE_SIZE);
            const nearestY = clamp(y, tileY, tileY + TILE_SIZE);
            const dx = x - nearestX, dy = y - nearestY;
            if (dx * dx + dy * dy < radius * radius) return true;
          }
        }
        return false;
      }

      function movePlayer(dt) {
        let inputX = 0, inputY = 0;
        if (keys.left)  inputX -= 1;
        if (keys.right) inputX += 1;
        if (keys.up)    inputY -= 1;
        if (keys.down)  inputY += 1;

        const len = Math.hypot(inputX, inputY) || 1;
        inputX /= len; inputY /= len;

        // Tick speed boost
        if (player.speedBoost > 0) {
          player.speedBoost = Math.max(0, player.speedBoost - dt);
        }
        const effectiveSpeed = player.speed * (player.speedBoost > 0 ? 1.7 : 1);

        const targetVX = inputX * effectiveSpeed;
        const targetVY = inputY * effectiveSpeed;
        const step = player.accel * dt;

        player.vx += clamp(targetVX - player.vx, -step, step);
        player.vy += clamp(targetVY - player.vy, -step, step);

        if (Math.abs(inputX) > 0.01 || Math.abs(inputY) > 0.01) {
          if (Math.abs(inputX) > Math.abs(inputY)) {
            player.dir = inputX > 0 ? "right" : "left";
          } else {
            player.dir = inputY > 0 ? "down" : "up";
          }
        }

        const moving = Math.hypot(player.vx, player.vy) > 4;
        if (moving) {
          player.walkTime += dt * 9;
        }

        const nextX = player.x + player.vx * dt;
        if (!collidesCircle(nextX, player.y, player.radius)) {
          player.x = nextX;
        } else {
          player.vx = 0;
        }

        const nextY = player.y + player.vy * dt;
        if (!collidesCircle(player.x, nextY, player.radius)) {
          player.y = nextY;
        } else {
          player.vy = 0;
        }

        player.x = clamp(player.x, player.radius, WORLD_W - player.radius);
        player.y = clamp(player.y, player.radius, WORLD_H - player.radius);
      }
