      function drawWorld(time, view) {
        const startX = clamp(Math.floor(camera.x / TILE_SIZE) - 2, 0, MAP_W - 1);
        const startY = clamp(Math.floor(camera.y / TILE_SIZE) - 2, 0, MAP_H - 1);
        const endX = clamp(Math.ceil((camera.x + view.worldW) / TILE_SIZE) + 2, 0, MAP_W - 1);
        const endY = clamp(Math.ceil((camera.y + view.worldH) / TILE_SIZE) + 2, 0, MAP_H - 1);

        for (let y = startY; y <= endY; y++) {
          for (let x = startX; x <= endX; x++) {
            drawGroundTile(map[y][x], x, y, time);
          }
        }

        const lateObstacles = [];
        for (let y = startY; y <= endY; y++) {
          for (let x = startX; x <= endX; x++) {
            const tile = map[y][x];
            if (tile !== TILE.TREE && tile !== TILE.ROCK) continue;
            const baseY = y * TILE_SIZE + (tile === TILE.TREE ? 28 : 24);
            if (baseY <= player.y + 4) {
              drawObstacle(tile, x, y, time);
            } else {
              lateObstacles.push([tile, x, y]);
            }
          }
        }

        // Draw all characters (player + NPCs) sorted by Y so taller-Y sprites appear in front
        const chars = [{ isPlayer: true, y: player.y }];
        for (const npc of npcs) chars.push({ isPlayer: false, isDog: false, y: npc.y, npc });
        for (const dog of dogs) chars.push({ isPlayer: false, isDog: true, y: dog.y, dog });
        chars.sort((a, b) => a.y - b.y);

        for (const c of chars) {
          if (c.isPlayer) drawPlayer(time);
          else if (c.isDog) drawDogSprite(time, c.dog);
          else drawNpcSprite(time, c.npc);
        }

        for (const [tile, x, y] of lateObstacles) {
          drawObstacle(tile, x, y, time);
        }
      }

      function drawCityHUD(save) {
        ctx.save();
        const day = save ? save.time.currentDay : 1;
        const name = save ? save.player.name : "";

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(14, 12, 178, 36);
        ctx.fillRect(canvas.width - 140, 12, 126, 36);

        ctx.fillStyle = "#f3f7e8";
        ctx.font = "bold 22px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Moonlight City", 24, 37);

        ctx.font = "bold 18px Trebuchet MS, Arial, sans-serif";
        const dayText = name ? `${name}  ·  Day ${day}` : `Day ${day}`;
        const dayWidth = ctx.measureText(dayText).width;
        ctx.fillText(dayText, canvas.width - 26 - dayWidth, 37);

        // Clock display
        if (save) {
          const _ch = save.time.currentHour, _cm = Math.floor(save.time.currentMinute);
          const _ampm = _ch >= 12 ? "PM" : "AM";
          const _h12  = _ch % 12 || 12;
          const _clockStr = `${_h12}:${String(_cm).padStart(2,"0")} ${_ampm}`;
          const _isNight = _ch >= 20 || _ch < 8;
          ctx.fillStyle = "rgba(0,0,0,0.28)";
          const _cw = ctx.measureText(_clockStr).width + 16;
          ctx.fillRect(canvas.width - _cw - 4, 52, _cw + 4, 20);
          ctx.fillStyle = _isNight ? "#aac8ff" : "#ffe8a0";
          ctx.font = "bold 12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "right";
          ctx.fillText((_isNight ? "🌙 " : "☀️ ") + _clockStr, canvas.width - 10, 66);
          ctx.textAlign = "left";
        }

        // Inventory + gold badge
        const inv = save && save.inventory ? save.inventory : [];
        const invText = `🎒 ${inv.length}  ⬡ ${getCarriedGold()}`;
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        const badgeW = ctx.measureText(invText).width + 20;
        ctx.fillRect(14, 54, badgeW, 24);
        ctx.fillStyle = inv.length > 0 ? "#e8f4ff" : "#607080";
        ctx.font = "12px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(invText, 24, 70);
        const seasonText = game.save ? getSeason(game.save.time.currentDay) : "";
        const weatherIcon = weather.type === "rain" ? " 🌧️" : weather.type === "snow" ? " ❄️" : "";
        const seasonShown = !!seasonText;
        if (seasonShown) {
          ctx.fillStyle = "rgba(0,0,0,0.28)";
          const seasonW = ctx.measureText(seasonText + weatherIcon).width + 20;
          ctx.fillRect(14, 78, seasonW, 20);
          ctx.fillStyle = "#e8f8e8";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(seasonText + weatherIcon, 24, 92);
        }
        // Speed boost indicator on HUD
        if (player.speedBoost > 0) {
          ctx.fillStyle = "rgba(0,0,0,0.28)";
          const boostY = seasonShown ? 102 : 82;
          ctx.fillRect(14, boostY, 120, 20);
          ctx.fillStyle = "#80ffff";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(`⚡ Speed boost: ${Math.ceil(player.speedBoost)}s`, 20, boostY + 14);
        }

        ctx.restore();
      }

      function drawNotice() {
        if (!game.noticeText || game.noticeTimer <= 0) return;
        ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
        const textW = Math.max(220, ctx.measureText(game.noticeText).width + 36);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(canvas.width / 2 - textW / 2, 16, textW, 30);
        ctx.fillStyle = "#f0e8c8";
        ctx.textAlign = "center";
        ctx.fillText(game.noticeText, canvas.width / 2, 37);
        ctx.textAlign = "left";
      }

      function updateWeather(dt, day) {
        weather.changeTimer -= dt;
        if (weather.changeTimer <= 0) {
          weather.changeTimer = 60 + Math.random() * 120;
          const si = getSeasonIdx(day);
          const r = Math.random();
          if (si === 3) weather.type = r < 0.6 ? "snow" : "clear";
          else if (si === 2) weather.type = r < 0.35 ? "rain" : "clear";
          else if (si === 0) weather.type = r < 0.2 ? "rain" : "clear";
          else weather.type = "clear";
          if (weather.type === "clear") weather.particles.length = 0;
        }
        if (weather.type !== "clear") {
          const maxP = weather.type === "rain" ? 180 : 100;
          while (weather.particles.length < maxP) {
            weather.particles.push({
              x: Math.random() * canvas.width, y: -10,
              vx: weather.type === "rain" ? -0.8 : (Math.random() - 0.5) * 0.4,
              vy: weather.type === "rain" ? 9 + Math.random() * 4 : 1 + Math.random() * 1.5,
              size: weather.type === "snow" ? 1.5 + Math.random() * 2 : 1,
              alpha: 0.35 + Math.random() * 0.45
            });
          }
          for (const p of weather.particles) {
            p.x += p.vx * dt * 60;
            p.y += p.vy * dt * 60;
            if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
            if (p.x < -10) p.x = canvas.width + 10;
          }
        }
      }

      function drawWeather() {
        if (weather.type === "clear") return;
        if (weather.type === "rain") {
          ctx.save();
          ctx.strokeStyle = "rgba(160,200,255,0.45)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (const p of weather.particles) {
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 4, p.y + p.vy * 4);
          }
          ctx.stroke();
          ctx.fillStyle = "rgba(10,20,50,0.15)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        } else {
          ctx.save();
          for (const p of weather.particles) {
            ctx.fillStyle = `rgba(240,248,255,${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = "rgba(200,215,240,0.07)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        }
      }

      function drawDungeon(time) {
        if (!dungeon.data) return;

        const data = dungeon.data;
        const dungeonW = data.w * DTILE_SIZE;
        const dungeonH = data.h * DTILE_SIZE;
        const offX = dungeonW < canvas.width ? Math.floor((canvas.width - dungeonW) / 2) : -camera.x;
        const offY = dungeonH < canvas.height ? Math.floor((canvas.height - dungeonH) / 2) : -camera.y;

        // ── Per-floor colour theme ─────────────────────────────────
        const _fl = dungeon.floor;
        const _tier = _fl <= 3 ? -1 : _fl <= 8 ? 0 : _fl <= 14 ? 1 : _fl <= 20 ? 2 : 3;
        const _themes = [
          { bg:"#080a10", fl:"#1a1e2a", flHi:"#222838", wall:"#3a2a18", wHi:"#4a3820", wAcc:"#8a5a2a", wDecor:"#5a4828" }, // sewer
          { bg:"#0c0906", fl:"#1c1610", flHi:"#241c14", wall:"#3c2c18", wHi:"#4a3820", wAcc:"#c87830", wDecor:"#6a5030" }, // upper mines
          { bg:"#060808", fl:"#141820", flHi:"#1a1e28", wall:"#222222", wHi:"#2e2e2e", wAcc:"#909090", wDecor:"#303030" }, // deep mines
          { bg:"#080a18", fl:"#101828", flHi:"#181e38", wall:"#182038", wHi:"#202848", wAcc:"#60b8f0", wDecor:"#203048" }, // crystal caverns
          { bg:"#100804", fl:"#1e1008", flHi:"#281408", wall:"#2a1008", wHi:"#381808", wAcc:"#ff6020", wDecor:"#402008" }, // lava depths
        ];
        const TC = _themes[_tier + 1] || _themes[0];
        const _tierLabel = ["Sewer","Upper Mines","Deep Mines","Crystal Caverns","Lava Depths"][_tier + 1] || "Sewer";

        ctx.fillStyle = TC.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const startTX = Math.max(0, Math.floor((camera.x || 0) / DTILE_SIZE) - 1);
        const startTY = Math.max(0, Math.floor((camera.y || 0) / DTILE_SIZE) - 1);
        const endTX = Math.min(data.w - 1, Math.ceil(((camera.x || 0) + canvas.width) / DTILE_SIZE) + 1);
        const endTY = Math.min(data.h - 1, Math.ceil(((camera.y || 0) + canvas.height) / DTILE_SIZE) + 1);

        for (let ty = startTY; ty <= endTY; ty++) {
          for (let tx = startTX; tx <= endTX; tx++) {
            const t = dungeon.tiles[ty * data.w + tx];
            const px = tx * DTILE_SIZE + offX;
            const py = ty * DTILE_SIZE + offY;

            // ── Wall ─────────────────────────────────────────────
            if (t === DTILE.WALL) {
              ctx.fillStyle = TC.wall;
              ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);
              ctx.fillStyle = TC.wHi;
              ctx.fillRect(px + 2, py + 2, DTILE_SIZE - 4, 4);
              if ((tx * 7 + ty * 13) % 5 === 0) {
                ctx.fillStyle = TC.wDecor;
                ctx.fillRect(px + 4, py + DTILE_SIZE - 7, DTILE_SIZE - 8, 5);
              }
              continue;
            }

            // ── Ore vein (glowing ore in wall tile) ───────────────
            if (t === DTILE.ORE_VEIN) {
              ctx.fillStyle = TC.wall;
              ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);
              const oreCol = _tier <= 0 ? "#d09030" : "#b0b0c0";
              ctx.fillStyle = oreCol;
              ctx.fillRect(px + 5, py + 7, 9, 7);
              ctx.fillRect(px + 17, py + 13, 7, 6);
              ctx.fillRect(px + 9, py + 19, 10, 5);
              ctx.fillStyle = "rgba(255,255,200,0.5)";
              ctx.fillRect(px + 6, py + 8, 3, 2);
              ctx.fillRect(px + 18, py + 14, 2, 2);
              continue;
            }

            // ── Crystal vein (pulsing blue/teal) ──────────────────
            if (t === DTILE.CRYSTAL) {
              ctx.fillStyle = TC.wall;
              ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);
              const cp = 0.5 + 0.5 * Math.sin(time * 2.5 + tx * 1.3 + ty * 0.7);
              ctx.fillStyle = `rgba(60,190,255,${0.55 + 0.35 * cp})`;
              ctx.beginPath();
              ctx.moveTo(px + 8, py + DTILE_SIZE - 3);
              ctx.lineTo(px + 13, py + 5);
              ctx.lineTo(px + 18, py + DTILE_SIZE - 3);
              ctx.fill();
              ctx.beginPath();
              ctx.moveTo(px + 17, py + DTILE_SIZE - 3);
              ctx.lineTo(px + 23, py + 9);
              ctx.lineTo(px + 29, py + DTILE_SIZE - 3);
              ctx.fill();
              ctx.fillStyle = `rgba(200,240,255,${0.35 + 0.2 * cp})`;
              ctx.fillRect(px + 11, py + 8, 3, 10);
              ctx.fillRect(px + 21, py + 12, 2, 7);
              continue;
            }

            // ── Floor ─────────────────────────────────────────────
            ctx.fillStyle = (tx + ty) % 2 === 0 ? TC.fl : TC.flHi;
            ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);

            // ── Lava pool (animated, damages player) ──────────────
            if (t === DTILE.LAVA) {
              const lp = 0.5 + 0.5 * Math.sin(time * 1.8 + tx * 0.9 + ty * 1.1);
              ctx.fillStyle = `rgba(220,55,0,${0.75 + 0.2 * lp})`;
              ctx.fillRect(px + 2, py + 2, DTILE_SIZE - 4, DTILE_SIZE - 4);
              ctx.fillStyle = `rgba(255,170,0,${0.4 + 0.35 * lp})`;
              ctx.beginPath();
              ctx.ellipse(px + DTILE_SIZE/2, py + DTILE_SIZE/2 + Math.sin(time+tx)*2, 8, 5, lp, 0, Math.PI * 2);
              ctx.fill();
              continue;
            }

            // ── Stairs ────────────────────────────────────────────
            if (t === DTILE.STAIRS_LOCKED || t === DTILE.STAIRS_UNLOCKED) {
              ctx.fillStyle = t === DTILE.STAIRS_UNLOCKED ? DUNGEON_COLORS.stairsUnlocked : DUNGEON_COLORS.stairs;
              ctx.fillRect(px + 4, py + 4, DTILE_SIZE - 8, DTILE_SIZE - 8);
              for (let s = 0; s < 4; s++) {
                ctx.fillStyle = t === DTILE.STAIRS_UNLOCKED ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.25)";
                ctx.fillRect(px + 6 + s*4, py + 8 + s*4, DTILE_SIZE - 12 - s*8, 3);
              }
            } else if (t === DTILE.SLIME_PUDDLE) {
              ctx.fillStyle = DUNGEON_COLORS.slime;
              ctx.beginPath();
              ctx.ellipse(px + DTILE_SIZE/2, py + DTILE_SIZE/2, DTILE_SIZE/2 - 4, DTILE_SIZE/2 - 6, 0, 0, Math.PI*2);
              ctx.fill();
              ctx.fillStyle = DUNGEON_COLORS.slimeHi;
              ctx.beginPath();
              ctx.ellipse(px + DTILE_SIZE/2 - 4, py + DTILE_SIZE/2 - 4, 5, 4, -0.5, 0, Math.PI*2);
              ctx.fill();
            } else if (t === DTILE.BARREL) {
              ctx.fillStyle = DUNGEON_COLORS.barrel;
              ctx.fillRect(px + 6, py + 5, DTILE_SIZE - 12, DTILE_SIZE - 10);
              ctx.fillStyle = shade(DUNGEON_COLORS.barrel, -32);
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, 3);
              ctx.fillRect(px + 5, py + DTILE_SIZE - 13, DTILE_SIZE - 10, 3);
            } else if (t === DTILE.CHEST) {
              ctx.fillStyle = DUNGEON_COLORS.chest;
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, DTILE_SIZE - 16);
              ctx.fillStyle = shade(DUNGEON_COLORS.chest, -20);
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, 4);
              ctx.fillStyle = "#ffd700";
              ctx.fillRect(px + DTILE_SIZE/2 - 2, py + DTILE_SIZE/2 - 1, 4, 4);
            }
          }
        }

        // ── Enemies ───────────────────────────────────────────────
        dungeon.enemies.forEach(en => {
          if (!en.alive) return;
          const ex = en.x + offX, ey = en.y + offY;
          const sz  = en.stats.size;
          const col = en.hitFlash > 0 ? "#ffffff" : en.stats.color;

          ctx.fillStyle = "rgba(0,0,0,0.3)";
          ctx.beginPath();
          ctx.ellipse(ex, ey + sz - 2, sz - 1, 3, 0, 0, Math.PI * 2);
          ctx.fill();

          if (en.type === "small_slime" || en.type === "lava_slime") {
            const w = Math.sin(time * 3 + en.id) * 1.5;
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.ellipse(ex, ey, sz + w, sz - w * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = en.type === "lava_slime" ? "#ffc060" : "#fff";
            ctx.fillRect(ex - 4, ey - 3, 3, 3); ctx.fillRect(ex + 2, ey - 3, 3, 3);
            ctx.fillStyle = "#222";
            ctx.fillRect(ex - 3, ey - 2, 2, 2); ctx.fillRect(ex + 3, ey - 2, 2, 2);

          } else if (en.type === "cave_bat" || en.type === "lava_bat") {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.ellipse(ex, ey, sz - 1, sz - 2, 0, 0, Math.PI * 2); ctx.fill();
            const flap = Math.sin(time * 8 + en.id) * 0.4;
            ctx.save(); ctx.translate(ex, ey);
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.quadraticCurveTo(-sz*2, -sz*flap, -sz*2.5, sz); ctx.quadraticCurveTo(-sz, sz*0.5, 0, 0); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.quadraticCurveTo(sz*2, -sz*flap, sz*2.5, sz); ctx.quadraticCurveTo(sz, sz*0.5, 0, 0); ctx.fill();
            ctx.fillStyle = shade(en.stats.color, 40);
            ctx.fillRect(-2, -sz - 4, 3, 5); ctx.fillRect(sz - 2, -sz - 4, 3, 5);
            ctx.restore();

          } else if (en.type === "goblin") {
            ctx.fillStyle = col;
            ctx.fillRect(ex - sz + 2, ey - 2, sz*2 - 4, sz);
            ctx.beginPath(); ctx.ellipse(ex, ey - sz + 1, sz - 2, sz - 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff0";
            ctx.fillRect(ex - 4, ey - sz + 1, 3, 3); ctx.fillRect(ex + 2, ey - sz + 1, 3, 3);
            ctx.fillStyle = "#222";
            ctx.fillRect(ex - 3, ey - sz + 2, 2, 2); ctx.fillRect(ex + 3, ey - sz + 2, 2, 2);
            ctx.fillStyle = "#888";
            ctx.fillRect(ex + sz - 2, ey - sz, 2, sz + 2);

          } else if (en.type === "mine_crawler") {
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.ellipse(ex, ey, sz - 1, sz - 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = col; ctx.lineWidth = 1.5;
            for (let lg = 0; lg < 4; lg++) {
              const ang = (lg / 4) * Math.PI;
              const wv  = Math.sin(time * 5 + en.id + lg) * 3;
              ctx.beginPath();
              ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(ang)*sz*2, ey + Math.sin(ang)*sz + wv);
              ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang)*sz*2, ey + Math.sin(ang)*sz + wv);
              ctx.stroke();
            }
            ctx.fillStyle = "#f00";
            ctx.fillRect(ex - 3, ey - 2, 2, 2); ctx.fillRect(ex + 2, ey - 2, 2, 2);

          } else if (en.type === "stone_golem" || en.type === "crystal_golem" || en.type === "lava_golem") {
            ctx.fillStyle = col;
            ctx.fillRect(ex - sz + 2, ey - sz + 4, sz*2 - 4, sz + 4);
            ctx.fillRect(ex - sz + 4, ey - sz*2 + 2, sz*2 - 8, sz);
            ctx.fillRect(ex - sz - 2, ey - sz + 6, sz - 2, sz - 4);
            ctx.fillRect(ex + 4,      ey - sz + 6, sz - 2, sz - 4);
            const eyeCol = en.type === "crystal_golem" ? "#80e8ff" : en.type === "lava_golem" ? "#ff7030" : "#555";
            ctx.fillStyle = eyeCol;
            ctx.fillRect(ex - sz + 7, ey - sz*2 + 5, 4, 4);
            ctx.fillRect(ex + sz - 9, ey - sz*2 + 5, 4, 4);

          } else if (en.type === "crystal_spider") {
            const cp = 0.7 + 0.3 * Math.sin(time * 4 + en.id);
            ctx.fillStyle = `rgba(60,200,255,${cp})`;
            ctx.beginPath(); ctx.ellipse(ex, ey, sz - 1, sz - 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgba(180,240,255,${cp})`; ctx.lineWidth = 1;
            for (let lg = 0; lg < 4; lg++) {
              const ang = (lg / 4) * Math.PI;
              const wv  = Math.sin(time * 7 + en.id + lg) * 3;
              ctx.beginPath();
              ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(ang)*sz*2.2, ey + Math.sin(ang)*sz + wv);
              ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang)*sz*2.2, ey + Math.sin(ang)*sz + wv);
              ctx.stroke();
            }
            ctx.fillStyle = "#fff";
            ctx.fillRect(ex - 3, ey - 2, 2, 2); ctx.fillRect(ex + 2, ey - 2, 2, 2);

          } else {
            // sewer_rat + generic fallback
            ctx.fillStyle = col;
            ctx.fillRect(ex - sz, ey - sz + 2, sz*2, sz);
            ctx.fillRect(ex - sz + 2, ey - sz - 2, sz - 2, sz);
            ctx.fillRect(ex - sz + 4, ey - sz - 5, 4, 4);
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(ex - sz + 4, ey - sz, 2, 2);
            ctx.strokeStyle = en.hitFlash > 0 ? "#fff" : shade(en.stats.color, -32);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(ex + sz, ey);
            ctx.quadraticCurveTo(ex + sz + 6, ey - 4, ex + sz + 4, ey - 8);
            ctx.stroke();
          }

          // HP bar
          const bx = ex - 12, by = ey - sz - 10;
          ctx.fillStyle = "#400"; ctx.fillRect(bx, by, 24, 3);
          ctx.fillStyle = en.hp / en.maxHp > 0.5 ? "#4c4" : en.hp / en.maxHp > 0.25 ? "#cc4" : "#c44";
          ctx.fillRect(bx, by, 24 * (en.hp / en.maxHp), 3);
        });

        // ── Player ────────────────────────────────────────────────
        const prevX = player.x, prevY = player.y;
        player.x += offX; player.y += offY;
        drawPlayerSprite(time, player);
        player.x = prevX; player.y = prevY;

        // ── Damage numbers ────────────────────────────────────────
        dungeon.dmgNumbers.forEach(d => {
          ctx.globalAlpha = 1 - d.age / 1.2;
          ctx.fillStyle = d.color;
          ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
          ctx.fillText(d.val, d.x + offX, d.y + offY - d.age * 20);
          ctx.globalAlpha = 1;
        });

        // ── HUD ───────────────────────────────────────────────────
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(8, 8, 210, 44);
        ctx.fillStyle = "#c22"; ctx.fillRect(12, 14, 120, 10);
        ctx.fillStyle = "#e55"; ctx.fillRect(12, 14, 120 * (player.hp / player.maxHp), 10);
        ctx.fillStyle = "#fff"; ctx.font = "11px Arial"; ctx.textAlign = "left";
        ctx.fillText(`HP ${player.hp} / ${player.maxHp}`, 12, 36);
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`⬡ ${getCarriedGold()}`, 110, 36);

        // Floor + tier label (top right)
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        const flLabel = `Floor ${dungeon.floor} — ${_tierLabel}`;
        const flW = ctx.measureText(flLabel).width + 16;
        ctx.fillRect(canvas.width - flW - 4, 8, flW + 4, 30);
        ctx.fillStyle = TC.wAcc;
        ctx.font = "bold 11px Arial"; ctx.textAlign = "right";
        ctx.fillText(flLabel, canvas.width - 8, 27);

        if (player.attackCooldown <= 0) {
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(canvas.width/2 - 110, canvas.height - 36, 220, 24);
          ctx.fillStyle = "#ccc"; ctx.font = "12px Arial"; ctx.textAlign = "center";
          ctx.fillText("Z / Space — Attack   E — Interact", canvas.width/2, canvas.height - 20);
        }

        const sp = dungeon.data.stairsPos;
        const stairPx = sp.x * DTILE_SIZE + offX + DTILE_SIZE / 2;
        const stairPy = sp.y * DTILE_SIZE + offY;
        if (dungeon.stairsUnlocked) {
          ctx.fillStyle = "#8a6ad0"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
          ctx.fillText(dungeon.floor < 25 ? "E — Descend" : "🏆 MAX DEPTH!", stairPx, stairPy - 8);
        } else {
          const remaining = dungeon.enemies.filter(e => e.alive).length;
          if (remaining > 0) {
            ctx.fillStyle = TC.wAcc; ctx.font = "11px Arial"; ctx.textAlign = "center";
            ctx.fillText(`${remaining} enem${remaining > 1 ? "ies" : "y"} remain`, canvas.width/2, canvas.height/2 - 60);
          }
        }

        if (dungeon.data) {
          const upP = dungeon.data.upStairsPos || dungeon.data.playerSpawn;
          const upPx = upP.x * DTILE_SIZE + offX + DTILE_SIZE / 2;
          const upPy = upP.y * DTILE_SIZE + offY;
          const distUp = Math.hypot(player.x - (upP.x * DTILE_SIZE + DTILE_SIZE/2), player.y - (upP.y * DTILE_SIZE + DTILE_SIZE/2));
          if (distUp < 48) {
            ctx.fillStyle = "#88aacc"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
            ctx.fillText(dungeon.floor > 1 ? "Bksp — Go up" : "Bksp — Exit mines", upPx, upPy - 8);
          }
        }

        drawNotice();
        ctx.textAlign = "left";
      }

      // ==================================================
      // === SCENES =======================================
      // ==================================================

      // ---- TITLE SCENE ---------------------------------

      const titleState = { selected: 0 }; // 0 = New Game, 1 = Continue

      function updateTitle() {
        if (justPressedKeys.up)   titleState.selected = 0;
        if (justPressedKeys.down) titleState.selected = 1;
        if (justPressedKeys.confirm || mouse.clicked) {
          const hasSave = !!loadSave();
          if (titleState.selected === 0) {
            // New game — wipe save and go to character creation
            game.save = createNewSave();
            player = createPlayer(game.save);
            initNpcs();
            initDogs();
            switchScene(SCENE.CHARACTER_CREATION);
          } else if (hasSave) {
            game.save = loadSave();
            player = createPlayer(game.save);
            initNpcs();
            initDogs();
            switchScene(SCENE.CITY);
          }
        }
      }

      function drawTitle(time) {
        const w = canvas.width, h = canvas.height;

        // Animated starfield background
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 120; i++) {
          const sx = noise(i, 0, 1) * w;
          const sy = noise(i, 0, 2) * h;
          const bright = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.8 + i));
          ctx.fillStyle = `rgba(220,230,255,${bright.toFixed(2)})`;
          const sr = noise(i, 0, 3) < 0.15 ? 2 : 1;
          ctx.fillRect(sx, sy, sr, sr);
        }

        // Moon
        ctx.fillStyle = "#f0e8c8";
        ctx.beginPath();
        ctx.arc(w * 0.72, h * 0.22, 54, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#d8d0a8";
        ctx.beginPath();
        ctx.arc(w * 0.72 + 18, h * 0.22 - 14, 44, 0, Math.PI * 2);
        ctx.fill();

        // City skyline silhouette
        ctx.fillStyle = "#111922";
        const bldgs = [
          [0, 0.68, 0.10, 0.32],
          [0.08, 0.55, 0.07, 0.45],
          [0.14, 0.62, 0.10, 0.38],
          [0.23, 0.50, 0.06, 0.50],
          [0.28, 0.58, 0.09, 0.42],
          [0.36, 0.44, 0.07, 0.56],
          [0.42, 0.60, 0.10, 0.40],
          [0.51, 0.52, 0.08, 0.48],
          [0.58, 0.65, 0.11, 0.35],
          [0.68, 0.48, 0.07, 0.52],
          [0.74, 0.57, 0.09, 0.43],
          [0.82, 0.64, 0.10, 0.36],
          [0.91, 0.54, 0.09, 0.46]
        ];
        for (const [bx, by, bw, bh] of bldgs) {
          ctx.fillRect(bx * w, by * h, bw * w, bh * h);
        }
        ctx.fillRect(0, h * 0.82, w, h * 0.18);

        // Title text
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.font = "bold 56px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Moonlight City", w / 2 + 3, h * 0.36 + 3);
        ctx.fillStyle = "#f0e8c8";
        ctx.fillText("Moonlight City", w / 2, h * 0.36);
        ctx.font = "22px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#b8c8d8";
        ctx.fillText("Go down scary.  Come back rich.  Make home warmer.", w / 2, h * 0.44);

        // Menu buttons
        const hasSave = !!loadSave();
        const buttons = [
          { label: "✨ New Game", y: h * 0.58 },
          { label: hasSave ? "▶ Continue" : "— No save —", y: h * 0.58 + 58, disabled: !hasSave }
        ];
        buttons.forEach((btn, i) => {
          const selected = titleState.selected === i;
          const alpha = btn.disabled ? 0.35 : 1;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = selected ? "rgba(240,232,200,0.18)" : "rgba(0,0,0,0.25)";
          ctx.fillRect(w / 2 - 140, btn.y - 30, 280, 46);
          if (selected) {
            ctx.strokeStyle = "#f0e8c8";
            ctx.lineWidth = 2;
            ctx.strokeRect(w / 2 - 140, btn.y - 30, 280, 46);
          }
          ctx.fillStyle = selected ? "#f0e8c8" : "#8899aa";
          ctx.font = selected ? "bold 24px Trebuchet MS, Arial, sans-serif" : "22px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(btn.label, w / 2, btn.y + 4);
          ctx.globalAlpha = 1;
        });

        // Hint
        ctx.font = "16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,190,200,0.6)";
        ctx.fillText("↑↓ to select  ·  Enter to confirm", w / 2, h * 0.88);
        ctx.textAlign = "left";
      }

      // ---- CHARACTER CREATION SCENE -------------------

      const cc = {
        name: "Hero",
        skin: 0,
        hairStyle: 0,
        hairColour: 0,
        outfit: 0,
        ageType: "adult",
        classId: "adventurer",
        field: "skin",
        nameEditing: false,
        typedName: "Hero"
      };

      const CC_FIELDS = ["name", "skin", "hairColour", "hairStyle", "outfit", "age", "done"];

      function updateCharacterCreation() {
        // Navigate fields with left/right
        if (justPressedKeys.left) {
          const idx = CC_FIELDS.indexOf(cc.field);
          if (idx > 0) cc.field = CC_FIELDS[idx - 1];
        }
        if (justPressedKeys.right) {
          const idx = CC_FIELDS.indexOf(cc.field);
          if (idx < CC_FIELDS.length - 1) cc.field = CC_FIELDS[idx + 1];
        }

        // Cycle options with up/down
        if (justPressedKeys.up || justPressedKeys.down) {
          const dir = justPressedKeys.up ? -1 : 1;
          if (cc.field === "skin")       cc.skin       = (cc.skin       + dir + SKIN_TONES.length)    % SKIN_TONES.length;
          if (cc.field === "hairColour") cc.hairColour = (cc.hairColour + dir + HAIR_COLORS.length)   % HAIR_COLORS.length;
          if (cc.field === "outfit")     cc.outfit     = (cc.outfit     + dir + OUTFIT_COLORS.length) % OUTFIT_COLORS.length;
          if (cc.field === "hairStyle")  cc.hairStyle  = (cc.hairStyle  + dir + HAIR_STYLE_COUNT)     % HAIR_STYLE_COUNT;
          if (cc.field === "age") {
            const ages = ["adult", "toddler", "child"];
            const i = ages.indexOf(cc.ageType);
            cc.ageType = ages[(i + dir + ages.length) % ages.length];
          }
        }

        // Confirm / done
        if ((justPressedKeys.confirm || mouse.clicked) && cc.field === "done") {
          // Commit to save and go to city
          game.save.player.name       = cc.name;
          game.save.player.skin       = cc.skin;
          game.save.player.hairStyle  = cc.hairStyle;
          game.save.player.hairColour = cc.hairColour;
          game.save.player.outfit     = cc.outfit;
          game.save.player.classId    = cc.classId;
          game.save.player.ageType    = cc.ageType;
          // Start with no house — buy one in the Residential District!
          game.save.player.houseNum = 0;
          game.save.ownedHouses = [];
          game.save.gold.carried = 500; // starter gold to buy first house
          writeSave(game.save);
          player = createPlayer(game.save);
          initNpcs();
          initDogs();
          switchScene(SCENE.CITY);
        }
      }

      window.addEventListener("keypress", (e) => {
        if (game.scene !== SCENE.CHARACTER_CREATION) return;
        if (cc.field !== "name") return;
        if (e.key === "Enter") { cc.name = cc.typedName || "Hero"; return; }
        if (e.key.length === 1 && cc.typedName.length < 14) {
          cc.typedName += e.key;
          cc.name = cc.typedName;
        }
      });
      window.addEventListener("keydown", (e) => {
        if (game.scene !== SCENE.CHARACTER_CREATION) return;
        if (cc.field !== "name") return;
        if (e.code === "Backspace" && cc.typedName.length > 0) {
          cc.typedName = cc.typedName.slice(0, -1);
          cc.name = cc.typedName || "Hero";
        }
      }, { capture: true });

      function drawCharacterCreation(time) {
        const w = canvas.width, h = canvas.height;

        // Background
        ctx.fillStyle = "#1a1028";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(240,232,200,0.04)";
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(0, (h / 5) * i, w, 1);
        }

        // Title
        ctx.textAlign = "center";
        ctx.fillStyle = "#f0e8c8";
        ctx.font = "bold 32px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Create Your Character", w / 2, 52);

        // Preview character (centre screen, larger)
        const previewP = {
          x: w / 2, y: h * 0.45,
          vx: 0, vy: 0,
          radius: 9, speed: 0, accel: 0,
          dir: "down", walkTime: time * 2,
          skin: cc.skin, hairStyle: cc.hairStyle,
          hairColour: cc.hairColour, outfit: cc.outfit,
          ageType: cc.ageType
        };
        ctx.save();
        ctx.scale(3, 3);
        ctx.translate(-(w / 2) * (2 / 3), -(h * 0.45) * (2 / 3));
        drawPlayerSprite(time, previewP);
        ctx.restore();

        // Option panels (7 columns, narrower)
        const pw = 110; // panel half-width
        const panels = [
          { key: "name",       label: "Name",        value: cc.name,                                        x: w * 0.08 },
          { key: "skin",       label: "Skin",         value: `${cc.skin + 1}/${SKIN_TONES.length}`,         x: w * 0.22 },
          { key: "hairColour", label: "Hair Col",     value: `${cc.hairColour + 1}/${HAIR_COLORS.length}`,  x: w * 0.36 },
          { key: "hairStyle",  label: "Hair Style",   value: HAIR_STYLE_NAMES[cc.hairStyle],                x: w * 0.50 },
          { key: "outfit",     label: "Outfit",       value: `${cc.outfit + 1}/${OUTFIT_COLORS.length}`,    x: w * 0.64 },
          { key: "age",        label: "Age",          value: cc.ageType === "toddler" ? "🧒 Toddler" : cc.ageType === "child" ? "🎒 Child" : "🧑 Adult", x: w * 0.78 },
          { key: "done",       label: "▶ Play!",      value: "",                                            x: w * 0.92 }
        ];

        const panelY = h * 0.72;
        panels.forEach(p => {
          const sel = cc.field === p.key;
          ctx.fillStyle = sel ? "rgba(240,232,200,0.18)" : "rgba(0,0,0,0.35)";
          ctx.fillRect(p.x - pw/2, panelY - 40, pw, 80);
          if (sel) {
            ctx.strokeStyle = "#f0e8c8";
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x - pw/2, panelY - 40, pw, 80);
          }
          ctx.fillStyle = sel ? "#f0e8c8" : "#889aaa";
          ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(p.label, p.x, panelY - 14);
          ctx.font = sel ? "bold 20px Trebuchet MS, Arial, sans-serif" : "18px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = sel ? "#ffe090" : "#c0c8d0";
          if (p.key === "skin") {
            ctx.fillStyle = SKIN_TONES[cc.skin];
            ctx.fillRect(p.x - 12, panelY + 6, 24, 16);
          } else if (p.key === "hairColour") {
            ctx.fillStyle = HAIR_COLORS[cc.hairColour];
            ctx.fillRect(p.x - 12, panelY + 6, 24, 16);
          } else if (p.key === "outfit") {
            ctx.fillStyle = OUTFIT_COLORS[cc.outfit].torso;
            ctx.fillRect(p.x - 14, panelY + 6, 13, 16);
            ctx.fillStyle = OUTFIT_COLORS[cc.outfit].legs;
            ctx.fillRect(p.x + 1,  panelY + 6, 13, 16);
          } else {
            ctx.fillStyle = sel ? "#ffe090" : "#c0c8d0";
            ctx.font = sel ? "bold 14px Trebuchet MS, Arial, sans-serif" : "13px Trebuchet MS, Arial, sans-serif";
            ctx.fillText(p.value + (p.key === "name" && sel ? "▌" : ""), p.x, panelY + 22);
          }
        });

        // Hint
        ctx.font = "16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,190,200,0.6)";
        ctx.fillText("← → choose  ·  ↑ ↓ change  ·  Enter confirm  ·  Type name when Name is selected", w / 2, h * 0.92);
        ctx.textAlign = "left";
      }

      // ---- CITY SCENE (wraps existing world code) ------

      function updateCity(dt) {
        // ── World map open — freeze world ───────────────────────────────────
        if (worldMapOpen || inventory.open) return;
        if (game.save) updateWeather(dt, game.save.time.currentDay);
        // ── Dialogue mode — freeze world, handle input ──────────────────────
        if (dialogue.active) {
          if (justPressedKeys.interact || justPressedKeys.attack || justPressedKeys.confirm || justPressedKeys.pause) {
            advanceDialogue();
          }
          // still update camera smoothly while chatting
          const view = getView();
          camera.x += (clamp(player.x - view.worldW / 2, 0, Math.max(0, WORLD_W - view.worldW)) - camera.x) * Math.min(1, dt * 6);
          camera.y += (clamp(player.y - view.worldH / 2, 0, Math.max(0, WORLD_H - view.worldH)) - camera.y) * Math.min(1, dt * 6);
          return;
        }

        // ── Proposal mode ───────────────────────────────────────────────────
        if (proposal.active) {
          if (justPressedKeys.left || justPressedKeys.right) proposal.selected = 1 - proposal.selected;
          if (justPressedKeys.interact || justPressedKeys.confirm) {
            if (proposal.selected === 0) { // Yes!
              game.save.married = proposal.npc.id;
              game.save.marriageDay = game.save.time.currentDay;
              game.save.hasRing = false;
              game.save.houseUpgrades = (game.save.houseUpgrades || []).filter(id => id !== "engagement_ring");
              const m = npcs.find(n => n.id === proposal.npc.id);
              if (m) m.married = true;
              writeSave(game.save);
              showNotice(`💍 ${proposal.npc.name} said YES! You're married! 💕`, 5);
            } else {
              showNotice(`${proposal.npc.name} isn't ready yet... Give it more time. 💔`, 3);
            }
            proposal.active = false; proposal.npc = null;
          }
          if (justPressedKeys.back || justPressedKeys.pause) { proposal.active = false; proposal.npc = null; }
          const _pv = getView();
          camera.x += (clamp(player.x - _pv.worldW/2, 0, Math.max(0, WORLD_W - _pv.worldW)) - camera.x) * Math.min(1, dt*6);
          camera.y += (clamp(player.y - _pv.worldH/2, 0, Math.max(0, WORLD_H - _pv.worldH)) - camera.y) * Math.min(1, dt*6);
          return;
        }

        if (justPressedKeys.pause) { /* pause not yet implemented */ }
        if (workState.active) {
          workState.timer += dt;
          if (workState.timer >= workState.dur) {
            workState.active = false;
            const spot = JOB_SPOTS.find(j => j.id === workState.jobId);
            if (spot) {
              addCarriedGold(spot.gold);
              jobCooldowns[spot.id] = 90;
              showNotice(`${spot.emoji} Earned ${spot.gold}⬡ as ${spot.label}!`, 2.5);
            }
          }
          const _wv = getView();
          camera.x += (clamp(player.x - _wv.worldW / 2, 0, Math.max(0, WORLD_W - _wv.worldW)) - camera.x) * Math.min(1, dt * 6);
          camera.y += (clamp(player.y - _wv.worldH / 2, 0, Math.max(0, WORLD_H - _wv.worldH)) - camera.y) * Math.min(1, dt * 6);
          return;
        }
        if (fishState.active) {
          fishState.timer += dt;
          if (fishState.phase === "casting") {
            if (fishState.timer >= fishState.biteAt) {
              fishState.phase = "biting";
              fishState.timer = 0;
              showNotice("🎣 Something's biting! Press E!", 1.5);
            }
          } else if (fishState.phase === "biting") {
            if (justPressedKeys.interact) {
              const gold = 5 + Math.floor(Math.random() * 16);
              addCarriedGold(gold);
              showNotice(`🐟 Caught a fish! +${gold}⬡`, 2.5);
              fishState.active = false;
            } else if (fishState.timer > 1.8) {
              showNotice("🎣 It got away!", 1.5);
              fishState.active = false;
            }
          }
          const _fv = getView();
          camera.x += (clamp(player.x - _fv.worldW / 2, 0, Math.max(0, WORLD_W - _fv.worldW)) - camera.x) * Math.min(1, dt * 6);
          camera.y += (clamp(player.y - _fv.worldH / 2, 0, Math.max(0, WORLD_H - _fv.worldH)) - camera.y) * Math.min(1, dt * 6);
          return;
        }
        movePlayer(dt);
        updateNpcs(dt);
        updateDogs(dt);
        for (const _jid of Object.keys(jobCooldowns)) {
          jobCooldowns[_jid] = Math.max(0, jobCooldowns[_jid] - dt);
        }

        const view = getView();
        const targetX = clamp(player.x - view.worldW / 2, 0, Math.max(0, WORLD_W - view.worldW));
        const targetY = clamp(player.y - view.worldH / 2, 0, Math.max(0, WORLD_H - view.worldH));
        camera.x += (targetX - camera.x) * Math.min(1, dt * 6);
        camera.y += (targetY - camera.y) * Math.min(1, dt * 6);
        camera.x = clamp(camera.x, 0, Math.max(0, WORLD_W - view.worldW));
        camera.y = clamp(camera.y, 0, Math.max(0, WORLD_H - view.worldH));

        // Tick city time — hours pass freely, day only advances via sleep/pass-out
        if (game.save) {
          game.save.time.currentMinute += dt * (60 / 24);
          if (game.save.time.currentMinute >= 60) {
            game.save.time.currentMinute -= 60;
            game.save.time.currentHour   += 1;
            if (game.save.time.currentHour >= 24) {
              game.save.time.currentHour = 0; // midnight — no day advance
            }
            // 3 AM: pass out from exhaustion
            if (game.save.time.currentHour === 3) {
              game.save.time.currentHour   = 8;
              game.save.time.currentMinute = 0;
              game.save.time.currentDay   += 1;
              player.hp = Math.max(1, Math.floor(player.maxHp * 0.5));
              game.save.player.hp = player.hp;
              writeSave(game.save);
              showNotice("You passed out at 3 AM! 😴  Woke up next morning — HP halved.", 6);
              triggerShake(3);
            }
          }
        }

        if (game.save && game.save.married && !game.save.hasBaby) {
          const daysMarried = game.save.time.currentDay - (game.save.marriageDay || 1);
          if (daysMarried >= 15) {
            game.save.hasBaby = true;
            writeSave(game.save);
            showNotice("👶 Your family has grown! A baby has arrived! 💕", 6);
            const spouse = npcs.find(n => n.id === game.save.married);
            if (spouse && !npcs.find(n => n.id === "__baby__")) {
              npcs.push({
                id: "__baby__", name: "Baby",
                x: spouse.x + 10, y: spouse.y + 10,
                vx: 0, vy: 0, dir: "down", walkTime: 0,
                wanderTimer: 3, targetX: spouse.x, targetY: spouse.y,
                skin: spouse.skin, hair: spouse.hair, torso: "#f8d8b0", legs: "#a8d8f0",
                hairStyle: 0, ageType: "toddler", married: false, homeX: spouse.x, homeY: spouse.y,
                isFollowingSpouse: true, spouseId: game.save.married
              });
            }
          }
        }

        if (Math.hypot(player.x - SEWER_ENTRANCE.x, player.y - SEWER_ENTRANCE.y) < 40 && (justPressedKeys.interact || justPressedKeys.attack)) {
          enterDungeon(1);
        }

        // Check candy store door (tile 58,53 → player stands one tile south)
        const _candyDoorX = 58 * 32 + 16, _candyDoorY = 54 * 32 + 16;
        if (Math.hypot(player.x - _candyDoorX, player.y - _candyDoorY) < 52 && justPressedKeys.interact) {
          enterCandyStore();
          return;
        }

        // Check Prestige Furnishings door (tile 49,21 → player stands at y:22)
        const _prestigeDoorX = 49 * 32 + 16, _prestigeDoorY = 22 * 32 + 16;
        if (Math.hypot(player.x - _prestigeDoorX, player.y - _prestigeDoorY) < 52 && justPressedKeys.interact) {
          enterPrestigeStore();
          return;
        }

        // Check Mansion door (tile 73,16 → player stands at y:17)
        const _mansionDoorX = 73 * 32 + 16, _mansionDoorY = 17 * 32 + 16;
        if (Math.hypot(player.x - _mansionDoorX, player.y - _mansionDoorY) < 52 && justPressedKeys.interact) {
          enterMansion();
          return;
        }

        // Check Moonlight Cinemas door (tile 7,34 → player at y:35)
        const _theaterDoorX = 7 * 32 + 16, _theaterDoorY = 35 * 32 + 16;
        if (Math.hypot(player.x - _theaterDoorX, player.y - _theaterDoorY) < 52 && justPressedKeys.interact) {
          enterTheater();
          return;
        }

        const _schoolDoorX = 35 * 32 + 16, _schoolDoorY = 49 * 32 + 16;
        if (Math.hypot(player.x - _schoolDoorX, player.y - _schoolDoorY) < 52 && justPressedKeys.interact) {
          enterSchool();
          return;
        }

        const _petDoorX = 46 * 32 + 16, _petDoorY = 63 * 32 + 16;
        if (Math.hypot(player.x - _petDoorX, player.y - _petDoorY) < 52 && justPressedKeys.interact) {
          enterPetShop();
          return;
        }

        // Check player's own house door + house purchasing for all 6 houses
        for (const _hl of HOUSE_LISTINGS) {
          const _hd = HOUSE_DOORS[_hl.num];
          if (!_hd) continue;
          if (Math.hypot(player.x - _hd.px, player.y - _hd.py) >= 60) continue;
          if (!justPressedKeys.interact) break;

          const owned = game.save.ownedHouses && game.save.ownedHouses.includes(_hl.num);
          const isCurrentHome = game.save.player.houseNum === _hl.num;

          if (isCurrentHome) {
            enterHouse();
          } else if (owned) {
            // Move into already-owned house
            game.save.player.houseNum = _hl.num;
            showNotice(`Moved into ${_hl.name}! 🏡`, 3);
            enterHouse();
          } else {
            // Buy the house
            const price = _hl.price;
            if ((game.save.gold.carried || 0) >= price) {
              game.save.gold.carried -= price;
              if (!game.save.ownedHouses) game.save.ownedHouses = [];
              game.save.ownedHouses.push(_hl.num);
              if (game.save.player.houseNum === 0) game.save.player.houseNum = _hl.num;
              writeSave(game.save);
              showNotice(`Bought ${_hl.name} for ${price}g! 🏡`, 4);
            } else {
              showNotice(`Need ${price}g to buy ${_hl.name}. You have ${game.save.gold.carried || 0}g.`, 3);
            }
          }
          break;
        }

        if (justPressedKeys.interact) {
          let nearest = null, nearestDist = Infinity;
          for (const npc of npcs) {
            const d = Math.hypot(player.x - npc.x, player.y - npc.y);
            if (d < 52 && d < nearestDist) { nearest = npc; nearestDist = d; }
          }
          let nearestJob = null;
          let nearestJobDist = Infinity;
          for (const spot of JOB_SPOTS) {
            const d = Math.hypot(player.x - spot.x, player.y - spot.y);
            if (d < 48 && d < nearestJobDist) { nearestJob = spot; nearestJobDist = d; }
          }
          const fishingDist = Math.hypot(player.x - FISHING_SPOT.x, player.y - FISHING_SPOT.y);
          const fishingWins = fishingDist < 52 && (!nearest || fishingDist < nearestDist);
          const jobWins = nearestJob && (!nearest || nearestJobDist < nearestDist);

          if (fishingWins) {
            fishState = { active: true, phase: "casting", timer: 0, biteAt: 2 + Math.random() * 4 };
            showNotice("🎣 Line cast! Wait for a bite...", 2);
            return;
          }
          if (jobWins) {
            if ((jobCooldowns[nearestJob.id] || 0) > 0) {
              showNotice(`Come back in ${Math.ceil(jobCooldowns[nearestJob.id])}s!`, 1.5);
            } else {
              workState = { active: true, jobId: nearestJob.id, timer: 0, dur: nearestJob.dur };
              showNotice(`${nearestJob.emoji} Working as ${nearestJob.label}...`, nearestJob.dur);
            }
            return;
          }
          if (nearest) {
            if (nearest.id === "doc" && player.hp < player.maxHp) {
              if (getCarriedGold() >= 50) {
                setCarriedGold(getCarriedGold() - 50);
                player.hp = player.maxHp;
                if (game.save) game.save.player.hp = player.maxHp;
                writeSave(game.save);
                showNotice("💊 Doc healed you to full HP! (-50⬡)", 2.5);
              } else {
                showNotice("💊 Doc says: That'll be 50⬡. You're short on gold.", 2.5);
              }
              return;
            }
            const friendship = (game.save.friendship || {})[nearest.id] || 0;
            const canPropose = game.save.hasRing && friendship >= 6 && !game.save.married
                            && nearest.ageType !== "child" && nearest.id !== "pipper" && nearest.id !== "sam";
            if (canPropose) {
              proposal.active = true; proposal.npc = nearest; proposal.selected = 0;
              const dx = player.x - nearest.x, dy = player.y - nearest.y;
              nearest.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              nearest.vx = 0; nearest.vy = 0;
            } else {
              openDialogue(nearest);
            }
          }
        }
      }

      function drawCity(time) {
        const view = getView();

        const nearestJobSpot = JOB_SPOTS.reduce((best, spot) => {
          const dist = Math.hypot(player.x - spot.x, player.y - spot.y);
          return dist < 48 && (!best || dist < best.dist) ? { spot, dist } : best;
        }, null);
        const fishingDist = Math.hypot(player.x - FISHING_SPOT.x, player.y - FISHING_SPOT.y);
        ctx.save();
        ctx.scale(view.zoom, view.zoom);
        ctx.translate(-camera.x + shake.x, -camera.y + shake.y);

        ctx.restore();

        // House door prompts — for all 6 purchasable houses

        if (workState.active) {

          const spot = nearestJobSpot.spot;
          const cd = jobCooldowns[spot.id] || 0;
          const hint = cd > 0 ? `${spot.emoji} Come back in ${Math.ceil(cd)}s` : `Press E to work: ${spot.emoji} ${spot.label} (+${spot.gold}⬡)`;

          ctx.fillRect(canvas.width / 2 - 140, canvas.height - 42, 280, 24);

          ctx.fillText(hint, canvas.width / 2, canvas.height - 25);
          ctx.textAlign = "left";
        }
        if (!fishState.active && !workState.active && !dialogue.active && fishingDist < 52 && (!nearestNpc || fishingDist < nearestNpcDist)) {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(canvas.width / 2 - 110, canvas.height - 42, 220, 24);

          ctx.fillStyle = "rgba(0,0,0,0.6)";

          ctx.fillStyle = "#224";
          ctx.fillRect(bx, by + 4, bw, 14);
          ctx.fillStyle = "#40a0ff";
          ctx.fillRect(bx, by + 4, bw * pct, 14);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("🎣 Waiting for a bite...", canvas.width / 2, by + 2);
          ctx.textAlign = "left";
        }
        if (Math.hypot(player.x - petDoorX, player.y - petDoorY) < 52 && !dialogue.active && !proposal.active && !workState.active && !fishState.active) {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(canvas.width / 2 - 118, canvas.height - 70, 236, 24);
          ctx.fillStyle = "#ffe8c8";
          ctx.font = "bold 12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to enter Pawsome Pets 🐾", canvas.width / 2, canvas.height - 53);
          ctx.textAlign = "left";
        }
        if (dialogue.active) drawDialogueBox(time);
        if (proposal.active) drawProposalBox(time);
      }

      function drawDialogueBox(time) {
        const npc  = dialogue.npc;
        const line = (npc.lines || [])[dialogue.lineIndex] || "";
        const isLast = dialogue.lineIndex >= (npc.lines || []).length - 1;

        const W = canvas.width, H = canvas.height;
        const boxH  = 130;
        const boxY  = H - boxH - 10;
        const pad   = 16;
        const portSize = 88;

        // Box background
        ctx.fillStyle = "rgba(10, 14, 22, 0.93)";
        roundRect(ctx, 10, boxY, W - 20, boxH, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(200,200,160,0.35)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, 10, boxY, W - 20, boxH, 10);
        ctx.stroke();

        // NPC portrait panel
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        roundRect(ctx, 22, boxY + 10, portSize, portSize, 6);
        ctx.fill();

        // Draw NPC mini-sprite scaled up inside portrait
        ctx.save();
        const portCX = 22 + portSize / 2;
        const portCY = boxY + 10 + portSize / 2 + 8;
        ctx.scale(2.6, 2.6);
        drawNpcSprite(0, {
          ...npc,
          x: portCX / 2.6, y: portCY / 2.6,
          vx: 0, vy: 0, dir: "down",
          walkTime: 0, homeX: portCX / 2.6
        });
        ctx.restore();

        // NPC name tag
        ctx.fillStyle = npcNameColour(npc.id);
        ctx.font = "bold 15px Trebuchet MS, Arial, sans-serif";
        ctx.fillText(npc.name, 22 + portSize + pad, boxY + 26);

        // Divider under name
        ctx.fillStyle = "rgba(200,200,160,0.25)";
        ctx.fillRect(22 + portSize + pad, boxY + 30, W - 80 - portSize, 1);

        // Dialogue text with word wrap
        ctx.fillStyle = "#f0ede4";
        ctx.font = "14px Trebuchet MS, Arial, sans-serif";
        const maxW  = W - 80 - portSize - pad * 2;
        const textX = 22 + portSize + pad;
        const textY = boxY + 52;
        wrapText(ctx, line, textX, textY, maxW, 22);

        // Advance hint
        const hint = isLast ? "Press E to close  ✕" : "Press E to continue  ▼";
        ctx.fillStyle = "rgba(200,200,140,0.7)";
        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(hint, W - 22, boxY + boxH - 10);
        ctx.textAlign = "left";

      function drawProposalBox(time) {
        const npc = proposal.npc;
        if (!npc) return;
        const W = canvas.width, H = canvas.height;
        const bw = 480, bh = 200, bx = Math.round((W - bw) / 2), by = Math.round(H / 2 - bh / 2);

        const pulse = 0.5 + 0.5 * Math.sin(time * 3);
        ctx.fillStyle = `rgba(60,10,20,${0.88 + 0.08 * pulse})`;
        roundRect(ctx, bx, by, bw, bh, 14); ctx.fill();
        ctx.strokeStyle = `rgb(${Math.round(200 + 40 * pulse)},80,100)`;
        ctx.lineWidth = 3;
        roundRect(ctx, bx, by, bw, bh, 14); ctx.stroke();
        // Heart emoji
        ctx.font = "36px Arial"; ctx.textAlign = "center";

        const hearts = (game.save.friendship || {})[npc.id] || 0;

        ctx.fillStyle = proposal.selected === 1 ? "rgba(80,80,120,0.9)" : "rgba(40,40,70,0.7)";

      function npcNameColour(id) {
        return { ella:"#f5c870", will:"#7ab8f5", pipper:"#f57a3a", rose:"#c47af5", lumi:"#b8f0e0", rex:"#d48a58",
                 mabel:"#f07840", finn:"#58a8c8", doc:"#d0d8f8", nora:"#c870e0", sam:"#60a0f0", cleo:"#e84040" }[id] || "#f0ede4";
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let cy = y;
        for (const word of words) {
          const test = line ? line + " " + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, cy);
            line = word;
            cy += lineHeight;
          } else {
            line = test;
          }
        }
        if (line) ctx.fillText(line, x, cy);
      }

      function updateDungeonScene(dt) {
        updateDungeon(dt);
      }

      function drawDungeonScene(time) {
        drawDungeon(time);
      }

      function updateHouseInterior(dt) {
        const ts = 36, roomW = game.inMansion ? 13 : 11, roomH = game.inMansion ? 9 : 8, r = player.radius;

        // Faster indoor movement — direct pixel/s, no acceleration
        const spd = 140;
        let dx = 0, dy = 0;
        if (keys.left)  dx -= spd * dt;
        if (keys.right) dx += spd * dt;
        if (keys.up)    dy -= spd * dt;
        if (keys.down)  dy += spd * dt;

        if (dx !== 0 || dy !== 0) {
          player.x = clamp(player.x + dx, ts + r, (roomW - 1) * ts - r);
          player.y = clamp(player.y + dy, ts + r, (roomH - 1) * ts - r);
          player.walkTime += dt * 9;
          if (Math.abs(dx) >= Math.abs(dy))
            player.dir = dx > 0 ? "right" : "left";
          else
            player.dir = dy > 0 ? "down" : "up";
        }

        if (justPressedKeys.pause && !(game.inPrestigeStore && prestigeShop.open) && !(game.inPetShop && petShopState.open)) {
          candyShop.open = false;
          prestigeShop.open = false;
          petShopState.open = false;
          exitHouse();
          return;
        }

        // ── Candy shop mode ────────────────────────────────────────
        if (game.inCandyStore) {
          if (candyShop.open) {
            if (justPressedKeys.up)   candyShop.selected = (candyShop.selected - 1 + CANDY_ITEMS.length) % CANDY_ITEMS.length;
            if (justPressedKeys.down) candyShop.selected = (candyShop.selected + 1) % CANDY_ITEMS.length;
            if (justPressedKeys.pause || justPressedKeys.back) { candyShop.open = false; return; }
            if (justPressedKeys.interact || justPressedKeys.confirm) {
              const item = CANDY_ITEMS[candyShop.selected];
              const gold = getCarriedGold();
              if (gold < item.price) {
                showNotice(`Not enough gold! Need ${item.price} ⬡`, 1.5);
              } else {
                setCarriedGold(gold - item.price);
                // Add to inventory
                if (!game.save.inventory) game.save.inventory = [];
                game.save.inventory.push({ id: item.id, emoji: item.emoji, name: item.name, hp: item.hp, speed: item.speed || 0 });
                writeSave(game.save);
                showNotice(`Bought ${item.emoji} ${item.name}! ⬡${item.price} spent.`, 2);
              }
            }
            return;
          }
          // Counter centre in interior coords
          const counterX = 7 * 36 + 54, counterY = 3 * 36 + 18;
          if (justPressedKeys.interact && Math.hypot(player.x - counterX, player.y - counterY) < 80) {
            candyShop.open = true;
            candyShop.selected = 0;
            return;
          }
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (game.inSchool) {
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (game.inPetShop) {
          if (petShopState.open) {
            if (justPressedKeys.up)   petShopState.selected = (petShopState.selected - 1 + PETS_FOR_SALE.length) % PETS_FOR_SALE.length;
            if (justPressedKeys.down) petShopState.selected = (petShopState.selected + 1) % PETS_FOR_SALE.length;
            if (justPressedKeys.pause || justPressedKeys.back) { petShopState.open = false; return; }
            if (justPressedKeys.interact || justPressedKeys.confirm) {
              const pet = PETS_FOR_SALE[petShopState.selected];
              if ((game.save.ownedPets || []).includes(pet.id)) {
                showNotice(`You already have a ${pet.name}!`, 1.5);
              } else if (getCarriedGold() < pet.price) {
                showNotice(`Need ${pet.price}⬡ for ${pet.name}!`, 1.5);
              } else {
                setCarriedGold(getCarriedGold() - pet.price);
                if (!game.save.ownedPets) game.save.ownedPets = [];
                game.save.ownedPets.push(pet.id);
                const petEntity = createOwnedPetEntity(pet.id, game.save.ownedPets.length - 1, 46 * 32 + 16, 63 * 32 + 16);

                writeSave(game.save);
                showNotice(`${pet.emoji} Adopted ${pet.name}! They'll meet you outside! 🐾`, 3);
              }
              return;
            }
            return;
          }
          const nearCounter = Math.hypot(player.x - (4 * 36 + 18), player.y - (3 * 36 + 18)) < 90;
          if (justPressedKeys.interact && nearCounter) { petShopState.open = true; petShopState.selected = 0; return; }
          if (justPressedKeys.interact || justPressedKeys.back) { exitHouse(); return; }
          return;
        }

        if (game.inTheater) {
          if (game.theater.movieMenu) {
            if (justPressedKeys.up)   game.theater.selected = (game.theater.selected - 1 + MOVIES.length) % MOVIES.length;
            if (justPressedKeys.down) game.theater.selected = (game.theater.selected + 1) % MOVIES.length;
            if (justPressedKeys.pause || justPressedKeys.back) { game.theater.movieMenu = false; return; }
            if (justPressedKeys.interact || justPressedKeys.confirm) {
              const mv = MOVIES[game.theater.selected];
              if (getCarriedGold() < mv.price) {
                showNotice(`Need ${mv.price}g for a ticket!`, 1.5);
              } else {
                setCarriedGold(getCarriedGold() - mv.price);
                const msg = mv.fn(player);
                writeSave(game.save);
                showNotice(`🎬 ${msg}`, 3);
              }
              game.theater.movieMenu = false;
            }
            return;
          }
          const W = canvas.width, H = canvas.height;
          const scrCY = (Math.floor((H - 8 * 36) / 2)) + 36 * 3;
          const distToScreen = Math.hypot(player.x - W / 2, player.y - scrCY);
          if (justPressedKeys.interact && distToScreen < 36 * 2.5) {
            game.theater.movieMenu = true; game.theater.selected = 0; return;

          if (justPressedKeys.interact || justPressedKeys.back) { exitHouse(); return; }

            if (justPressedKeys.interact || justPressedKeys.confirm) {
              const item = FURNITURE_ITEMS[prestigeShop.selected];

              if (upgrades.includes(item.id)) {
              } else if (getCarriedGold() < item.price) {

              } else {

          const shopCtrX = 8 * 36 + 18, shopCtrY = 3 * 36 + 18;
          if (justPressedKeys.interact && Math.hypot(player.x - shopCtrX, player.y - shopCtrY) < 90) {
            prestigeShop.open = true; prestigeShop.selected = 0; return;
          }
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (game.inMansion) {
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (justPressedKeys.interact) {

          const bedX = ts + ts, bedY = ts * 2 + ts * 2;            // ≈ 72, 144

          const chestX = ts * 8 + ts, chestY = ts * 5 + ts / 2;   // ≈ 324, 198

          if (Math.hypot(player.x - bedX, player.y - bedY) < 55) {
