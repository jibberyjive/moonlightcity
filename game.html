          }
        ];
      }

      function updateDogs(dt) {
        for (const dog of dogs) {
          dog.wagTime += dt * 6;

          const distToPlayer = Math.hypot(player.x - dog.x, player.y - dog.y);

          if (distToPlayer < 80 && distToPlayer > 20) {
            // Chase player when nearby
            dog.chasing = true;
            const dx = player.x - dog.x, dy = player.y - dog.y;
            const d = Math.hypot(dx, dy) || 1;
            const spd = 72;
            dog.vx = (dx / d) * spd;
            dog.vy = (dy / d) * spd;
            dog.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
            dog.walkTime += dt * 9;
          } else {
            dog.chasing = false;
            dog.wanderTimer -= dt;
            if (dog.wanderTimer <= 0) {
              const angle = Math.random() * Math.PI * 2;
              const dist  = 20 + Math.random() * 60;
              dog.targetX = dog.homeX + Math.cos(angle) * dist;
              dog.targetY = dog.homeY + Math.sin(angle) * dist;
              dog.wanderTimer = 1.5 + Math.random() * 3;
            }
            const dx = dog.targetX - dog.x, dy = dog.targetY - dog.y;
            const d  = Math.hypot(dx, dy);
            if (d > 6) {
              const spd = 38;
              dog.vx = (dx / d) * spd;
              dog.vy = (dy / d) * spd;
              dog.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
              dog.walkTime += dt * 7;
            } else {
              dog.vx = 0; dog.vy = 0;
            }
          }

          dog.x += dog.vx * dt;
          dog.y += dog.vy * dt;
        }
      }

      function drawDogSprite(time, dog) {
        const coat   = dog.coat  || "#c07a3a";
        const coatD  = dog.coatD || shade(coat, -30);
        const ridge  = dog.ridge || shade(coat, -40);
        const ear    = dog.ear   || shade(coat, -20);
        const nose   = dog.nose  || "#1a0800";
        const eye    = dog.eye   || "#3a1800";
        const belly  = dog.belly || shade(coat, 18);

        const moving = Math.hypot(dog.vx, dog.vy) > 6;
        const frame  = moving ? Math.floor(dog.walkTime) % 4 : 0;
        const legA   = [0, 3, 0, -3][frame];   // front leg pair swing
        const legB   = [0, -3, 0, 3][frame];   // back leg pair swing
        // Tail wag — always wagging
        const wag = Math.sin(dog.wagTime) * 4;

        const x = dog.x, y = dog.y;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.20)";
        ctx.beginPath();
        ctx.ellipse(x, y + 6, 11, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        const px = x - 11, py = y - 8;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        const d = dog.dir;

        if (d === "right") {
          // Tail (left/back), wagging vertically
          r(0, 2 + wag * 0.4, 3, 2, coat);
          r(-1, 0 + wag * 0.7, 3, 2, coatD);
          // Body
          r(2, 5, 14, 6, coat);
          r(3, 5, 12, 2, ridge);   // ridge stripe on back
          r(3, 10, 11, 1, belly);  // belly highlight
          // Back legs
          r(3, 10 + legB, 3, 5, coat); r(5, 10 + legB, 2, 5, coatD);
          // Front legs
          r(11, 10 + legA, 3, 5, coat); r(12, 10 + legA, 2, 5, coatD);
          // Neck
          r(15, 2, 3, 6, coat);
          // Head
          r(15, 0, 7, 8, coat);
          // Ear
          r(16, -2, 3, 5, ear);
          // Muzzle
          r(19, 3, 4, 4, coatD);
          // Eye
          r(17, 2, 2, 2, eye);  r(17, 2, 1, 1, "#fff"); // white glint
          // Nose
          r(22, 4, 1, 2, nose);

        } else if (d === "left") {
          // Tail (right/back), wagging
          r(19, 2 + wag * 0.4, 3, 2, coat);
          r(20, 0 + wag * 0.7, 3, 2, coatD);
          // Body
          r(6, 5, 14, 6, coat);
          r(7, 5, 12, 2, ridge);
          r(7, 10, 11, 1, belly);
          // Back legs
          r(14, 10 + legB, 3, 5, coat); r(14, 10 + legB, 2, 5, coatD);
          // Front legs
          r(6, 10 + legA, 3, 5, coat);  r(6, 10 + legA, 2, 5, coatD);
          // Neck
          r(4, 2, 3, 6, coat);
          // Head
          r(0, 0, 7, 8, coat);
          // Ear
          r(3, -2, 3, 5, ear);
          // Muzzle
          r(0, 3, 4, 4, coatD);
          // Eye
          r(3, 2, 2, 2, eye);  r(4, 2, 1, 1, "#fff");
          // Nose
          r(0, 4, 1, 2, nose);

        } else if (d === "down") {
          // Body (front view — short & wide)
          r(3, 6, 16, 6, coat);
          r(4, 6, 14, 2, ridge);
          // Front legs
          r(3, 11 + legA, 3, 5, coat); r(16, 11 + legA, 3, 5, coat);
          // Neck
          r(8, 2, 6, 5, coat);
          // Head
          r(5, -2, 12, 10, coat);
          // Ears (floppy sides)
          r(3, -1, 4, 6, ear); r(15, -1, 4, 6, ear);
          // Eyes
          r(8, 1, 2, 2, eye);  r(8, 1, 1, 1, "#fff");
          r(12, 1, 2, 2, eye); r(12, 1, 1, 1, "#fff");
          // Muzzle
          r(8, 4, 6, 4, coatD);
          // Nose
          r(10, 5, 2, 2, nose);
          // Tail wag (behind body — barely visible)
          r(10, 11 + wag * 0.3, 3, 3, coat);

        } else { // up — back view
          // Tail (top centre), wagging side to side
          r(8, -3 + wag * 0.4, 3, 6, coat);
          r(9, -5 + wag * 0.6, 2, 4, coatD);
          // Body
          r(3, 2, 16, 6, coat);
          r(4, 2, 14, 2, ridge);
          // Butt
          r(5, 7, 12, 3, coatD);
          // Back legs
          r(3, 8 + legB, 3, 5, coat); r(16, 8 + legB, 3, 5, coat);
          // Head (back of head — just a rounded lump)
          r(6, -2, 10, 6, coat);
          r(5, -1, 2, 4, ear); r(15, -1, 2, 4, ear);
        }

        // Name tag when player nearby
        if (Math.hypot(player.x - dog.x, player.y - dog.y) < 60) {
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.65)";
          ctx.fillRect(Math.round(x - 20), Math.round(y - 24), 40, 14);
          ctx.fillStyle = "#f5d080";
          ctx.font = "bold 9px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(`${dog.name} 🐾`, Math.round(x), Math.round(y - 13));
          ctx.textAlign = "left";
          ctx.restore();
        }
      }

      function getView() {
        const zoom = Math.max(1, Math.ceil(Math.max(canvas.width / WORLD_W, canvas.height / WORLD_H)));
        return { zoom, worldW: canvas.width / zoom, worldH: canvas.height / zoom };
      }

      function getCarriedGold() {
        if (!game.save) return 0;
        if (typeof game.save.gold === "number") return game.save.gold;
        return game.save.gold && typeof game.save.gold.carried === "number" ? game.save.gold.carried : 0;
      }

      function setCarriedGold(amount) {
        if (!game.save) return;
        if (typeof game.save.gold !== "object" || !game.save.gold) {
          game.save.gold = { carried: 0, banked: 0 };
        }
        game.save.gold.carried = Math.max(0, Math.floor(amount));
      }

      function addCarriedGold(amount) {
        setCarriedGold(getCarriedGold() + amount);
        writeSave(game.save);
      }

      function syncPlayerVitals() {
        if (!game.save || !game.save.player) return;
        game.save.player.hp = Math.round(player.hp);
        game.save.player.hpMax = Math.round(player.maxHp);
      }

      function showNotice(text, duration = 2) {
        game.noticeText = text;
        game.noticeTimer = duration;
      }

      function isBlockingTile(tx, ty) {
        if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
        return BLOCKING.has(map[ty][tx]);
      }

      function collidesCircle(x, y, radius) {
        const minX = Math.floor((x - radius) / TILE_SIZE);
        const maxX = Math.floor((x + radius) / TILE_SIZE);
        const minY = Math.floor((y - radius) / TILE_SIZE);
        const maxY = Math.floor((y + radius) / TILE_SIZE);
        for (let ty = minY; ty <= maxY; ty++) {
          for (let tx = minX; tx <= maxX; tx++) {
            if (!isBlockingTile(tx, ty)) continue;
            const tileX = tx * TILE_SIZE;
            const tileY = ty * TILE_SIZE;
            const nearestX = clamp(x, tileX, tileX + TILE_SIZE);
            const nearestY = clamp(y, tileY, tileY + TILE_SIZE);
            const dx = x - nearestX, dy = y - nearestY;
            if (dx * dx + dy * dy < radius * radius) return true;
          }
        }
        return false;
      }

      function movePlayer(dt) {
        let inputX = 0, inputY = 0;
        if (keys.left)  inputX -= 1;
        if (keys.right) inputX += 1;
        if (keys.up)    inputY -= 1;
        if (keys.down)  inputY += 1;

        const len = Math.hypot(inputX, inputY) || 1;
        inputX /= len; inputY /= len;

        // Tick speed boost
        if (player.speedBoost > 0) {
          player.speedBoost = Math.max(0, player.speedBoost - dt);
        }
        const effectiveSpeed = player.speed * (player.speedBoost > 0 ? 1.7 : 1);

        const targetVX = inputX * effectiveSpeed;
        const targetVY = inputY * effectiveSpeed;
        const step = player.accel * dt;

        player.vx += clamp(targetVX - player.vx, -step, step);
        player.vy += clamp(targetVY - player.vy, -step, step);

        if (Math.abs(inputX) > 0.01 || Math.abs(inputY) > 0.01) {
          if (Math.abs(inputX) > Math.abs(inputY)) {
            player.dir = inputX > 0 ? "right" : "left";
          } else {
            player.dir = inputY > 0 ? "down" : "up";
          }
        }

        const moving = Math.hypot(player.vx, player.vy) > 4;
        if (moving) {
          player.walkTime += dt * 9;
        }

        const nextX = player.x + player.vx * dt;
        if (!collidesCircle(nextX, player.y, player.radius)) {
          player.x = nextX;
        } else {
          player.vx = 0;
        }

        const nextY = player.y + player.vy * dt;
        if (!collidesCircle(player.x, nextY, player.radius)) {
          player.y = nextY;
        } else {
          player.vy = 0;
        }

        player.x = clamp(player.x, player.radius, WORLD_W - player.radius);
        player.y = clamp(player.y, player.radius, WORLD_H - player.radius);
      }

      function enterDungeon(floorNum) {
        switchScene(SCENE.DUNGEON, () => {
          dungeon.floor = floorNum;
          const src = FLOOR_DATA[floorNum] || FLOOR_01;
          dungeon.data = src;
          dungeon.tiles = src.tiles.slice();
          dungeon.chests = src.chests.map(c => ({ ...c, opened: false }));
          dungeon.barrels = src.barrels.map(b => ({ ...b, broken: false }));
          dungeon.stairsUnlocked = false;
          dungeon.dmgNumbers = [];
          dungeon.enemies = src.enemySpawns.map((sp, i) => {
            const stats = ENEMY_STATS[sp.type];
            return {
              id: i,
              type: sp.type,
              x: sp.x * DTILE_SIZE + DTILE_SIZE / 2,
              y: sp.y * DTILE_SIZE + DTILE_SIZE / 2,
              vx: 0,
              vy: 0,
              hp: stats.maxHp,
              maxHp: stats.maxHp,
              stats,
              ai: sp.ai,
              patrol: sp.patrol ? sp.patrol.map(p => ({ x: p.x * DTILE_SIZE + DTILE_SIZE / 2, y: p.y * DTILE_SIZE + DTILE_SIZE / 2 })) : null,
              patrolIdx: 0,
              attackCooldown: 0,
              hitFlash: 0,
              alive: true
            };
          });

          player.x = src.playerSpawn.x * DTILE_SIZE + DTILE_SIZE / 2;
          player.y = src.playerSpawn.y * DTILE_SIZE + DTILE_SIZE / 2;
          player.vx = 0;
          player.vy = 0;
          player.attackCooldown = 0;
          dungeon.playerHpAtEntry = player.hp;
          camera.x = 0;
          camera.y = 0;
        });
      }

      function enterCandyStore() {
        game.houseExitX = 58 * 32 + 16;  // tile 58,54 — just south of door
        game.houseExitY = 54 * 32 + 16;
        game.inSchool = false;
        game.inCandyStore = true;
        switchScene(SCENE.HOUSE_INTERIOR, () => {
          player.x = 5 * 36 + 18;
          player.y = 6 * 36 + 18;
          player.vx = 0; player.vy = 0;
          player.dir = "up";
        });
      }

      function enterSchool() {
        game.houseExitX = 35 * 32 + 16;
        game.houseExitY = 49 * 32 + 16;
        game.inCandyStore = false;
        game.inSchool = true;
        switchScene(SCENE.HOUSE_INTERIOR, () => {
          player.x = 5 * 36 + 18;
          player.y = 6 * 36 + 18;
          player.vx = 0; player.vy = 0;
          player.dir = "up";
        });
      }

      function enterHouse() {
        const hn = game.save && game.save.player ? (game.save.player.houseNum || 1) : 1;
        const door = HOUSE_DOORS[hn];
        game.houseExitX = door ? door.px : 47 * 32 + 16;
        game.houseExitY = door ? door.py : 24 * 32 + 16;
        game.inCandyStore = false;
        game.inSchool = false;
        switchScene(SCENE.HOUSE_INTERIOR, () => {
          // Place player at interior spawn (near door, bottom centre)
          player.x = 5 * 36 + 18;
          player.y = 6 * 36 + 18;
          player.vx = 0; player.vy = 0;
          player.dir = "up";
        });
      }

      function exitHouse() {
        const wasCandyStore = game.inCandyStore;
        const wasSchool = game.inSchool;
        game.inCandyStore = false;
        game.inSchool = false;
        switchScene(SCENE.CITY, () => {
          player.x = wasCandyStore ? 58 * 32 + 16 : wasSchool ? 35 * 32 + 16 : (game.houseExitX || 47 * 32 + 16);
          player.y = wasCandyStore ? 54 * 32 + 16 : wasSchool ? 49 * 32 + 16 : (game.houseExitY || 24 * 32 + 16);
          player.vx = 0; player.vy = 0;
        });
      }

      function openDialogue(npc) {
        dialogue.active    = true;
        dialogue.npc       = npc;
        dialogue.lineIndex = 0;
        // NPC turns to face the player
        const dx = player.x - npc.x, dy = player.y - npc.y;
        npc.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
        npc.vx = 0; npc.vy = 0;
        npc.wanderTimer = 4; // pause wander after chat
        player.vx = 0; player.vy = 0;
      }

      function advanceDialogue() {
        if (!dialogue.active) return;
        dialogue.lineIndex++;
        if (dialogue.lineIndex >= (dialogue.npc.lines || []).length) {
          dialogue.active = false;
          dialogue.npc    = null;
        }
      }

      function dungeonTileAt(wx, wy) {
        if (!dungeon.data) return DTILE.WALL;
        const tx = Math.floor(wx / DTILE_SIZE);
        const ty = Math.floor(wy / DTILE_SIZE);
        if (tx < 0 || ty < 0 || tx >= dungeon.data.w || ty >= dungeon.data.h) return DTILE.WALL;
        return dungeon.tiles[ty * dungeon.data.w + tx];
      }

      function isDungeonBlockingTile(tile) {
        return tile === DTILE.WALL || tile === DTILE.CHEST || tile === DTILE.BARREL || tile === DTILE.STAIRS_LOCKED;
      }

      function collidesDungeonCircle(x, y, radius) {
        const minX = Math.floor((x - radius) / DTILE_SIZE);
        const maxX = Math.floor((x + radius) / DTILE_SIZE);
        const minY = Math.floor((y - radius) / DTILE_SIZE);
        const maxY = Math.floor((y + radius) / DTILE_SIZE);
        for (let ty = minY; ty <= maxY; ty++) {
          for (let tx = minX; tx <= maxX; tx++) {
            const tile = dungeonTileAt(tx * DTILE_SIZE + DTILE_SIZE / 2, ty * DTILE_SIZE + DTILE_SIZE / 2);
            if (!isDungeonBlockingTile(tile)) continue;
            const tileX = tx * DTILE_SIZE;
            const tileY = ty * DTILE_SIZE;
            const nearestX = clamp(x, tileX, tileX + DTILE_SIZE);
            const nearestY = clamp(y, tileY, tileY + DTILE_SIZE);
            const dx = x - nearestX;
            const dy = y - nearestY;
            if (dx * dx + dy * dy < radius * radius) return true;
          }
        }
        return false;
      }

      function unlockDungeonStairs() {
        if (dungeon.stairsUnlocked || !dungeon.data) return;
        dungeon.stairsUnlocked = true;
        const sp = dungeon.data.stairsPos;
        dungeon.tiles[sp.y * dungeon.data.w + sp.x] = DTILE.STAIRS_UNLOCKED;
        showNotice("The stairs unlocked!", 1.8);
      }

      function updateDungeon(dt) {
        if (!dungeon.data) return;

        let inputX = 0, inputY = 0;
        if (keys.left)  inputX -= 1;
        if (keys.right) inputX += 1;
        if (keys.up)    inputY -= 1;
        if (keys.down)  inputY += 1;

        const len = Math.hypot(inputX, inputY) || 1;
        inputX /= len;
        inputY /= len;

        const onSlime = dungeonTileAt(player.x, player.y) === DTILE.SLIME_PUDDLE;
        const moveSpeed = player.speed * (onSlime ? 0.45 : 1);
        const targetVX = inputX * moveSpeed;
        const targetVY = inputY * moveSpeed;
        const step = player.accel * dt;
        player.vx += clamp(targetVX - player.vx, -step, step);
        player.vy += clamp(targetVY - player.vy, -step, step);

        if (Math.abs(inputX) > 0.01 || Math.abs(inputY) > 0.01) {
          if (Math.abs(inputX) > Math.abs(inputY)) {
            player.dir = inputX > 0 ? "right" : "left";
          } else {
            player.dir = inputY > 0 ? "down" : "up";
          }
        }

        if (Math.hypot(player.vx, player.vy) > 4) {
          player.walkTime += dt * 9;
        }

        const nextX = player.x + player.vx * dt;
        if (!collidesDungeonCircle(nextX, player.y, player.radius)) {
          player.x = nextX;
        } else {
          player.vx = 0;
        }

        const nextY = player.y + player.vy * dt;
        if (!collidesDungeonCircle(player.x, nextY, player.radius)) {
          player.y = nextY;
        } else {
          player.vy = 0;
        }

        if (player.attackCooldown > 0) player.attackCooldown -= dt;
        if (justPressedKeys.attack && player.attackCooldown <= 0) {
          player.attackCooldown = 0.4;
          const range = 38;
          dungeon.enemies.forEach(en => {
            if (!en.alive) return;
            if (Math.hypot(en.x - player.x, en.y - player.y) >= range) return;
            const dmg = 5 + Math.floor(Math.random() * 4);
            en.hp -= dmg;
            en.hitFlash = 0.15;
            dungeon.dmgNumbers.push({ x: en.x, y: en.y - 20, val: `-${dmg}`, age: 0, color: "#ffffff" });
            if (en.hp <= 0) {
              en.alive = false;
              const minGold = en.stats.gold[0];
              const maxGold = en.stats.gold[1];
              const gold = minGold + Math.floor(Math.random() * (maxGold - minGold + 1));
              addCarriedGold(gold);
              dungeon.dmgNumbers.push({ x: en.x, y: en.y - 36, val: `+${gold}`, age: 0, color: "#ffd700" });
            }
          });
          if (dungeon.enemies.every(e => !e.alive)) unlockDungeonStairs();
        }

        dungeon.enemies.forEach(en => {
          if (!en.alive) return;
          en.hitFlash = Math.max(0, en.hitFlash - dt);
          en.attackCooldown = Math.max(0, en.attackCooldown - dt);

          if (en.ai === "patrol" && en.patrol && en.patrol.length) {
            const target = en.patrol[en.patrolIdx];
            const dx = target.x - en.x;
            const dy = target.y - en.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 4) {
              en.patrolIdx = (en.patrolIdx + 1) % en.patrol.length;
            } else {
              en.x += (dx / dist) * en.stats.speed * dt;
              en.y += (dy / dist) * en.stats.speed * dt;
            }
          }

          const hitRange = en.type === "small_slime" ? 28 : 22;
          if (Math.hypot(en.x - player.x, en.y - player.y) < hitRange && en.attackCooldown <= 0) {
            en.attackCooldown = en.ai === "stationary" ? 1.2 : 1.0;
            const dmg = en.stats.damage;
            player.hp = Math.max(0, player.hp - dmg);
            dungeon.dmgNumbers.push({ x: player.x, y: player.y - 20, val: `-${dmg}`, age: 0, color: "#ff6060" });
          }
        });

        dungeon.chests.forEach(ch => {
          if (ch.opened) return;
          const cx = ch.x * DTILE_SIZE + DTILE_SIZE / 2;
          const cy = ch.y * DTILE_SIZE + DTILE_SIZE / 2;
          if (Math.hypot(player.x - cx, player.y - cy) < 36 && justPressedKeys.interact) {
            ch.opened = true;
            dungeon.tiles[ch.y * dungeon.data.w + ch.x] = DTILE.FLOOR;
            const gold = 8 + Math.floor(Math.random() * 8);
            addCarriedGold(gold);
            dungeon.dmgNumbers.push({ x: cx, y: cy - 20, val: `+${gold}`, age: 0, color: "#ffd700" });
            showNotice("Chest opened!", 1.4);
          }
        });

        dungeon.barrels.forEach(br => {
          if (br.broken) return;
          const bx = br.x * DTILE_SIZE + DTILE_SIZE / 2;
          const by = br.y * DTILE_SIZE + DTILE_SIZE / 2;
          if (Math.hypot(player.x - bx, player.y - by) < 36 && (justPressedKeys.interact || justPressedKeys.attack)) {
            br.broken = true;
            dungeon.tiles[br.y * dungeon.data.w + br.x] = DTILE.FLOOR;
            if (Math.random() < 0.6) {
              const gold = 1 + Math.floor(Math.random() * 3);
              addCarriedGold(gold);
              dungeon.dmgNumbers.push({ x: bx, y: by - 20, val: `+${gold}`, age: 0, color: "#ffd700" });
            }
          }
        });

        const sp = dungeon.data.stairsPos;
        const sx = sp.x * DTILE_SIZE + DTILE_SIZE / 2;
        const sy = sp.y * DTILE_SIZE + DTILE_SIZE / 2;
        // Descend stairs
        if (dungeon.stairsUnlocked && Math.hypot(player.x - sx, player.y - sy) < 32 && justPressedKeys.interact) {
          const nextFloor = dungeon.floor + 1;
          if (FLOOR_DATA[nextFloor]) {
            enterDungeon(nextFloor);
          } else {
            showNotice(`Floor ${nextFloor} — Coming soon!`, 2.5);
          }
        }

        // Ascend / go back up (E at up-stairs position or at spawn on floor 1)
        const up = dungeon.data.upStairsPos;
        const upX = up ? up.x * DTILE_SIZE + DTILE_SIZE / 2 : dungeon.data.playerSpawn.x * DTILE_SIZE + DTILE_SIZE / 2;
        const upY = up ? up.y * DTILE_SIZE + DTILE_SIZE / 2 : dungeon.data.playerSpawn.y * DTILE_SIZE + DTILE_SIZE / 2;
        if (Math.hypot(player.x - upX, player.y - upY) < 32 && justPressedKeys.back) {
          if (dungeon.floor > 1) {
            enterDungeon(dungeon.floor - 1);
          } else {
            switchScene(SCENE.CITY, () => {
              player.x = 17 * TILE_SIZE + TILE_SIZE / 2;
              player.y = 56 * TILE_SIZE + TILE_SIZE / 2;
              player.vx = 0; player.vy = 0; player.attackCooldown = 0;
            });
          }
        }

        if (player.hp <= 0) {
          setCarriedGold(getCarriedGold() * 0.8);
          player.hp = player.maxHp;
          syncPlayerVitals();
          writeSave(game.save);
          showNotice("You blacked out and dropped some gold.", 2.5);
          switchScene(SCENE.CITY, () => {
            player.x = 20 * TILE_SIZE + TILE_SIZE / 2;
            player.y = 13 * TILE_SIZE + TILE_SIZE / 2;
            player.vx = 0;
            player.vy = 0;
            player.attackCooldown = 0;
          });
          return;
        }

        dungeon.dmgNumbers = dungeon.dmgNumbers.filter(d => d.age < 1.2);
        dungeon.dmgNumbers.forEach(d => { d.age += dt; });
        syncPlayerVitals();

        const dungeonW = dungeon.data.w * DTILE_SIZE;
        const dungeonH = dungeon.data.h * DTILE_SIZE;
        camera.x = clamp(player.x - canvas.width / 2, 0, Math.max(0, dungeonW - canvas.width));
        camera.y = clamp(player.y - canvas.height / 2, 0, Math.max(0, dungeonH - canvas.height));
      }

      // ==================================================
      // === RENDERING ====================================
      // ==================================================

      function drawGrass(x, y, tileX, tileY, base) {
        ctx.fillStyle = base;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        for (let i = 0; i < 4; i++) {
          const nx = noise(tileX * 2 + i, tileY, i);
          const ny = noise(tileX, tileY * 3 + i, i + 11);
          const px = x + 3 + Math.floor(nx * 24);
          const py = y + 3 + Math.floor(ny * 24);
          ctx.fillStyle = shade(base, i % 2 === 0 ? 10 : -12);
          ctx.fillRect(px, py, 3 + (i % 2), 2 + ((i + 1) % 2));
        }

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        ctx.fillRect(x + 2, y + 2, 1, 1);
        ctx.fillRect(x + 18, y + 8, 1, 1);
        ctx.fillRect(x + 25, y + 20, 1, 1);
      }

      function drawPath(x, y, tileX, tileY) {
        ctx.fillStyle = COLORS.path;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = "rgba(110,80,38,0.18)";
        for (let i = 0; i < 5; i++) {
          const px = x + 2 + Math.floor(noise(tileX, tileY, i + 20) * 26);
          const py = y + 2 + Math.floor(noise(tileY, tileX, i + 30) * 26);
          ctx.fillRect(px, py, 2, 2);
        }
        ctx.fillStyle = "rgba(255,230,180,0.10)";
        ctx.fillRect(x + 5, y + 4, 18, 3);
      }

      function drawWater(x, y, tileX, tileY, time) {
        ctx.fillStyle = COLORS.water;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        const shimmer = 0.18 + 0.12 * Math.sin(time * 2.8 + tileX * 0.8 + tileY * 0.45);
        ctx.fillStyle = `rgba(141, 201, 255, ${shimmer.toFixed(3)})`;
        ctx.fillRect(x + 3, y + 7, 22, 3);
        ctx.fillRect(x + 10, y + 17, 16, 2);
        ctx.fillRect(x + 6, y + 25, 12, 2);

        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 12);
        ctx.quadraticCurveTo(x + 12, y + 8, x + 20, y + 12);
        ctx.quadraticCurveTo(x + 25, y + 15, x + 29, y + 12);
        ctx.stroke();
      }

      function drawFlowers(x, y, tileX, tileY) {
        drawGrass(x, y, tileX, tileY, COLORS.grass);
        const palette = ["#f1d84e", "#db5d5d", "#b777ea", "#ffef8f"];
        for (let i = 0; i < 8; i++) {
          const px = x + 4 + Math.floor(noise(tileX, tileY, i + 40) * 24);
          const py = y + 4 + Math.floor(noise(tileY, tileX, i + 50) * 24);
          ctx.fillStyle = palette[i % palette.length];
          ctx.fillRect(px, py, 2, 2);
        }
      }

      function drawStone(x, y, tileX, tileY) {
        const isCandy = tileX >= CANDY_STORE.x1 && tileX <= CANDY_STORE.x2 &&
                        tileY >= CANDY_STORE.y1 && tileY <= CANDY_STORE.y2;
        const isSchool = tileX >= SCHOOL.x1 && tileX <= SCHOOL.x2 &&
                         tileY >= SCHOOL.y1 && tileY <= SCHOOL.y2;

        if (isCandy) {
          // ── Candy Store roof — pink tiles ───────────────────────
          const pinkA = noise(tileX, tileY, 99) < 0.45 ? "#e8608a" : "#f07aa0";
          ctx.fillStyle = pinkA;
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          // Shingle lines in deeper pink
          ctx.fillStyle = "rgba(180,40,80,0.3)";
          for (let row = 1; row < 4; row++) ctx.fillRect(x, y + row * 8, TILE_SIZE, 1);
          const stg = ((tileX + tileY) % 2 === 0) ? 0 : 8;
          ctx.fillStyle = "rgba(180,40,80,0.18)";
          for (let row = 0; row < 4; row++) {
            ctx.fillRect(x + stg + row * 16,     y + row * 8, 1, 8);
            ctx.fillRect(x + stg + row * 16 + 8, y + row * 8, 1, 8);
          }
          // Candy cane stripe accent on roof
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.fillRect(x + 4, y, 3, TILE_SIZE);
          ctx.fillRect(x + 20, y, 3, TILE_SIZE);

          // South-edge pink wall face
          const southTile = (tileY + 1 < MAP_H) ? map[tileY + 1][tileX] : -1;
          const isEdge = southTile !== TILE.STONE;
          if (isEdge) {
            // Candy-stripe wall: alternating pink & white bands
            for (let i = 0; i < 5; i++) {
              ctx.fillStyle = i % 2 === 0 ? "#ffd6e8" : "#ff8ab8";
              ctx.fillRect(x + i * 7, y + TILE_SIZE - 9, 7, 9);
            }
            ctx.fillRect(x + 35, y + TILE_SIZE - 9, TILE_SIZE - 35, 9);  // fill remainder
            // Roof overhang shadow
            ctx.fillStyle = "rgba(0,0,0,0.25)";
            ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
            // Heart windows
            ctx.fillStyle = "#ffe0f0";
            ctx.fillRect(x + 4,            y + TILE_SIZE - 8, 5, 5);
            ctx.fillRect(x + TILE_SIZE - 9, y + TILE_SIZE - 8, 5, 5);
            ctx.fillStyle = "rgba(200,60,100,0.5)";
            ctx.strokeStyle = "rgba(200,60,100,0.5)";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 4,            y + TILE_SIZE - 8, 5, 5);
            ctx.strokeRect(x + TILE_SIZE - 9, y + TILE_SIZE - 8, 5, 5);

            // "Sweet Dreams" sign above door tile (centre column)
            if (tileX === 32) {
              ctx.fillStyle = "#ff4d88";
              ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("🍬 Sweet Dreams", x + TILE_SIZE / 2, y + TILE_SIZE - 11);
              ctx.textAlign = "left";
            }
          }

          // West-edge
          const westTile = (tileX - 1 >= 0) ? map[tileY][tileX - 1] : -1;
          if (westTile !== TILE.STONE) {
            ctx.fillStyle = "#f0a0c8";
            ctx.fillRect(x, y, 4, TILE_SIZE);
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.fillRect(x, y, 1, TILE_SIZE);
          }

        } else {
          const roofColor = isSchool ? "#6b2a1a" : COLORS.stone;
          ctx.fillStyle = roofColor;
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

        // Horizontal shingle lines
        ctx.fillStyle = "rgba(0,0,0,0.22)";
        for (let row = 1; row < 4; row++) {
          ctx.fillRect(x, y + row * 8, TILE_SIZE, 1);
        }
        // Vertical stagger on shingles (alternating per row)
        ctx.fillStyle = "rgba(0,0,0,0.13)";
        const stg = ((tileX + tileY) % 2 === 0) ? 0 : 8;
        for (let row = 0; row < 4; row++) {
          ctx.fillRect(x + stg + row * 16,     y + row * 8, 1, 8);
          ctx.fillRect(x + stg + row * 16 + 8, y + row * 8, 1, 8);
        }

        // South-edge wall face (where building meets the street)
        const southTile = (tileY + 1 < MAP_H) ? map[tileY + 1][tileX] : -1;
        const isEdge = southTile !== TILE.STONE;
        if (isEdge) {
          const wallColor = isSchool ? "#8b3a2a" : "#d2c49a";
          const trimColor = isSchool ? "#e8d080" : "#d2c49a";
          const frameColor = isSchool ? "rgba(90,40,20,0.75)" : "rgba(80,50,20,0.6)";
          // Wall strip
          ctx.fillStyle = wallColor;
          ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 9);
          // Dark line where roof overhangs wall
          ctx.fillStyle = isSchool ? "rgba(60,20,10,0.45)" : "rgba(0,0,0,0.35)";
          ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
          // Trim band
          ctx.fillStyle = trimColor;
          ctx.fillRect(x, y + TILE_SIZE - 9, TILE_SIZE, 2);
          // Small windows
          ctx.fillStyle = "#a8d8ff";
          ctx.fillRect(x + 5,             y + TILE_SIZE - 8, 5, 5);
          ctx.fillRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 5, 5);
          // Window frames
          ctx.fillStyle = frameColor;
          ctx.strokeStyle = frameColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 5,             y + TILE_SIZE - 8, 5, 5);
          ctx.strokeRect(x + TILE_SIZE - 10, y + TILE_SIZE - 8, 5, 5);

          if (isSchool && tileX === 35 && tileY === 48) {
            ctx.fillStyle = "#e8d080";
            ctx.font = "bold 7px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🎓 Moonlight Academy", x + TILE_SIZE / 2, y + TILE_SIZE - 11);
            ctx.textAlign = "left";
          }
        }

        // West-edge wall face
        const westTile = (tileX - 1 >= 0) ? map[tileY][tileX - 1] : -1;
        if (westTile !== TILE.STONE) {
          ctx.fillStyle = isSchool ? "#7a3022" : "#b8a882";
          ctx.fillRect(x, y, 4, TILE_SIZE);
          ctx.fillStyle = isSchool ? "rgba(70,20,10,0.28)" : "rgba(0,0,0,0.2)";
          ctx.fillRect(x, y, 1, TILE_SIZE);
        }
        } // end else (non-candy buildings)

        // Door on this tile (if it's a designated door tile)
        const doorFacing = BUILDING_DOOR_TILES[`${tileX},${tileY}`];
        if (doorFacing) {
          const doorY = doorFacing === "south" ? y + TILE_SIZE - 9 : y;
          const doorH = 9;
          if (isCandy) {
            // Pink candy door
            ctx.fillStyle = "#c0185a";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#f04880";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(x + 18, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,220,240,0.3)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else if (isSchool) {
            ctx.fillStyle = "#5a1810";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#8f2a1e";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#e8d080";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,235,190,0.2)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          } else {
            // Regular brown door
            ctx.fillStyle = "#3a1e08";
            ctx.fillRect(x + 10, doorY, 12, doorH);
            ctx.fillStyle = "#7a4a18";
            ctx.fillRect(x + 11, doorY + 1, 10, doorH - 1);
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(doorFacing === "south" ? x + 18 : x + 12, doorY + 3, 2, 2);
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(x + 12, doorY + 1, 3, doorH - 2);
          }
        }

        // Highlight top-left corner (light source hint)
        ctx.fillStyle = isCandy ? "rgba(255,200,230,0.12)" : isSchool ? "rgba(255,230,180,0.12)" : "rgba(255,255,220,0.08)";
        ctx.fillRect(x, y, TILE_SIZE, 3);
      }

      function drawDarkPath(x, y, tileX, tileY) {
        // Slums cracked cobblestone
        ctx.fillStyle = COLORS.darkPath;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        // Cobble grain
        ctx.fillStyle = "rgba(80,60,40,0.22)";
        for (let i = 0; i < 4; i++) {
          const px = x + 2 + Math.floor(noise(tileX + i, tileY, i + 60) * 26);
          const py = y + 2 + Math.floor(noise(tileY + i, tileX, i + 70) * 26);
          ctx.fillRect(px, py, 3, 2);
        }
        // Crack line
        if (noise(tileX, tileY, 80) > 0.55) {
          ctx.strokeStyle = COLORS.darkPathCrack;
          ctx.lineWidth = 1;
          ctx.beginPath();
          const cx1 = x + 4 + Math.floor(noise(tileX, tileY, 81) * 18);
          const cx2 = x + 6 + Math.floor(noise(tileX, tileY, 82) * 18);
          ctx.moveTo(cx1, y + 3);
          ctx.lineTo(cx2, y + 16);
          ctx.lineTo(cx1 + 4, y + 28);
          ctx.stroke();
        }
      }

      function drawGroundTile(tile, tileX, tileY, time) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;

        switch (tile) {
          case TILE.DARK_GRASS:
            drawGrass(x, y, tileX, tileY, COLORS.darkGrass);
            break;
          case TILE.PATH:
            drawPath(x, y, tileX, tileY);
            break;
          case TILE.WATER:
            drawWater(x, y, tileX, tileY, time);
            break;
          case TILE.FLOWERS:
            drawFlowers(x, y, tileX, tileY);
            break;
          case TILE.STONE:
            drawStone(x, y, tileX, tileY);
            break;
          case TILE.DARK_PATH:
            drawDarkPath(x, y, tileX, tileY);
            break;
          default:
            drawGrass(x, y, tileX, tileY, COLORS.grass);
            break;
        }

        // Drop shadow cast by buildings to the north
        if (tile !== TILE.STONE && tileY > 0 && map[tileY - 1][tileX] === TILE.STONE) {
          ctx.fillStyle = "rgba(0,0,0,0.25)";
          ctx.fillRect(x, y, TILE_SIZE, 7);
        }

        // Doorstep — draw a welcome mat on the tile just outside a door
        const southDoor = BUILDING_DOOR_TILES[`${tileX},${tileY - 1}`];
        const northDoor = BUILDING_DOOR_TILES[`${tileX},${tileY + 1}`];
        if (southDoor === "south" || northDoor === "north") {
          const matY = southDoor === "south" ? y + 2 : y + TILE_SIZE - 9;
          ctx.fillStyle = "#8a3010";
          ctx.fillRect(x + 8, matY, 16, 6);
          ctx.fillStyle = "#c05020";
          ctx.fillRect(x + 10, matY + 1, 12, 4);
        }
      }

      function drawRock(tileX, tileY) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;
        ctx.fillStyle = COLORS.rock;
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 24);
        ctx.quadraticCurveTo(x + 5, y + 12, x + 13, y + 10);
        ctx.quadraticCurveTo(x + 20, y + 4, x + 26, y + 11);
        ctx.quadraticCurveTo(x + 30, y + 16, x + 27, y + 25);
        ctx.quadraticCurveTo(x + 18, y + 29, x + 6, y + 24);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.20)";
        ctx.beginPath();
        ctx.ellipse(x + 15, y + 15, 7, 4, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(80,80,80,0.35)";
        ctx.beginPath();
        ctx.moveTo(x + 11, y + 13);
        ctx.lineTo(x + 16, y + 18);
        ctx.lineTo(x + 13, y + 23);
        ctx.stroke();
      }

      function drawTree(tileX, tileY, time) {
        const x = tileX * TILE_SIZE;
        const y = tileY * TILE_SIZE;
        const sway = Math.sin(time * 1.3 + tileX * 0.7 + tileY * 0.5) * 1.4;

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.beginPath();
        ctx.ellipse(x + 16, y + 23, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.trunk;
        ctx.fillRect(x + 13, y + 15, 6, 13);

        ctx.fillStyle = COLORS.leaves;
        ctx.beginPath();
        ctx.arc(x + 16 + sway, y + 10, 12, 0, Math.PI * 2);
        ctx.arc(x + 10 + sway * 0.8, y + 14, 9, 0, Math.PI * 2);
        ctx.arc(x + 22 + sway * 0.8, y + 14, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLORS.leavesHi;
        ctx.beginPath();
        ctx.arc(x + 12 + sway, y + 8, 5, 0, Math.PI * 2);
        ctx.arc(x + 20 + sway, y + 11, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawObstacle(tile, tileX, tileY, time) {
        if (tile === TILE.TREE) drawTree(tileX, tileY, time);
        if (tile === TILE.ROCK) drawRock(tileX, tileY);
      }

      function drawPlayerSprite(time, p) {
        const skinColor = SKIN_TONES[p.skin]        || SKIN_TONES[0];
        const hairColor = HAIR_COLORS[p.hairColour]  || HAIR_COLORS[0];
        const outfit    = OUTFIT_COLORS[p.outfit]    || OUTFIT_COLORS[0];
        // Convert player's indexed colours into the same NPC-style hex object,
        // then let drawNpcSprite handle all the drawing.
        drawNpcSprite(time, {
          id: "__player__", name: "",
          x: p.x, y: p.y,
          vx: p.vx || 0, vy: p.vy || 0,
          dir: p.dir || "down",
          walkTime: p.walkTime || 0,
          homeX: p.x,
          skin:      skinColor,
          hair:      hairColor,
          torso:     outfit.torso,
          legs:      outfit.legs,
          hairStyle: p.hairStyle || 0,
          ageType:   p.ageType   || "adult"
        });
      }
      // drawPlayer uses the live player object — called by city scene
      function drawPlayer(time) { drawPlayerSprite(time, player); }

      function drawToddlerSprite(time, npc) {
        const skin  = npc.skin,  hair = npc.hair;
        const skinS = shade(skin, -15), hairD = shade(hair, -25);
        const blush = shade(skin, 20);
        const T = npc.torso, L = npc.legs, SH = "#3a2010";

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        // Toddlers waddle: wider, slower arm swing
        const bob   = moving ? Math.sin(npc.walkTime * Math.PI) * 0.5 : Math.sin(time * 1.8 + (npc.homeX||0) * 0.01) * 0.3;
        const frame = moving ? Math.floor(npc.walkTime) % 4 : 0;
        const ls = [0, 2, 0, -2][frame] * 0.6;
        const as = [0, -2,  0,  2][frame];  // arms swing wide
        const x = npc.x, y = npc.y + bob, d = npc.dir;

        // Shadow (smaller)
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath();
        ctx.ellipse(x, y + 10, 6, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Toddler is centred at (x-8, y-14) — 16×22 cell
        const px = x - 8, py = y - 14;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        if (d === "down") {
          // Shoes
          r(2-ls, 19, 5, 3, SH); r(9+ls, 19, 5, 3, SH);
          // Legs (short & stubby)
          r(3-ls, 14, 4, 6, L);  r(9+ls, 14, 4, 6, L);
          // Arms (spread out wide — toddler style)
          r(-1-as*0.4, 10, 3, 6, skin); r(14+as*0.4, 10, 3, 6, skin);
          // Tummy (round, chubby torso)
          r(2, 9, 12, 6, T);
          // Neck
          r(6, 7, 4, 3, skin);
          // Big round head
          r(1, 0, 14, 12, skin);
          // Side shading
          r(0, 2, 2, 7, skinS); r(14, 2, 2, 7, skinS);
          // Chubby cheeks (stronger blush on toddlers)
          r(2, 7, 4, 3, blush); r(10, 7, 4, 3, blush);
          // Big eyes
          r(4, 2, 4, 5, "#fff"); r(9, 2, 4, 5, "#fff");
          r(5, 3, 3, 4, "#1a1a2e"); r(10, 3, 3, 4, "#1a1a2e");
          r(5, 3, 1, 1, "#fff");    r(10, 3, 1, 1, "#fff");
          // Tiny smile
          r(6, 9, 4, 1, skinS);
          // Little ear nubs
          r(0, 4, 1, 3, skin); r(15, 4, 1, 3, skin);
        } else if (d === "up") {
          r(2-ls, 19, 5, 3, SH); r(9+ls, 19, 5, 3, SH);
          r(3-ls, 14, 4, 6, shade(L,-10)); r(9+ls, 14, 4, 6, shade(L,-10));
          r(-1+as*0.4, 10, 3, 6, shade(skin,-12)); r(14-as*0.4, 10, 3, 6, shade(skin,-12));
          r(2, 9, 12, 6, shade(T,-15));
          r(6, 7, 4, 3, shade(skin,-15));
          r(1, 0, 14, 12, shade(skin,-12));
          r(0, 2, 2, 7, shade(skin,-22)); r(14, 2, 2, 7, shade(skin,-22));
        } else if (d === "left") {
          r(3-ls*0.5, 19, 5, 3, SH); r(8+ls*0.5, 19, 5, 3, SH);
          r(4-ls*0.5, 14, 4, 6, L);  r(8+ls*0.5, 14, 4, 6, shade(L,-10));
          r(0, 10+as*0.4, 3, 6, skin); r(13, 9-as*0.4, 3, 5, skinS);
          r(2, 9, 12, 6, T); r(12, 9, 2, 6, shade(T,-15));
          r(6, 7, 4, 3, skin); r(10, 7, 2, 3, skinS);
          r(1, 0, 14, 12, skin); r(13, 0, 2, 12, skinS);
          r(1, 2, 1, 6, skinS);
          r(2, 7, 3, 3, blush);
          r(4, 2, 4, 5, "#fff"); r(5, 3, 3, 4, "#1a1a2e"); r(5, 3, 1, 1, "#fff");
        } else { // right
          r(4-ls*0.5, 19, 5, 3, SH); r(9+ls*0.5, 19, 5, 3, SH);
          r(4-ls*0.5, 14, 4, 6, shade(L,-10)); r(9+ls*0.5, 14, 4, 6, L);
          r(13, 10-as*0.4, 3, 6, skin); r(1, 9+as*0.4, 3, 5, skinS);
          r(2, 9, 12, 6, T); r(2, 9, 2, 6, shade(T,-15));
          r(6, 7, 4, 3, skin); r(6, 7, 2, 3, skinS);
          r(1, 0, 14, 12, skin); r(1, 0, 2, 12, skinS);
          r(15, 2, 1, 6, skinS);
          r(11, 7, 3, 3, blush);
          r(9, 2, 4, 5, "#fff"); r(9, 3, 3, 4, "#1a1a2e"); r(11, 3, 1, 1, "#fff");
        }

        // Hair (simplified for toddler — just a little tuft)
        const h = hair, hd = hairD;
        if (d !== "up") {
          if (npc.hairStyle <= 1) {
            r(2, 0, 12, 3, h); r(1, 1, 2, 2, h); r(13, 1, 2, 2, h);
          } else if (npc.hairStyle === 2) {
            r(1, 0, 14, 4, h); r(0, 1, 2, 3, h); r(14, 1, 2, 3, h);
          } else {
            r(2, 0, 12, 5, h); r(6, 0, 4, 2, hd);
          }
        } else {
          r(1, 0, 14, 4, shade(h, -12));
        }

        // Name tag (only for named NPCs)
        if (npc.name) {
          const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
          if (dist < 80) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.font = "9px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            const tw = ctx.measureText(npc.name).width + 6;
            ctx.fillRect(x - tw/2, y - 26, tw, 12);
            ctx.fillStyle = "#ffe8c0";
            ctx.fillText(npc.name, x, y - 17);
            ctx.textAlign = "left";
          }
        }
      }

      function drawChildSprite(time, npc) {
        const skin = npc.skin, hair = npc.hair;
        const skinS = shade(skin, -14), hairD = shade(hair, -22);
        const blazer = "#1e3a8a", blazerS = "#172c68";
        const bottoms = "#4a4a5a", bottomsS = "#373744";
        const tie = "#b42028", shoes = "#1a1a1a", bag = "#4a2e1d";

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        const bob = moving ? Math.sin(npc.walkTime * Math.PI) * 0.55 : Math.sin(time * 1.7 + (npc.homeX || 0) * 0.01) * 0.35;
        const frame = moving ? Math.floor(npc.walkTime) % 4 : 0;
        const ls = [0, 1.5, 0, -1.5][frame];
        const as = [0, -1.2, 0, 1.2][frame];
        const x = npc.x, y = npc.y + bob, d = npc.dir;

        ctx.fillStyle = "rgba(0,0,0,0.17)";
        ctx.beginPath();
        ctx.ellipse(x, y + 12, 7, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        const px = x - 9, py = y - 18;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        if (d === "down") {
          r(3-ls, 24, 5, 4, shoes); r(10+ls, 24, 5, 4, shoes);
          r(4-ls, 18, 4, 7, bottoms); r(10+ls, 18, 4, 7, bottoms);
          r(1-as*0.5, 13, 3, 8, skin); r(15+as*0.5, 13, 3, 8, skin);
          r(3, 11, 12, 8, blazer); r(3, 11, 2, 8, blazerS); r(13, 11, 2, 8, blazerS);
          r(7, 11, 4, 2, "#ffffff"); r(8, 13, 2, 4, tie);
          r(6, 8, 6, 3, skin);
          r(3, 0, 12, 11, skin); r(3, 0, 2, 11, skinS); r(13, 0, 2, 11, skinS);
          r(0, 3, 2, 4, skin); r(16, 3, 2, 4, skin);
          r(6, 3, 3, 4, "#fff"); r(10, 3, 3, 4, "#fff");
          r(7, 4, 2, 3, "#1a1a2e"); r(10, 4, 2, 3, "#1a1a2e");
          r(7, 4, 1, 1, "#fff"); r(10, 4, 1, 1, "#fff");
          r(7, 8, 4, 1, skinS);
        } else if (d === "up") {
          r(3-ls, 24, 5, 4, shoes); r(10+ls, 24, 5, 4, shoes);
          r(4-ls, 18, 4, 7, bottomsS); r(10+ls, 18, 4, 7, bottomsS);
          r(1+as*0.5, 13, 3, 8, shade(skin, -10)); r(15-as*0.5, 13, 3, 8, shade(skin, -10));
          r(2, 10, 14, 10, blazerS);
          r(6, 11, 6, 6, bag);
          r(6, 8, 6, 3, shade(skin, -12));
          r(3, 0, 12, 11, shade(skin, -12)); r(3, 0, 2, 11, shade(skin, -22)); r(13, 0, 2, 11, shade(skin, -22));
        } else if (d === "left") {
          r(4-ls*0.5, 24, 5, 4, shoes); r(9+ls*0.5, 24, 5, 4, shoes);
          r(4-ls*0.5, 18, 4, 7, bottoms); r(9+ls*0.5, 18, 4, 7, bottomsS);
          r(0, 13+as*0.4, 3, 7, skin); r(14, 12-as*0.4, 3, 6, skinS);
          r(3, 11, 11, 8, blazer); r(12, 11, 2, 8, blazerS);
          r(7, 11, 3, 2, "#ffffff"); r(7, 13, 2, 4, tie);
          r(6, 8, 5, 3, skin); r(10, 8, 2, 3, skinS);
          r(3, 0, 12, 11, skin); r(13, 0, 2, 11, skinS);
          r(2, 4, 1, 4, skinS); r(6, 3, 3, 4, "#fff"); r(7, 4, 2, 3, "#1a1a2e"); r(7, 4, 1, 1, "#fff");
        } else {
          r(4-ls*0.5, 24, 5, 4, shoes); r(9+ls*0.5, 24, 5, 4, shoes);
          r(4-ls*0.5, 18, 4, 7, bottomsS); r(9+ls*0.5, 18, 4, 7, bottoms);
          r(15, 13-as*0.4, 3, 7, skin); r(1, 12+as*0.4, 3, 6, skinS);
          r(4, 11, 11, 8, blazer); r(4, 11, 2, 8, blazerS);
          r(8, 11, 3, 2, "#ffffff"); r(9, 13, 2, 4, tie);
          r(7, 8, 5, 3, skin); r(7, 8, 2, 3, skinS);
          r(3, 0, 12, 11, skin); r(3, 0, 2, 11, skinS);
          r(15, 4, 1, 4, skinS); r(9, 3, 3, 4, "#fff"); r(9, 4, 2, 3, "#1a1a2e"); r(10, 4, 1, 1, "#fff");
        }

        if (d !== "up") {
          r(3, 0, 12, npc.hairStyle >= 2 ? 4 : 3, hair);
          r(3, 0, 2, 4, hairD); r(13, 0, 2, 4, hairD);
          if (npc.hairStyle >= 3) r(7, 0, 4, 2, hairD);
        } else {
          r(3, 0, 12, 4, shade(hair, -12));
          r(5, 0, 8, 2, hairD);
        }

        if (npc.name) {
          const dist = Math.hypot(npc.x - player.x, npc.y - player.y);
          if (dist < 80) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.font = "9px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            const tw = ctx.measureText(npc.name).width + 6;
            ctx.fillRect(x - tw/2, y - 30, tw, 12);
            ctx.fillStyle = "#ffe8c0";
            ctx.fillText(npc.name, x, y - 21);
            ctx.textAlign = "left";
          }
        }
      }

      function drawNpcSprite(time, npc) {
        if (npc.ageType === "toddler") { drawToddlerSprite(time, npc); return; }
        if (npc.ageType === "child")   { drawChildSprite(time, npc);   return; }
        const skin  = npc.skin;
        const hair  = npc.hair;
        const skinS = shade(skin, -15);
        const hairD = shade(hair, -25);
        const blush = shade(skin, 16);
        const T     = npc.torso;
        const TS    = shade(T, -18);
        const L     = npc.legs;
        const LS    = shade(L, -18);
        const SH    = "#3a2010";

        const moving = Math.hypot(npc.vx, npc.vy) > 4;
        const bob    = moving ? Math.sin(npc.walkTime * Math.PI) * 0.6 : Math.sin(time * 1.8 + npc.homeX * 0.01) * 0.4;
        const frame  = moving ? Math.floor(npc.walkTime) % 4 : 0;
        const ls = [0, 2, 0, -2][frame];
        const as = [0, -1.5, 0, 1.5][frame];
        const x  = npc.x, y = npc.y + bob, d = npc.dir;

        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.beginPath();
        ctx.ellipse(x, y + 14, 8, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        const px = x - 10, py = y - 20;
        function r(rx, ry, rw, rh, c) {
          ctx.fillStyle = c;
          ctx.fillRect(Math.round(px + rx), Math.round(py + ry), rw, rh);
        }

        if (d === "down") {
          r(4-ls, 28,6,4,SH); r(10+ls,28,6,4,SH);
          r(5-ls, 22,5,7,L);  r(10+ls,22,5,7,L);
          r(1-as*0.5,16,4,9,skin); r(15+as*0.5,16,4,9,skin);
          r(4,14,12,9,T);
          r(7,11,6,4,skin);
          r(3,0,14,13,skin); r(2,4,2,5,skinS); r(16,4,2,5,skinS);
          r(4,8,3,2,blush); r(13,8,3,2,blush);
          r(6,4,3,4,"#fff"); r(11,4,3,4,"#fff");
          r(7,5,2,3,"#1a1a2e"); r(12,5,2,3,"#1a1a2e");
          r(7,5,1,1,"#fff"); r(12,5,1,1,"#fff");
          r(8,10,4,1,skinS);
        } else if (d === "up") {
          r(4-ls,28,6,4,SH); r(10+ls,28,6,4,SH);
          r(5-ls,22,5,7,LS); r(10+ls,22,5,7,LS);
          r(1+as*0.5,16,4,9,shade(skin,-15)); r(15-as*0.5,16,4,9,shade(skin,-15));
          r(4,14,12,9,TS); r(7,11,6,4,shade(skin,-15));
          r(3,0,14,13,shade(skin,-15)); r(2,4,2,5,shade(skin,-22)); r(16,4,2,5,shade(skin,-22));
        } else if (d === "left") {
          r(4-ls*0.6,28,6,4,SH); r(9+ls*0.6,28,6,4,SH);
          r(5-ls*0.6,22,5,7,L); r(9+ls*0.6,22,5,7,LS);
          r(2,15+as*0.5,4,9,skin); r(14,14-as*0.5,3,8,skinS);
          r(4,14,12,9,T); r(13,14,3,9,TS);
          r(7,11,5,4,skin); r(11,11,2,4,skinS);
          r(3,0,14,13,skin); r(14,0,3,13,skinS); r(2,4,2,5,skinS);
          r(4,8,2,2,blush);
          r(5,4,3,4,"#fff"); r(6,5,2,3,"#1a1a2e"); r(6,5,1,1,"#fff");
          r(5,10,3,1,skinS);
        } else {
          r(6-ls*0.6,28,6,4,SH); r(10+ls*0.6,28,6,4,SH);
          r(6-ls*0.6,22,5,7,LS); r(10+ls*0.6,22,5,7,L);
          r(13,15-as*0.5,4,9,skin); r(3,14+as*0.5,3,8,skinS);
          r(4,14,12,9,T); r(4,14,3,9,TS);
          r(8,11,5,4,skin); r(8,11,2,4,skinS);
          r(3,0,14,13,skin); r(3,0,3,13,skinS); r(16,4,2,5,skinS);
          r(14,8,2,2,blush);
          r(12,4,3,4,"#fff"); r(12,5,2,3,"#1a1a2e"); r(13,5,1,1,"#fff");
          r(12,10,3,1,skinS);
        }

        // Hair
        const h = hair, hd = hairD;
        if (npc.hairStyle === 0) { // crop
          if (d==="down")  { r(3,-1,14,4,h); r(2,2,3,3,hd); r(15,2,3,3,hd); }
          if (d==="up")    { r(3,-1,14,5,h); }
          if (d==="left")  { r(3,-1,12,4,h); r(3,3,3,3,hd); }
          if (d==="right") { r(5,-1,12,4,h); r(14,3,3,3,hd); }
        } else if (npc.hairStyle === 1) { // fringe
          if (d==="down")  { r(3,-1,14,5,h); r(2,3,4,5,hd); r(14,3,4,5,hd); r(5,4,3,4,h); r(12,4,3,4,h); }
          if (d==="up")    { r(3,-1,14,6,h); r(4,5,12,2,hd); }
          if (d==="left")  { r(3,-1,12,5,h); r(3,3,4,5,hd); r(13,3,3,4,h); }
          if (d==="right") { r(5,-1,12,5,h); r(13,3,4,5,hd); r(4,3,3,4,h); }
        } else if (npc.hairStyle === 2) { // long
          if (d==="down")  { r(3,-1,14,5,h); r(2,3,4,5,hd); r(14,3,4,5,hd); r(3,13,4,8,hd); r(13,13,4,8,hd); }
          if (d==="up")    { r(3,-1,14,6,h); r(4,5,12,2,hd); r(3,7,3,8,h); r(14,7,3,8,h); }
          if (d==="left")  { r(3,-1,12,5,h); r(3,3,4,5,hd); r(13,-1,4,14,h); r(15,3,2,10,hd); }
          if (d==="right") { r(5,-1,12,5,h); r(13,3,4,5,hd); r(3,-1,4,14,h); r(3,3,2,10,hd); }
        } else if (npc.hairStyle === 3) { // curly
          if (d==="down")  { r(1,-2,18,6,h); r(0,2,4,8,hd); r(16,2,4,8,hd); r(2,9,3,4,hd); r(15,9,3,4,hd); r(3,-1,14,5,shade(h,12)); }
          if (d==="up")    { r(1,-2,18,7,h); r(0,2,4,7,hd); r(16,2,4,7,hd); r(3,5,14,3,shade(h,10)); }
          if (d==="left")  { r(1,-2,16,6,h); r(0,2,4,7,hd); r(2,8,3,5,hd); r(3,-1,12,4,shade(h,12)); }
          if (d==="right") { r(3,-2,16,6,h); r(16,2,4,7,hd); r(15,8,3,5,hd); r(5,-1,12,4,shade(h,12)); }
        } else if (npc.hairStyle === 4) { // bun
          if (d==="down"||d==="up") { r(3,-1,14,3,h); r(6,-7,8,7,h); r(7,-8,6,2,hd); r(13,-4,3,3,hd); }
          if (d==="left")  { r(3,-1,12,3,h); r(5,-7,8,7,h); r(10,-8,5,3,hd); }
          if (d==="right") { r(5,-1,12,3,h); r(7,-7,8,7,h); r(7,-8,5,3,hd); }
        } else { // shaved (5)
          if (d==="down"||d==="up") { r(3,-1,14,2,hd); }
          else { r(3,-1,12,2,hd); }
        }

        // Unique per-character accessories
        if (npc.id === "ella") {
          if (d !== "up") { r(7,17,6,7,"rgba(255,255,255,0.5)"); } // apron
        } else if (npc.id === "will") {
          if (d !== "up") { r(4,21,12,2,shade(T,-32)); }           // tool belt
        } else if (npc.id === "rose") {
          r(2,-1,16,7,"rgba(18,4,28,0.75)"); r(0,3,20,5,"rgba(18,4,28,0.5)"); // hood
        } else if (npc.id === "lumi") {
          if (d !== "up") { r(9,18,3,2,"#4ec9b0"); r(8,19,2,2,"#4ec9b0"); } // paint smudge
        } else if (npc.id === "rex") {
          if (d==="down") { r(5,9,10,4,"#888"); r(6,12,8,2,"#777"); }       // beard
          if (d==="left") { r(4,9,6,4,"#888"); }
          if (d==="right") { r(10,9,6,4,"#888"); }
        }

        // Name tag above head when player is nearby (skip for player's own wrapper)
        if (npc.name && Math.hypot(player.x - npc.x, player.y - npc.y) < 80) {
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,0.65)";
          ctx.fillRect(Math.round(x - 22), Math.round(y - 34), 44, 14);
          ctx.fillStyle = "#f0e8c0";
          ctx.font = "bold 9px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(npc.name, Math.round(x), Math.round(y - 23));
          ctx.textAlign = "left";
          ctx.restore();
        }
      }

      function drawWorldMap() {
        const W = canvas.width, H = canvas.height;

        // Dark overlay
        ctx.fillStyle = "rgba(4, 8, 18, 0.92)";
        ctx.fillRect(0, 0, W, H);

        // Choose scale so the map fits with margins
        const ts = Math.max(3, Math.floor(Math.min(W * 0.88, H * 0.82) / MAP_W));
        const mapW = MAP_W * ts, mapH = MAP_H * ts;
        const ox = Math.round((W - mapW) / 2);
        const oy = Math.round((H - mapH) / 2 + 12);

        // Tile colour palette for minimap
        const TC = {
          [TILE.GRASS]:      "#3d6e2a",
          [TILE.DARK_GRASS]: "#2a5018",
          [TILE.PATH]:       "#b8a86a",
          [TILE.STONE]:      "#7a6e5e",
          [TILE.WATER]:      "#3878c0",
          [TILE.TREE]:       "#1e4e14",
          [TILE.ROCK]:       "#5a5a4a",
          [TILE.FLOWERS]:    "#c860a8",
        };

        // Draw every tile
        for (let ty = 0; ty < MAP_H; ty++) {
          for (let tx = 0; tx < MAP_W; tx++) {
            const tile = map[ty][tx];
            ctx.fillStyle = TC[tile] || "#3d6e2a";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
          }
        }

        // Map border
        ctx.strokeStyle = "rgba(200,190,150,0.5)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(ox, oy, mapW, mapH);

        // ── Landmark labels ──────────────────────────────────────
        const labels = [
          { text: "Downtown",       tx: 28, ty:  6 },
          { text: "Park",           tx: 34, ty: 30 },
          { text: "Residential",    tx: 50, ty: 20 },
          { text: "Slums",          tx:  5, ty: 38 },
          { text: "Docks",          tx: 48, ty: 55 },
          { text: "Sweet Dreams 🍬",tx: 58, ty: 51 },
          { text: "🎓 School",      tx: 35, ty: 44 },
        ];
        ctx.font = `bold ${Math.max(7, ts + 2)}px Trebuchet MS, Arial, sans-serif`;
        ctx.textAlign = "center";
        for (const lb of labels) {
          const lx = ox + lb.tx * ts, ly = oy + lb.ty * ts;
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillText(lb.text, lx + 1, ly + 1);
          ctx.fillStyle = "#f0e8c0";
          ctx.fillText(lb.text, lx, ly);
        }

        // ── NPC dots ─────────────────────────────────────────────
        const npcDotSize = Math.max(3, ts - 1);
        for (const npc of npcs) {
          const nx = ox + (npc.x / TILE_SIZE) * ts - npcDotSize / 2;
          const ny = oy + (npc.y / TILE_SIZE) * ts - npcDotSize / 2;
          ctx.fillStyle = npcNameColour(npc.id);
          ctx.fillRect(nx, ny, npcDotSize, npcDotSize);
        }

        // ── Dog dots ─────────────────────────────────────────────
        for (const dog of dogs) {
          const dx = ox + (dog.x / TILE_SIZE) * ts - 2;
          const dy = oy + (dog.y / TILE_SIZE) * ts - 2;
          ctx.fillStyle = dog.coat || "#c07a3a";
          ctx.fillRect(dx, dy, npcDotSize, npcDotSize);
        }

        // ── Player dot ───────────────────────────────────────────
        const px = ox + (player.x / TILE_SIZE) * ts;
        const py = oy + (player.y / TILE_SIZE) * ts;
        // Pulsing ring
        const pulse = 0.55 + 0.45 * Math.sin(game.elapsed * 5);
        ctx.strokeStyle = `rgba(255,240,80,${pulse})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px, py, ts + 1, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#ffe840";
        ctx.beginPath();
        ctx.arc(px, py, Math.max(2, ts - 1), 0, Math.PI * 2);
        ctx.fill();

        // ── Title and hint ───────────────────────────────────────
        ctx.textAlign = "center";
        ctx.font = "bold 18px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#f0e8c0";
        ctx.fillText("🗺  Moonlight City", W / 2, oy - 10);

        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,170,140,0.8)";
        ctx.fillText("Press X or B to close", W / 2, oy + mapH + 16);
        ctx.textAlign = "left";
      }

      function useInventoryItem(idx) {
        const items = game.save && game.save.inventory ? game.save.inventory : [];
        const item = items[idx];
        if (!item) return;
        if (item.hp && item.hp > 0) {
          const healed = Math.min(item.hp === 999 ? player.maxHp : item.hp, player.maxHp - player.hp);
          player.hp = Math.min(player.maxHp, player.hp + (item.hp === 999 ? player.maxHp : item.hp));
          if (game.save) game.save.player.hp = player.hp;
          showNotice(`Used ${item.emoji} ${item.name}! +${healed} HP 💗`, 2);
        }
        if (item.speed && item.speed > 0) {
          player.speedBoost = item.speed;
          showNotice(`Used ${item.emoji} ${item.name}! Speed boost for ${item.speed}s ⚡`, 2);
        }
        items.splice(idx, 1);
        inventory.selected = Math.min(inventory.selected, Math.max(0, items.length - 1));
        if (game.save) { game.save.inventory = items; writeSave(game.save); }
      }

      function drawInventory() {
        const W = canvas.width, H = canvas.height;
        const items = game.save && game.save.inventory ? game.save.inventory : [];

        // (input handled in tick loop)

        // Overlay
        ctx.fillStyle = "rgba(4, 8, 20, 0.88)";
        ctx.fillRect(0, 0, W, H);

        const mw = 360, mh = Math.max(240, 80 + items.length * 52 + 60);
        const mx = Math.round((W - mw) / 2), my = Math.round((H - Math.min(mh, H - 40)) / 2);
        const mhClamped = Math.min(mh, H - 40);

        // Panel
        ctx.fillStyle = "#0e1a2e";
        roundRect(ctx, mx, my, mw, mhClamped, 14);
        ctx.fill();
        ctx.strokeStyle = "#3a7aaa";
        ctx.lineWidth = 2;
        roundRect(ctx, mx, my, mw, mhClamped, 14);
        ctx.stroke();

        // Title
        ctx.textAlign = "center";
        ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#e8f4ff";
        ctx.fillText("🎒  Inventory", mx + mw / 2, my + 28);

        // Gold
        ctx.font = "13px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`⬡ ${getCarriedGold()} gold`, mx + mw / 2, my + 48);

        // Speed boost indicator
        if (player.speedBoost > 0) {
          ctx.fillStyle = "#80ffff";
          ctx.fillText(`⚡ Speed boost: ${Math.ceil(player.speedBoost)}s`, mx + mw / 2, my + 64);
        }

        const listTop = player.speedBoost > 0 ? my + 74 : my + 60;

        if (items.length === 0) {
          ctx.fillStyle = "rgba(140,160,180,0.6)";
          ctx.font = "14px Trebuchet MS, Arial, sans-serif";
          ctx.fillText("Your bag is empty.", mx + mw / 2, listTop + 40);
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "rgba(100,120,140,0.6)";
          ctx.fillText("Buy items at 🍬 Sweet Dreams in the docks!", mx + mw / 2, listTop + 62);
        } else {
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const iy = listTop + i * 52;
            if (iy + 52 > my + mhClamped - 40) break;
            const sel = i === inventory.selected;

            ctx.fillStyle = sel ? "rgba(58,122,200,0.35)" : "rgba(255,255,255,0.04)";
            roundRect(ctx, mx + 12, iy, mw - 24, 46, 8);
            ctx.fill();
            if (sel) {
              ctx.strokeStyle = "#4a9aee";
              ctx.lineWidth = 1.5;
              roundRect(ctx, mx + 12, iy, mw - 24, 46, 8);
              ctx.stroke();
            }

            // Emoji
            ctx.font = "22px serif";
            ctx.textAlign = "left";
            ctx.fillStyle = "#fff";
            ctx.fillText(item.emoji, mx + 22, iy + 31);

            // Name
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = "#e8f4ff";
            ctx.fillText(item.name, mx + 54, iy + 19);

            // Effect desc
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = "#8ab8d8";
            const desc = item.hp === 999 ? "Fully restores HP"
                       : item.hp > 0 ? `Restores ${item.hp} HP`
                       : item.speed > 0 ? `Speed boost for ${item.speed}s`
                       : "?";
            ctx.fillText(desc, mx + 54, iy + 35);

            // Use badge on selected
            if (sel) {
              ctx.textAlign = "right";
              ctx.font = "bold 11px Trebuchet MS, Arial, sans-serif";
              ctx.fillStyle = "#4aeeaa";
              ctx.fillText("E — Use", mx + mw - 18, iy + 26);
            }
          }
        }

        // Hint
        ctx.textAlign = "center";
        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(140,160,180,0.7)";
        ctx.fillText("↑↓ navigate  •  E to use  •  I or Esc to close", mx + mw / 2, my + mhClamped - 14);
        ctx.textAlign = "left";
      }

      function drawFade() {
        if (game.fadeAlpha < 0) {
          ctx.fillStyle = `rgba(0,0,0,${Math.min(1, -game.fadeAlpha)})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      function drawWorld(time, view) {
        const startX = clamp(Math.floor(camera.x / TILE_SIZE) - 2, 0, MAP_W - 1);
        const startY = clamp(Math.floor(camera.y / TILE_SIZE) - 2, 0, MAP_H - 1);
        const endX = clamp(Math.ceil((camera.x + view.worldW) / TILE_SIZE) + 2, 0, MAP_W - 1);
        const endY = clamp(Math.ceil((camera.y + view.worldH) / TILE_SIZE) + 2, 0, MAP_H - 1);

        for (let y = startY; y <= endY; y++) {
          for (let x = startX; x <= endX; x++) {
            drawGroundTile(map[y][x], x, y, time);
          }
        }

        const lateObstacles = [];
        for (let y = startY; y <= endY; y++) {
          for (let x = startX; x <= endX; x++) {
            const tile = map[y][x];
            if (tile !== TILE.TREE && tile !== TILE.ROCK) continue;
            const baseY = y * TILE_SIZE + (tile === TILE.TREE ? 28 : 24);
            if (baseY <= player.y + 4) {
              drawObstacle(tile, x, y, time);
            } else {
              lateObstacles.push([tile, x, y]);
            }
          }
        }

        // Draw all characters (player + NPCs) sorted by Y so taller-Y sprites appear in front
        const chars = [{ isPlayer: true, y: player.y }];
        for (const npc of npcs) chars.push({ isPlayer: false, isDog: false, y: npc.y, npc });
        for (const dog of dogs) chars.push({ isPlayer: false, isDog: true, y: dog.y, dog });
        chars.sort((a, b) => a.y - b.y);

        for (const c of chars) {
          if (c.isPlayer) drawPlayer(time);
          else if (c.isDog) drawDogSprite(time, c.dog);
          else drawNpcSprite(time, c.npc);
        }

        for (const [tile, x, y] of lateObstacles) {
          drawObstacle(tile, x, y, time);
        }
      }

      function drawCityHUD(save) {
        ctx.save();
        const day = save ? save.time.currentDay : 1;
        const name = save ? save.player.name : "";

        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(14, 12, 178, 36);
        ctx.fillRect(canvas.width - 140, 12, 126, 36);

        ctx.fillStyle = "#f3f7e8";
        ctx.font = "bold 22px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Moonlight City", 24, 37);

        ctx.font = "bold 18px Trebuchet MS, Arial, sans-serif";
        const dayText = name ? `${name}  ·  Day ${day}` : `Day ${day}`;
        const dayWidth = ctx.measureText(dayText).width;
        ctx.fillText(dayText, canvas.width - 26 - dayWidth, 37);

        // Inventory + gold badge
        const inv = save && save.inventory ? save.inventory : [];
        const invText = `🎒 ${inv.length}  ⬡ ${getCarriedGold()}`;
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        const badgeW = ctx.measureText(invText).width + 20;
        ctx.fillRect(14, 54, badgeW, 24);
        ctx.fillStyle = inv.length > 0 ? "#e8f4ff" : "#607080";
        ctx.font = "12px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(invText, 24, 70);
        // Speed boost indicator on HUD
        if (player.speedBoost > 0) {
          ctx.fillStyle = "rgba(0,0,0,0.28)";
          ctx.fillRect(14, 82, 120, 20);
          ctx.fillStyle = "#80ffff";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(`⚡ Speed boost: ${Math.ceil(player.speedBoost)}s`, 20, 96);
        }

        ctx.restore();
      }

      function drawNotice() {
        if (!game.noticeText || game.noticeTimer <= 0) return;
        ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
        const textW = Math.max(220, ctx.measureText(game.noticeText).width + 36);
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(canvas.width / 2 - textW / 2, 16, textW, 30);
        ctx.fillStyle = "#f0e8c8";
        ctx.textAlign = "center";
        ctx.fillText(game.noticeText, canvas.width / 2, 37);
        ctx.textAlign = "left";
      }

      function drawDungeon(time) {
        if (!dungeon.data) return;

        const data = dungeon.data;
        const dungeonW = data.w * DTILE_SIZE;
        const dungeonH = data.h * DTILE_SIZE;
        const offX = dungeonW < canvas.width ? Math.floor((canvas.width - dungeonW) / 2) : -camera.x;
        const offY = dungeonH < canvas.height ? Math.floor((canvas.height - dungeonH) / 2) : -camera.y;

        ctx.fillStyle = "#080a10";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const startTX = Math.max(0, Math.floor((camera.x || 0) / DTILE_SIZE) - 1);
        const startTY = Math.max(0, Math.floor((camera.y || 0) / DTILE_SIZE) - 1);
        const endTX = Math.min(data.w - 1, Math.ceil(((camera.x || 0) + canvas.width) / DTILE_SIZE) + 1);
        const endTY = Math.min(data.h - 1, Math.ceil(((camera.y || 0) + canvas.height) / DTILE_SIZE) + 1);

        for (let ty = startTY; ty <= endTY; ty++) {
          for (let tx = startTX; tx <= endTX; tx++) {
            const t = dungeon.tiles[ty * data.w + tx];
            const px = tx * DTILE_SIZE + offX;
            const py = ty * DTILE_SIZE + offY;
            const floorColor = (tx + ty) % 2 === 0 ? DUNGEON_COLORS.floor : DUNGEON_COLORS.floorHi;

            if (t === DTILE.WALL) {
              ctx.fillStyle = DUNGEON_COLORS.wall;
              ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);
              ctx.fillStyle = DUNGEON_COLORS.wallHi;
              ctx.fillRect(px + 2, py + 2, DTILE_SIZE - 4, 4);
              if ((tx * 7 + ty * 13) % 5 === 0) {
                ctx.fillStyle = DUNGEON_COLORS.wallMoss;
                ctx.fillRect(px + 4, py + DTILE_SIZE - 7, DTILE_SIZE - 8, 5);
              }
              continue;
            }

            ctx.fillStyle = floorColor;
            ctx.fillRect(px, py, DTILE_SIZE, DTILE_SIZE);

            if (t === DTILE.STAIRS_LOCKED || t === DTILE.STAIRS_UNLOCKED) {
              ctx.fillStyle = t === DTILE.STAIRS_UNLOCKED ? DUNGEON_COLORS.stairsUnlocked : DUNGEON_COLORS.stairs;
              ctx.fillRect(px + 4, py + 4, DTILE_SIZE - 8, DTILE_SIZE - 8);
              for (let s = 0; s < 4; s++) {
                ctx.fillStyle = t === DTILE.STAIRS_UNLOCKED ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.25)";
                ctx.fillRect(px + 6 + s * 4, py + 8 + s * 4, DTILE_SIZE - 12 - s * 8, 3);
              }
            } else if (t === DTILE.SLIME_PUDDLE) {
              ctx.fillStyle = DUNGEON_COLORS.slime;
              ctx.beginPath();
              ctx.ellipse(px + DTILE_SIZE / 2, py + DTILE_SIZE / 2, DTILE_SIZE / 2 - 4, DTILE_SIZE / 2 - 6, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = DUNGEON_COLORS.slimeHi;
              ctx.beginPath();
              ctx.ellipse(px + DTILE_SIZE / 2 - 4, py + DTILE_SIZE / 2 - 4, 5, 4, -0.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (t === DTILE.BARREL) {
              ctx.fillStyle = DUNGEON_COLORS.barrel;
              ctx.fillRect(px + 6, py + 5, DTILE_SIZE - 12, DTILE_SIZE - 10);
              ctx.fillStyle = shade(DUNGEON_COLORS.barrel, -32);
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, 3);
              ctx.fillRect(px + 5, py + DTILE_SIZE - 13, DTILE_SIZE - 10, 3);
            } else if (t === DTILE.CHEST) {
              ctx.fillStyle = DUNGEON_COLORS.chest;
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, DTILE_SIZE - 16);
              ctx.fillStyle = shade(DUNGEON_COLORS.chest, -20);
              ctx.fillRect(px + 5, py + 8, DTILE_SIZE - 10, 4);
              ctx.fillStyle = "#ffd700";
              ctx.fillRect(px + DTILE_SIZE / 2 - 2, py + DTILE_SIZE / 2 - 1, 4, 4);
            }
          }
        }

        dungeon.enemies.forEach(en => {
          if (!en.alive) return;
          const ex = en.x + offX;
          const ey = en.y + offY;
          const stats = en.stats;

          ctx.fillStyle = "rgba(0,0,0,0.3)";
          ctx.beginPath();
          ctx.ellipse(ex, ey + stats.size - 2, stats.size - 1, 3, 0, 0, Math.PI * 2);
          ctx.fill();

          if (en.type === "small_slime") {
            const wobble = Math.sin(time * 3 + en.id) * 1.5;
            ctx.fillStyle = en.hitFlash > 0 ? "#ffffff" : stats.color;
            ctx.beginPath();
            ctx.ellipse(ex, ey, stats.size + wobble, stats.size - wobble * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillRect(ex - 4, ey - 3, 3, 3);
            ctx.fillRect(ex + 2, ey - 3, 3, 3);
            ctx.fillStyle = "#222";
            ctx.fillRect(ex - 3, ey - 2, 2, 2);
            ctx.fillRect(ex + 3, ey - 2, 2, 2);
          } else {
            ctx.fillStyle = en.hitFlash > 0 ? "#ffffff" : stats.color;
            ctx.fillRect(ex - stats.size, ey - stats.size + 2, stats.size * 2, stats.size);
            ctx.fillRect(ex - stats.size + 2, ey - stats.size - 2, stats.size - 2, stats.size);
            ctx.fillRect(ex - stats.size + 4, ey - stats.size - 5, 4, 4);
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(ex - stats.size + 4, ey - stats.size, 2, 2);
            ctx.strokeStyle = en.hitFlash > 0 ? "#ffffff" : shade(stats.color, -32);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(ex + stats.size, ey);
            ctx.quadraticCurveTo(ex + stats.size + 6, ey - 4, ex + stats.size + 4, ey - 8);
            ctx.stroke();
          }

          const barW = 24;
          const barH = 3;
          const bx = ex - barW / 2;
          const by = ey - stats.size - 10;
          ctx.fillStyle = "#400";
          ctx.fillRect(bx, by, barW, barH);
          ctx.fillStyle = en.hp / en.maxHp > 0.5 ? "#4c4" : en.hp / en.maxHp > 0.25 ? "#cc4" : "#c44";
          ctx.fillRect(bx, by, barW * (en.hp / en.maxHp), barH);
        });

        const prevX = player.x;
        const prevY = player.y;
        player.x += offX;
        player.y += offY;
        drawPlayerSprite(time, player);
        player.x = prevX;
        player.y = prevY;

        dungeon.dmgNumbers.forEach(d => {
          const alpha = 1 - d.age / 1.2;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = d.color;
          ctx.font = "bold 14px Arial";
          ctx.textAlign = "center";
          ctx.fillText(d.val, d.x + offX, d.y + offY - d.age * 20);
          ctx.globalAlpha = 1;
        });

        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(8, 8, 174, 40);
        ctx.fillStyle = "#c22";
        ctx.fillRect(12, 14, 100, 10);
        ctx.fillStyle = "#e55";
        ctx.fillRect(12, 14, 100 * (player.hp / player.maxHp), 10);
        ctx.fillStyle = "#fff";
        ctx.font = "11px Arial";
        ctx.textAlign = "left";
        ctx.fillText(`HP ${player.hp} / ${player.maxHp}`, 12, 36);
        ctx.fillStyle = "#ffd700";
        ctx.fillText(`⬡ ${getCarriedGold()}`, 90, 36);
        ctx.fillStyle = "#aaa";
        ctx.textAlign = "right";
        ctx.fillText(`Floor ${dungeon.floor}`, canvas.width - 12, 26);

        if (player.attackCooldown <= 0) {
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(canvas.width / 2 - 110, canvas.height - 36, 220, 24);
          ctx.fillStyle = "#ccc";
          ctx.font = "12px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Z / Space — Attack   E — Interact", canvas.width / 2, canvas.height - 20);
        }

        const sp = dungeon.data.stairsPos;
        const stairPx = sp.x * DTILE_SIZE + offX + DTILE_SIZE / 2;
        const stairPy = sp.y * DTILE_SIZE + offY;
        if (dungeon.stairsUnlocked) {
          ctx.fillStyle = "#8a6ad0";
          ctx.font = "bold 11px Arial";
          ctx.textAlign = "center";
          ctx.fillText("E — Descend", stairPx, stairPy - 8);
        } else {
          const remaining = dungeon.enemies.filter(e => e.alive).length;
          if (remaining > 0) {
            ctx.fillStyle = "#cc8844";
            ctx.font = "11px Arial";
            ctx.textAlign = "center";
            ctx.fillText(`${remaining} enemy${remaining > 1 ? "s" : ""} remain`, canvas.width / 2, canvas.height / 2 - 60);
          }
        }

        // Up-stairs hint (Backspace near spawn/up-stairs pos)
        if (dungeon.data) {
          const upP = dungeon.data.upStairsPos || dungeon.data.playerSpawn;
          const upPx = upP.x * DTILE_SIZE + offX + DTILE_SIZE / 2;
          const upPy = upP.y * DTILE_SIZE + offY;
          const distUp = Math.hypot(player.x - (upP.x * DTILE_SIZE + DTILE_SIZE / 2), player.y - (upP.y * DTILE_SIZE + DTILE_SIZE / 2));
          if (distUp < 48) {
            ctx.fillStyle = "#88aacc";
            ctx.font = "bold 11px Arial";
            ctx.textAlign = "center";
            ctx.fillText(dungeon.floor > 1 ? "Bksp — Go up" : "Bksp — Exit sewer", upPx, upPy - 8);
          }
        }

        drawNotice();
        ctx.textAlign = "left";
      }
