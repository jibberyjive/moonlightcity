      // ---- TITLE SCENE ---------------------------------

      const titleState = { selected: 0 }; // 0 = New Game, 1 = Continue

      function updateTitle() {
        if (justPressedKeys.up)   titleState.selected = 0;
        if (justPressedKeys.down) titleState.selected = 1;
        if (justPressedKeys.confirm || mouse.clicked) {
          const hasSave = !!loadSave();
          if (titleState.selected === 0) {
            // New game — wipe save and go to character creation
            game.save = createNewSave();
            switchScene(SCENE.CHARACTER_CREATION);
          } else if (hasSave) {
            game.save = loadSave();
            player = createPlayer(game.save);
            switchScene(SCENE.CITY);
          }
        }
      }

      function drawTitle(time) {
        const w = canvas.width, h = canvas.height;

        // Animated starfield background
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 120; i++) {
          const sx = noise(i, 0, 1) * w;
          const sy = noise(i, 0, 2) * h;
          const bright = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.8 + i));
          ctx.fillStyle = `rgba(220,230,255,${bright.toFixed(2)})`;
          const sr = noise(i, 0, 3) < 0.15 ? 2 : 1;
          ctx.fillRect(sx, sy, sr, sr);
        }

        // Moon
        ctx.fillStyle = "#f0e8c8";
        ctx.beginPath();
        ctx.arc(w * 0.72, h * 0.22, 54, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#d8d0a8";
        ctx.beginPath();
        ctx.arc(w * 0.72 + 18, h * 0.22 - 14, 44, 0, Math.PI * 2);
        ctx.fill();

        // City skyline silhouette
        ctx.fillStyle = "#111922";
        const bldgs = [
          [0, 0.68, 0.10, 0.32],
          [0.08, 0.55, 0.07, 0.45],
          [0.14, 0.62, 0.10, 0.38],
          [0.23, 0.50, 0.06, 0.50],
          [0.28, 0.58, 0.09, 0.42],
          [0.36, 0.44, 0.07, 0.56],
          [0.42, 0.60, 0.10, 0.40],
          [0.51, 0.52, 0.08, 0.48],
          [0.58, 0.65, 0.11, 0.35],
          [0.68, 0.48, 0.07, 0.52],
          [0.74, 0.57, 0.09, 0.43],
          [0.82, 0.64, 0.10, 0.36],
          [0.91, 0.54, 0.09, 0.46]
        ];
        for (const [bx, by, bw, bh] of bldgs) {
          ctx.fillRect(bx * w, by * h, bw * w, bh * h);
        }
        ctx.fillRect(0, h * 0.82, w, h * 0.18);

        // Title text
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.font = "bold 56px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Moonlight City", w / 2 + 3, h * 0.36 + 3);
        ctx.fillStyle = "#f0e8c8";
        ctx.fillText("Moonlight City", w / 2, h * 0.36);
        ctx.font = "22px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "#b8c8d8";
        ctx.fillText("Go down scary.  Come back rich.  Make home warmer.", w / 2, h * 0.44);

        // Menu buttons
        const hasSave = !!loadSave();
        const buttons = [
          { label: "✨ New Game", y: h * 0.58 },
          { label: hasSave ? "▶ Continue" : "— No save —", y: h * 0.58 + 58, disabled: !hasSave }
        ];
        buttons.forEach((btn, i) => {
          const selected = titleState.selected === i;
          const alpha = btn.disabled ? 0.35 : 1;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = selected ? "rgba(240,232,200,0.18)" : "rgba(0,0,0,0.25)";
          ctx.fillRect(w / 2 - 140, btn.y - 30, 280, 46);
          if (selected) {
            ctx.strokeStyle = "#f0e8c8";
            ctx.lineWidth = 2;
            ctx.strokeRect(w / 2 - 140, btn.y - 30, 280, 46);
          }
          ctx.fillStyle = selected ? "#f0e8c8" : "#8899aa";
          ctx.font = selected ? "bold 24px Trebuchet MS, Arial, sans-serif" : "22px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(btn.label, w / 2, btn.y + 4);
          ctx.globalAlpha = 1;
        });

        // Hint
        ctx.font = "16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,190,200,0.6)";
        ctx.fillText("↑↓ to select  ·  Enter to confirm", w / 2, h * 0.88);
        ctx.textAlign = "left";
      }

      // ---- CHARACTER CREATION SCENE -------------------

      const cc = {
        name: "Hero",
        skin: 0,
        hairStyle: 0,
        hairColour: 0,
        outfit: 0,
        ageType: "adult",
        classId: "adventurer",
        field: "skin",
        nameEditing: false,
        typedName: "Hero"
      };

      const CC_FIELDS = ["name", "skin", "hairColour", "hairStyle", "outfit", "age", "done"];

      function updateCharacterCreation() {
        // Navigate fields with left/right
        if (justPressedKeys.left) {
          const idx = CC_FIELDS.indexOf(cc.field);
          if (idx > 0) cc.field = CC_FIELDS[idx - 1];
        }
        if (justPressedKeys.right) {
          const idx = CC_FIELDS.indexOf(cc.field);
          if (idx < CC_FIELDS.length - 1) cc.field = CC_FIELDS[idx + 1];
        }

        // Cycle options with up/down
        if (justPressedKeys.up || justPressedKeys.down) {
          const dir = justPressedKeys.up ? -1 : 1;
          if (cc.field === "skin")       cc.skin       = (cc.skin       + dir + SKIN_TONES.length)    % SKIN_TONES.length;
          if (cc.field === "hairColour") cc.hairColour = (cc.hairColour + dir + HAIR_COLORS.length)   % HAIR_COLORS.length;
          if (cc.field === "outfit")     cc.outfit     = (cc.outfit     + dir + OUTFIT_COLORS.length) % OUTFIT_COLORS.length;
          if (cc.field === "hairStyle")  cc.hairStyle  = (cc.hairStyle  + dir + HAIR_STYLE_COUNT)     % HAIR_STYLE_COUNT;
          if (cc.field === "age") {
            const ages = ["adult", "toddler", "child"];
            const i = ages.indexOf(cc.ageType);
            cc.ageType = ages[(i + dir + ages.length) % ages.length];
          }
        }

        // Confirm / done
        if ((justPressedKeys.confirm || mouse.clicked) && cc.field === "done") {
          // Commit to save and go to city
          game.save.player.name       = cc.name;
          game.save.player.skin       = cc.skin;
          game.save.player.hairStyle  = cc.hairStyle;
          game.save.player.hairColour = cc.hairColour;
          game.save.player.outfit     = cc.outfit;
          game.save.player.classId    = cc.classId;
          game.save.player.ageType    = cc.ageType;
          // Assign a house based on character name — same name always gets same house
          const _ns = cc.name.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
          game.save.player.houseNum = (_ns % 6) + 1;
          writeSave(game.save);
          player = createPlayer(game.save);
          switchScene(SCENE.CITY);
        }
      }

      window.addEventListener("keypress", (e) => {
        if (game.scene !== SCENE.CHARACTER_CREATION) return;
        if (cc.field !== "name") return;
        if (e.key === "Enter") { cc.name = cc.typedName || "Hero"; return; }
        if (e.key.length === 1 && cc.typedName.length < 14) {
          cc.typedName += e.key;
          cc.name = cc.typedName;
        }
      });
      window.addEventListener("keydown", (e) => {
        if (game.scene !== SCENE.CHARACTER_CREATION) return;
        if (cc.field !== "name") return;
        if (e.code === "Backspace" && cc.typedName.length > 0) {
          cc.typedName = cc.typedName.slice(0, -1);
          cc.name = cc.typedName || "Hero";
        }
      }, { capture: true });

      function drawCharacterCreation(time) {
        const w = canvas.width, h = canvas.height;

        // Background
        ctx.fillStyle = "#1a1028";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(240,232,200,0.04)";
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(0, (h / 5) * i, w, 1);
        }

        // Title
        ctx.textAlign = "center";
        ctx.fillStyle = "#f0e8c8";
        ctx.font = "bold 32px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("Create Your Character", w / 2, 52);

        // Preview character (centre screen, larger)
        const previewP = {
          x: w / 2, y: h * 0.45,
          vx: 0, vy: 0,
          radius: 9, speed: 0, accel: 0,
          dir: "down", walkTime: time * 2,
          skin: cc.skin, hairStyle: cc.hairStyle,
          hairColour: cc.hairColour, outfit: cc.outfit,
          ageType: cc.ageType
        };
        ctx.save();
        ctx.scale(3, 3);
        ctx.translate(-(w / 2) * (2 / 3), -(h * 0.45) * (2 / 3));
        drawPlayerSprite(time, previewP);
        ctx.restore();

        // Option panels (7 columns, narrower)
        const pw = 110; // panel half-width
        const panels = [
          { key: "name",       label: "Name",        value: cc.name,                                        x: w * 0.08 },
          { key: "skin",       label: "Skin",         value: `${cc.skin + 1}/${SKIN_TONES.length}`,         x: w * 0.22 },
          { key: "hairColour", label: "Hair Col",     value: `${cc.hairColour + 1}/${HAIR_COLORS.length}`,  x: w * 0.36 },
          { key: "hairStyle",  label: "Hair Style",   value: HAIR_STYLE_NAMES[cc.hairStyle],                x: w * 0.50 },
          { key: "outfit",     label: "Outfit",       value: `${cc.outfit + 1}/${OUTFIT_COLORS.length}`,    x: w * 0.64 },
          { key: "age",        label: "Age",          value: cc.ageType === "toddler" ? "🧒 Toddler" : cc.ageType === "child" ? "🎒 Child" : "🧑 Adult", x: w * 0.78 },
          { key: "done",       label: "▶ Play!",      value: "",                                            x: w * 0.92 }
        ];

        const panelY = h * 0.72;
        panels.forEach(p => {
          const sel = cc.field === p.key;
          ctx.fillStyle = sel ? "rgba(240,232,200,0.18)" : "rgba(0,0,0,0.35)";
          ctx.fillRect(p.x - pw/2, panelY - 40, pw, 80);
          if (sel) {
            ctx.strokeStyle = "#f0e8c8";
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x - pw/2, panelY - 40, pw, 80);
          }
          ctx.fillStyle = sel ? "#f0e8c8" : "#889aaa";
          ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(p.label, p.x, panelY - 14);
          ctx.font = sel ? "bold 20px Trebuchet MS, Arial, sans-serif" : "18px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = sel ? "#ffe090" : "#c0c8d0";
          if (p.key === "skin") {
            ctx.fillStyle = SKIN_TONES[cc.skin];
            ctx.fillRect(p.x - 12, panelY + 6, 24, 16);
          } else if (p.key === "hairColour") {
            ctx.fillStyle = HAIR_COLORS[cc.hairColour];
            ctx.fillRect(p.x - 12, panelY + 6, 24, 16);
          } else if (p.key === "outfit") {
            ctx.fillStyle = OUTFIT_COLORS[cc.outfit].torso;
            ctx.fillRect(p.x - 14, panelY + 6, 13, 16);
            ctx.fillStyle = OUTFIT_COLORS[cc.outfit].legs;
            ctx.fillRect(p.x + 1,  panelY + 6, 13, 16);
          } else {
            ctx.fillStyle = sel ? "#ffe090" : "#c0c8d0";
            ctx.font = sel ? "bold 14px Trebuchet MS, Arial, sans-serif" : "13px Trebuchet MS, Arial, sans-serif";
            ctx.fillText(p.value + (p.key === "name" && sel ? "▌" : ""), p.x, panelY + 22);
          }
        });

        // Hint
        ctx.font = "16px Trebuchet MS, Arial, sans-serif";
        ctx.fillStyle = "rgba(180,190,200,0.6)";
        ctx.fillText("← → choose  ·  ↑ ↓ change  ·  Enter confirm  ·  Type name when Name is selected", w / 2, h * 0.92);
        ctx.textAlign = "left";
      }

      // ---- CITY SCENE (wraps existing world code) ------

      function updateCity(dt) {
        // ── World map open — freeze world ───────────────────────────────────
        if (worldMapOpen || inventory.open) return;
        // ── Dialogue mode — freeze world, handle input ──────────────────────
        if (dialogue.active) {
          if (justPressedKeys.interact || justPressedKeys.attack || justPressedKeys.confirm || justPressedKeys.pause) {
            advanceDialogue();
          }
          // still update camera smoothly while chatting
          const view = getView();
          camera.x += (clamp(player.x - view.worldW / 2, 0, Math.max(0, WORLD_W - view.worldW)) - camera.x) * Math.min(1, dt * 6);
          camera.y += (clamp(player.y - view.worldH / 2, 0, Math.max(0, WORLD_H - view.worldH)) - camera.y) * Math.min(1, dt * 6);
          return;
        }

        if (justPressedKeys.pause) { /* pause not yet implemented */ }
        movePlayer(dt);
        updateNpcs(dt);
        updateDogs(dt);

        const view = getView();
        const targetX = clamp(player.x - view.worldW / 2, 0, Math.max(0, WORLD_W - view.worldW));
        const targetY = clamp(player.y - view.worldH / 2, 0, Math.max(0, WORLD_H - view.worldH));
        camera.x += (targetX - camera.x) * Math.min(1, dt * 6);
        camera.y += (targetY - camera.y) * Math.min(1, dt * 6);
        camera.x = clamp(camera.x, 0, Math.max(0, WORLD_W - view.worldW));
        camera.y = clamp(camera.y, 0, Math.max(0, WORLD_H - view.worldH));

        // Tick city time (1 real second = 1 in-game minute, 24 min = 1 full day)
        if (game.save) {
          game.save.time.currentMinute += dt * (60 / 24);
          if (game.save.time.currentMinute >= 60) {
            game.save.time.currentMinute -= 60;
            game.save.time.currentHour   += 1;
            if (game.save.time.currentHour >= 24) {
              game.save.time.currentHour = 0;
              game.save.time.currentDay += 1;
            }
          }
        }

        if (Math.hypot(player.x - SEWER_ENTRANCE.x, player.y - SEWER_ENTRANCE.y) < 40 && (justPressedKeys.interact || justPressedKeys.attack)) {
          enterDungeon(1);
        }

        // Check candy store door (tile 58,53 → player stands one tile south)
        const _candyDoorX = 58 * 32 + 16, _candyDoorY = 54 * 32 + 16;
        if (Math.hypot(player.x - _candyDoorX, player.y - _candyDoorY) < 52 && justPressedKeys.interact) {
          enterCandyStore();
          return;
        }

        const _schoolDoorX = 35 * 32 + 16, _schoolDoorY = 49 * 32 + 16;
        if (Math.hypot(player.x - _schoolDoorX, player.y - _schoolDoorY) < 52 && justPressedKeys.interact) {
          enterSchool();
          return;
        }

        // Check player's own house door
        const _hn = game.save && game.save.player ? (game.save.player.houseNum || 0) : 0;
        if (_hn > 0) {
          const _door = HOUSE_DOORS[_hn];
          if (_door && Math.hypot(player.x - _door.px, player.y - _door.py) < 60 && justPressedKeys.interact) {
            enterHouse();
            return;
          }
        }

        // Check NPC interaction (talk)
        if (justPressedKeys.interact) {
          let nearest = null, nearestDist = Infinity;
          for (const npc of npcs) {
            const d = Math.hypot(player.x - npc.x, player.y - npc.y);
            if (d < 52 && d < nearestDist) { nearest = npc; nearestDist = d; }
          }
          if (nearest) openDialogue(nearest);
        }
      }

      function drawCity(time) {
        const view = getView();
        ctx.save();
        ctx.scale(view.zoom, view.zoom);
        ctx.translate(-camera.x + shake.x, -camera.y + shake.y);
        drawWorld(time, view);
        ctx.restore();
        drawCityHUD(game.save);
        if (!dialogue.active && Math.hypot(player.x - SEWER_ENTRANCE.x, player.y - SEWER_ENTRANCE.y) < 60) {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(canvas.width / 2 - 112, canvas.height - 42, 224, 24);
          ctx.fillStyle = "#d8ddd0";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E or Space to enter sewer", canvas.width / 2, canvas.height - 25);
          ctx.textAlign = "left";
        }

        // NPC talk prompt
        if (!dialogue.active) {
          for (const npc of npcs) {
            const dist = Math.hypot(player.x - npc.x, player.y - npc.y);
            if (dist < 52) {
              ctx.fillStyle = "rgba(0,0,0,0.55)";
              ctx.fillRect(canvas.width / 2 - 110, canvas.height - 42, 220, 24);
              ctx.fillStyle = npcNameColour(npc.id);
              ctx.font = "bold 12px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText(`Press E to talk to ${npc.name}`, canvas.width / 2, canvas.height - 25);
              ctx.textAlign = "left";
              break;
            }
          }
        }

        // Player's house door — name label above it + enter prompt when nearby
        const _hNum = game.save && game.save.player ? (game.save.player.houseNum || 0) : 0;
        if (_hNum > 0) {
          const _hDoor = HOUSE_DOORS[_hNum];
          if (_hDoor) {
            const view2 = getView();
            const doorSX = (_hDoor.px - camera.x) * view2.zoom;
            const doorSY = (_hDoor.py - camera.y) * view2.zoom;
            // Always show name above house (within a generous range so it's findable)
            const distToDoor = Math.hypot(player.x - _hDoor.px, player.y - _hDoor.py);
            if (distToDoor < 200) {
              ctx.fillStyle = "rgba(0,0,0,0.7)";
              ctx.fillRect(doorSX - 68, doorSY - 54, 136, 20);
              ctx.fillStyle = "#f0e0a0";
              ctx.font = "bold 12px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText(`🏠 ${game.save.player.name}'s Home`, doorSX, doorSY - 39);
              ctx.textAlign = "left";
            }
            if (distToDoor < 60) {
              ctx.fillStyle = "rgba(0,0,0,0.55)";
              ctx.fillRect(canvas.width / 2 - 100, canvas.height - 42, 200, 24);
              ctx.fillStyle = "#d8ddd0";
              ctx.font = "12px Trebuchet MS, Arial, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("Press E to enter your home", canvas.width / 2, canvas.height - 25);
              ctx.textAlign = "left";
            }
          }
        }
        drawNotice();
        if (dialogue.active) drawDialogueBox(time);
      }

      function drawDialogueBox(time) {
        const npc  = dialogue.npc;
        const line = (npc.lines || [])[dialogue.lineIndex] || "";
        const isLast = dialogue.lineIndex >= (npc.lines || []).length - 1;

        const W = canvas.width, H = canvas.height;
        const boxH  = 130;
        const boxY  = H - boxH - 10;
        const pad   = 16;
        const portSize = 88;

        // Box background
        ctx.fillStyle = "rgba(10, 14, 22, 0.93)";
        roundRect(ctx, 10, boxY, W - 20, boxH, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(200,200,160,0.35)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, 10, boxY, W - 20, boxH, 10);
        ctx.stroke();

        // NPC portrait panel
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        roundRect(ctx, 22, boxY + 10, portSize, portSize, 6);
        ctx.fill();

        // Draw NPC mini-sprite scaled up inside portrait
        ctx.save();
        const portCX = 22 + portSize / 2;
        const portCY = boxY + 10 + portSize / 2 + 8;
        ctx.scale(2.6, 2.6);
        drawNpcSprite(0, {
          ...npc,
          x: portCX / 2.6, y: portCY / 2.6,
          vx: 0, vy: 0, dir: "down",
          walkTime: 0, homeX: portCX / 2.6
        });
        ctx.restore();

        // NPC name tag
        ctx.fillStyle = npcNameColour(npc.id);
        ctx.font = "bold 15px Trebuchet MS, Arial, sans-serif";
        ctx.fillText(npc.name, 22 + portSize + pad, boxY + 26);

        // Divider under name
        ctx.fillStyle = "rgba(200,200,160,0.25)";
        ctx.fillRect(22 + portSize + pad, boxY + 30, W - 80 - portSize, 1);

        // Dialogue text with word wrap
        ctx.fillStyle = "#f0ede4";
        ctx.font = "14px Trebuchet MS, Arial, sans-serif";
        const maxW  = W - 80 - portSize - pad * 2;
        const textX = 22 + portSize + pad;
        const textY = boxY + 52;
        wrapText(ctx, line, textX, textY, maxW, 22);

        // Advance hint
        const hint = isLast ? "Press E to close  ✕" : "Press E to continue  ▼";
        ctx.fillStyle = "rgba(200,200,140,0.7)";
        ctx.font = "11px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(hint, W - 22, boxY + boxH - 10);
        ctx.textAlign = "left";
      }

      function npcNameColour(id) {
        return { ella:"#f5c870", will:"#7ab8f5", pipper:"#f57a3a", rose:"#c47af5", lumi:"#b8f0e0", rex:"#d48a58" }[id] || "#f0ede4";
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let cy = y;
        for (const word of words) {
          const test = line ? line + " " + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, cy);
            line = word;
            cy += lineHeight;
          } else {
            line = test;
          }
        }
        if (line) ctx.fillText(line, x, cy);
      }

      function updateDungeonScene(dt) {
        updateDungeon(dt);
      }

      function drawDungeonScene(time) {
        drawDungeon(time);
      }

      function updateHouseInterior(dt) {
        const ts = 36, roomW = 11, roomH = 8, r = player.radius;

        // Faster indoor movement — direct pixel/s, no acceleration
        const spd = 140;
        let dx = 0, dy = 0;
        if (keys.left)  dx -= spd * dt;
        if (keys.right) dx += spd * dt;
        if (keys.up)    dy -= spd * dt;
        if (keys.down)  dy += spd * dt;

        if (dx !== 0 || dy !== 0) {
          player.x = clamp(player.x + dx, ts + r, (roomW - 1) * ts - r);
          player.y = clamp(player.y + dy, ts + r, (roomH - 1) * ts - r);
          player.walkTime += dt * 9;
          if (Math.abs(dx) >= Math.abs(dy))
            player.dir = dx > 0 ? "right" : "left";
          else
            player.dir = dy > 0 ? "down" : "up";
        }

        if (justPressedKeys.pause) { candyShop.open = false; exitHouse(); return; }

        // ── Candy shop mode ────────────────────────────────────────
        if (game.inCandyStore) {
          if (candyShop.open) {
            if (justPressedKeys.up)   candyShop.selected = (candyShop.selected - 1 + CANDY_ITEMS.length) % CANDY_ITEMS.length;
            if (justPressedKeys.down) candyShop.selected = (candyShop.selected + 1) % CANDY_ITEMS.length;
            if (justPressedKeys.pause || justPressedKeys.back) { candyShop.open = false; return; }
            if (justPressedKeys.interact || justPressedKeys.confirm) {
              const item = CANDY_ITEMS[candyShop.selected];
              const gold = getCarriedGold();
              if (gold < item.price) {
                showNotice(`Not enough gold! Need ${item.price} ⬡`, 1.5);
              } else {
                setCarriedGold(gold - item.price);
                // Add to inventory
                if (!game.save.inventory) game.save.inventory = [];
                game.save.inventory.push({ id: item.id, emoji: item.emoji, name: item.name, hp: item.hp, speed: item.speed || 0 });
                writeSave(game.save);
                showNotice(`Bought ${item.emoji} ${item.name}! ⬡${item.price} spent.`, 2);
              }
            }
            return;
          }
          // Counter centre in interior coords
          const counterX = 7 * 36 + 54, counterY = 3 * 36 + 18;
          if (justPressedKeys.interact && Math.hypot(player.x - counterX, player.y - counterY) < 80) {
            candyShop.open = true;
            candyShop.selected = 0;
            return;
          }
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (game.inSchool) {
          if (justPressedKeys.interact) { exitHouse(); return; }
          return;
        }

        if (justPressedKeys.interact) {
          // Bed centre in interior coords (left side, rows 2–5)
          const bedX = ts + ts, bedY = ts * 2 + ts * 2;            // ≈ 72, 144
          // Chest centre in interior coords (right side, row 5)
          const chestX = ts * 8 + ts, chestY = ts * 5 + ts / 2;   // ≈ 324, 198

          if (Math.hypot(player.x - bedX, player.y - bedY) < 55) {
            // Sleep in bed — restore HP, show notice
            player.hp = player.maxHp;
            if (game.save) {
              game.save.player.hp = player.maxHp;
              writeSave(game.save);
            }
            showNotice("You sleep soundly. HP fully restored! 💤", 2.5);
          } else if (Math.hypot(player.x - chestX, player.y - chestY) < 50) {
            showNotice("Storage chest — coming in a future update! 📦", 2);
          } else {
            exitHouse();
          }
        }
      }

      function drawCandyStoreInterior(time) {
        const w = canvas.width, h = canvas.height;
        const ts = 36, roomW = 11, roomH = 8;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);

        // Background
        ctx.fillStyle = "#0d0a14";
        ctx.fillRect(0, 0, w, h);

        // Floor — pink-and-white checkerboard
        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? "#f5c8d8" : "#fdf0f5";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            ctx.strokeStyle = "rgba(200,140,160,0.3)";
            ctx.lineWidth = 0.5;
            ctx.strokeRect(ox + tx * ts, oy + ty * ts, ts, ts);
          }
        }

        // Walls — pink plaster
        ctx.fillStyle = "#f0a0c0";
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        ctx.fillStyle = "#2a1e10";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox, oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW - 1) * ts, oy + ty * ts, ts, ts);
        }
        ctx.fillRect(ox + ts, oy + (roomH - 1) * ts, (roomW - 2) * ts, ts);
        // Skirting
        ctx.fillStyle = "#d060a0";
        ctx.fillRect(ox + ts, oy + (roomH - 2) * ts + ts - 6, (roomW - 2) * ts, 6);

        // ── Candy shelves (left side) ──────────────────────
        const shColors = ["#e83030","#e8a020","#40b840","#a020e8","#e82090","#3060e8"];
        for (let row = 0; row < 3; row++) {
          const shY = oy + ts + row * ts;
          ctx.fillStyle = "#c07040";
          ctx.fillRect(ox + ts, shY, ts * 3, ts);
          // Jars on shelf
          for (let j = 0; j < 5; j++) {
            const jx = ox + ts + 8 + j * (ts * 3 / 5), jy = shY + 6;
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath();
            ctx.ellipse(jx, jy + 10, 9, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = shColors[(row * 5 + j) % shColors.length] + "99";
            ctx.beginPath();
            ctx.ellipse(jx, jy + 12, 7, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#c07040";
            ctx.fillRect(jx - 7, jy - 1, 14, 5);
          }
        }

        // ── Counter (right side, rows 3-4) ─────────────────
        const ctX = ox + ts * 7, ctY = oy + ts * 3;
        ctx.fillStyle = "#d080b0";
        ctx.fillRect(ctX, ctY, ts * 3, ts);
        ctx.fillStyle = "#a050a0";
        ctx.fillRect(ctX, ctY + ts - 8, ts * 3, 8);
        // Cash register
        ctx.fillStyle = "#505050";
        ctx.fillRect(ctX + ts, ctY - ts + 8, ts * 1.5, ts - 4);
        ctx.fillStyle = "#202020";
        ctx.fillRect(ctX + ts + 4, ctY - ts + 12, ts * 1.5 - 8, ts - 12);
        ctx.fillStyle = "#40ff40";
        ctx.fillRect(ctX + ts + 8, ctY - ts + 16, ts * 1.5 - 16, ts - 18);

        // ── Lollipop display (back-right) ──────────────────
        for (let i = 0; i < 4; i++) {
          const lpX = ox + ts * 7 + i * (ts * 0.7), lpY = oy + ts + 8;
          const lpC = shColors[i];
          ctx.strokeStyle = "#c07040";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(lpX + 8, lpY + 32); ctx.lineTo(lpX + 8, lpY + 6);
          ctx.stroke();
          ctx.fillStyle = lpC;
          ctx.beginPath();
          ctx.arc(lpX + 8, lpY + 4, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.4)";
          ctx.beginPath();
          ctx.arc(lpX + 5, lpY + 1, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Sign ────────────────────────────────────────────
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(w / 2 - 100, oy + 6, 200, 22);
        ctx.fillStyle = "#ffe0f0";
        ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🍬  Sweet Dreams Candy Store", w / 2, oy + 22);

        // Floating candy sparkles
        for (let s = 0; s < 8; s++) {
          const sx = ox + ts + Math.sin(time * 1.2 + s * 1.4) * 60 + 160;
          const sy = oy + ts * 2 + Math.cos(time * 0.9 + s * 2.1) * 30 + 40;
          const alpha = 0.3 + 0.4 * Math.sin(time * 3 + s);
          ctx.fillStyle = `rgba(255,100,180,${alpha})`;
          ctx.font = "14px serif";
          ctx.fillText(s % 2 === 0 ? "✦" : "🍬", sx, sy);
        }

        // ── Door (bottom-centre) ────────────────────────────
        const dX = ox + ts * 5, dY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#e060a0";
        ctx.fillRect(dX, dY - ts + 4, ts, ts);
        ctx.fillStyle = "#b03080";
        ctx.fillRect(dX + 2, dY - ts + 4, ts - 4, 4);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(dX + ts - 12, dY - ts / 2, 6, 6);

        // ── Player ─────────────────────────────────────────
        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        // ── Counter approach hint ────────────────────────────
        const counterX = 7 * ts + 54, counterY = 3 * ts + 18;
        const nearCounter = Math.hypot(player.x - counterX, player.y - counterY) < 80;
        if (!candyShop.open && nearCounter) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          roundRect(ctx, w/2-100, h-50, 200, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#ffe0f0";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to browse the shop", w / 2, h - 31);
          ctx.textAlign = "left";
        }

        // ── Exit hint ───────────────────────────────────────
        const nearDoor = Math.hypot(player.x - ts * 5 - ts/2, player.y - ts * (roomH-1)) < 52;
        if (!candyShop.open && nearDoor) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          roundRect(ctx, w/2-80, h-50, 160, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#ffe0f0";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to leave", w / 2, h - 31);
          ctx.textAlign = "left";
        }

        // ── Shop menu overlay ───────────────────────────────
        if (candyShop.open) {
          // Dim background
          ctx.fillStyle = "rgba(10,4,20,0.82)";
          ctx.fillRect(0, 0, w, h);

          const mw = 340, mh = 52 + CANDY_ITEMS.length * 48 + 60;
          const mx = Math.round((w - mw) / 2), my = Math.round((h - mh) / 2);

          // Panel
          ctx.fillStyle = "#2a0a20";
          roundRect(ctx, mx, my, mw, mh, 14);
          ctx.fill();
          ctx.strokeStyle = "#e060c0";
          ctx.lineWidth = 2;
          roundRect(ctx, mx, my, mw, mh, 14);
          ctx.stroke();

          // Title
          ctx.textAlign = "center";
          ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#ffe0f0";
          ctx.fillText("🍬  Sweet Dreams", mx + mw / 2, my + 28);

          // Gold display
          ctx.font = "13px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#ffd700";
          ctx.fillText(`⬡ ${getCarriedGold()} gold`, mx + mw / 2, my + 46);

          // Items
          for (let i = 0; i < CANDY_ITEMS.length; i++) {
            const item = CANDY_ITEMS[i];
            const iy = my + 60 + i * 48;
            const selected = i === candyShop.selected;
            const canAfford = getCarriedGold() >= item.price;

            // Row background
            ctx.fillStyle = selected ? "rgba(220,80,160,0.35)" : "rgba(255,255,255,0.04)";
            roundRect(ctx, mx + 12, iy, mw - 24, 42, 8);
            ctx.fill();
            if (selected) {
              ctx.strokeStyle = "#e060c0";
              ctx.lineWidth = 1.5;
              roundRect(ctx, mx + 12, iy, mw - 24, 42, 8);
              ctx.stroke();
            }

            // Emoji
            ctx.font = "22px serif";
            ctx.textAlign = "left";
            ctx.fillText(item.emoji, mx + 22, iy + 28);

            // Name + desc
            ctx.font = `bold 13px Trebuchet MS, Arial, sans-serif`;
            ctx.fillStyle = canAfford ? "#ffe0f0" : "#886070";
            ctx.fillText(item.name, mx + 54, iy + 17);
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = canAfford ? "#c0a0b0" : "#664050";
            ctx.fillText(item.desc, mx + 54, iy + 33);

            // Price
            ctx.textAlign = "right";
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = canAfford ? "#ffd700" : "#886040";
            ctx.fillText(`⬡ ${item.price}`, mx + mw - 18, iy + 24);
          }

          // Hint
          ctx.textAlign = "center";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "rgba(180,140,160,0.8)";
          ctx.fillText("↑↓ navigate  •  E to buy  •  Esc to close", mx + mw / 2, my + mh - 14);
          ctx.textAlign = "left";
        }
      }

      function drawSchoolInterior(time) {
        const w = canvas.width, h = canvas.height;
        const ts = 36, roomW = 11, roomH = 8;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);

        ctx.fillStyle = "#120f18";
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "#eadc9f";
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        ctx.fillStyle = "#7a5630";
        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? "#c89a62" : "#d7aa72";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            ctx.fillStyle = "rgba(90,60,28,0.14)";
            ctx.fillRect(ox + tx * ts, oy + ty * ts + ts - 3, ts, 2);
          }
        }

        ctx.fillStyle = "#6e4a28";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox, oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW - 1) * ts, oy + ty * ts, ts, ts);
        }
        ctx.fillRect(ox + ts, oy + (roomH - 1) * ts, (roomW - 2) * ts, ts);
        ctx.fillStyle = "#8f6438";
        ctx.fillRect(ox + ts, oy + (roomH - 2) * ts + ts - 6, (roomW - 2) * ts, 6);

        const boardX = ox + ts * 2;
        const boardY = oy + ts * 0.7;
        const boardW = ts * 7;
        const boardH = ts * 1.7;
        ctx.fillStyle = "#1f4f34";
        roundRect(ctx, boardX, boardY, boardW, boardH, 8);
        ctx.fill();
        ctx.strokeStyle = "#8d6030";
        ctx.lineWidth = 5;
        roundRect(ctx, boardX, boardY, boardW, boardH, 8);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.font = "bold 15px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Welcome to Moonlight Academy", boardX + boardW / 2, boardY + 24);
        ctx.font = "12px Trebuchet MS, Arial, sans-serif";
        ctx.fillText("A B C   ★   2 + 3 = 5   ★   1 2 3", boardX + boardW / 2, boardY + 46);
        ctx.fillText("Dream big • Learn bright", boardX + boardW / 2, boardY + 66);
        ctx.textAlign = "left";

        [[2,2.2],[7.4,2.2]].forEach(([wx, wy]) => {
          const winX = ox + ts * wx, winY = oy + ts * wy;
          ctx.fillStyle = "#9fd8ff";
          ctx.fillRect(winX, winY, ts * 1.2, ts * 1.3);
          ctx.strokeStyle = "#f6f0d0";
          ctx.lineWidth = 3;
          ctx.strokeRect(winX, winY, ts * 1.2, ts * 1.3);
          ctx.beginPath();
          ctx.moveTo(winX + ts * 0.6, winY); ctx.lineTo(winX + ts * 0.6, winY + ts * 1.3);
          ctx.moveTo(winX, winY + ts * 0.65); ctx.lineTo(winX + ts * 1.2, winY + ts * 0.65);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,240,150,0.7)";
          ctx.beginPath();
          ctx.arc(winX + ts * 0.28, winY + ts * 0.28, 6, 0, Math.PI * 2);
          ctx.fill();
        });

        const deskRows = [3.0, 4.2, 5.4];
        const deskCols = [3.0, 6.2];
        for (const row of deskRows) {
          for (const col of deskCols) {
            const dx = ox + ts * col;
            const dy = oy + ts * row;
            ctx.fillStyle = "#9b6a3c";
            ctx.fillRect(dx, dy, ts * 1.2, ts * 0.65);
            ctx.fillStyle = "#6f4a28";
            ctx.fillRect(dx + 4, dy + 4, ts * 1.2 - 8, ts * 0.65 - 8);
            ctx.fillStyle = "#c88bd8";
            ctx.fillRect(dx + ts * 0.28, dy + ts * 0.78, ts * 0.7, ts * 0.25);
            ctx.fillStyle = "#8a5b2e";
            ctx.fillRect(dx + 6, dy + ts * 0.65, 4, ts * 0.45);
            ctx.fillRect(dx + ts * 1.2 - 10, dy + ts * 0.65, 4, ts * 0.45);
          }
        }

        const tdx = ox + ts * 4.15;
        const tdy = oy + ts * 2.2;
        ctx.fillStyle = "#8b5b34";
        ctx.fillRect(tdx, tdy, ts * 1.8, ts * 0.7);
        ctx.fillStyle = "#6b4526";
        ctx.fillRect(tdx + 6, tdy + 5, ts * 1.8 - 12, ts * 0.7 - 10);
        ctx.fillRect(tdx + 10, tdy + ts * 0.7, 5, ts * 0.45);
        ctx.fillRect(tdx + ts * 1.8 - 15, tdy + ts * 0.7, 5, ts * 0.45);
        ctx.fillStyle = "#ffd6f0";
        ctx.fillRect(tdx + 18, tdy + 10, 18, 8);

        [[1.6,3.4,"#ff8fb1"],[8.2,3.9,"#8fd3ff"],[1.7,5.6,"#ffe07a"],[8.3,5.4,"#c69cff"]].forEach(([cx, cy, color]) => {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(ox + ts * cx, oy + ts * cy, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.fillRect(ox + ts * cx - 2, oy + ts * cy - 2, 4, 4);
        });

        const dX = ox + ts * 5, dY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#8f2a1e";
        ctx.fillRect(dX, dY - ts + 4, ts, ts);
        ctx.fillStyle = "#5a1810";
        ctx.fillRect(dX + 2, dY - ts + 4, ts - 4, 4);
        ctx.fillStyle = "#e8d080";
        ctx.fillRect(dX + ts - 12, dY - ts / 2, 6, 6);

        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        const nearDoor = Math.hypot(player.x - ts * 5 - ts / 2, player.y - ts * (roomH - 1)) < 52;
        if (nearDoor) {
          ctx.fillStyle = "rgba(0,0,0,0.72)";
          roundRect(ctx, w / 2 - 88, h - 50, 176, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#f6e9b8";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to leave school", w / 2, h - 31);
          ctx.textAlign = "left";
        }
      }

      function drawHouseInterior(time) {
        if (game.inCandyStore) { drawCandyStoreInterior(time); return; }
        if (game.inSchool) { drawSchoolInterior(time); return; }
        const w = canvas.width, h = canvas.height;
        const ts = 36; // interior tile size (slightly larger for cozy feel)
        const roomW = 11, roomH = 8;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);
        const outfit = OUTFIT_COLORS[player.outfit] || OUTFIT_COLORS[0];

        // Dark outer background
        ctx.fillStyle = "#0d0a14";
        ctx.fillRect(0, 0, w, h);

        // Floor tiles — warm wood planks
        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = ty % 2 === 0 ? "#6b4020" : "#7a4e28";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            // Plank lines
            if (tx % 3 === 1) {
              ctx.fillStyle = "rgba(0,0,0,0.2)";
              ctx.fillRect(ox + tx * ts, oy + ty * ts, 2, ts);
            }
          }
        }

        // Walls — plaster
        ctx.fillStyle = "#c0a87a";
        // Top wall
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        // Side walls
        ctx.fillStyle = "#2a1e10";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox,                  oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW-1) * ts, oy + ty * ts, ts, ts);
        }
        // Floor border
        ctx.fillRect(ox + ts, oy + (roomH-1) * ts, (roomW - 2) * ts, ts);
        // Skirting board
        ctx.fillStyle = "#5a3818";
        ctx.fillRect(ox + ts, oy + (roomH-2) * ts + ts - 6, (roomW-2) * ts, 6);

        // Window (back wall centre) — moonlit
        const winX = ox + ts * 4, winY = oy + ts;
        ctx.fillStyle = "#0d1a2e";
        ctx.fillRect(winX, winY, ts * 3, ts * 2 - 4);
        // Stars
        ctx.fillStyle = "#ffffff";
        [[winX+12,winY+8],[winX+ts*2,winY+12],[winX+ts+6,winY+22],[winX+ts*2+10,winY+28]].forEach(([sx,sy]) => {
          ctx.fillRect(sx, sy, 2, 2);
        });
        // Moon
        ctx.fillStyle = "#f0f0c0";
        ctx.beginPath();
        ctx.arc(winX + ts * 1.5, winY + ts * 0.7, 12, 0, Math.PI * 2);
        ctx.fill();
        // Moonlight spill on floor
        const glow = ctx.createRadialGradient(winX + ts*1.5, winY+ts, 8, winX+ts*1.5, winY+ts, ts*4);
        glow.addColorStop(0, "rgba(180,200,255,0.18)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(ox, oy, roomW*ts, roomH*ts);
        // Window frame
        ctx.strokeStyle = "#8a6030";
        ctx.lineWidth = 3;
        ctx.strokeRect(winX+1, winY+1, ts*3-2, ts*2-6);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(winX + ts*1.5, winY+2); ctx.lineTo(winX + ts*1.5, winY + ts*2-6);
        ctx.moveTo(winX+2, winY + ts - 2); ctx.lineTo(winX + ts*3 - 2, winY + ts - 2);
        ctx.stroke();

        // ── Bed (left, y rows 2-5) ──────────────────────
        const bx = ox + ts, by = oy + ts * 2;
        ctx.fillStyle = shade(outfit.legs, -15);
        ctx.fillRect(bx + 2, by, ts * 2 - 4, ts * 4); // frame
        ctx.fillStyle = shade(outfit.torso, 10);
        ctx.fillRect(bx + 6, by + 4, ts * 2 - 12, ts * 3); // mattress
        ctx.fillStyle = "#f5f0e0";
        ctx.fillRect(bx + 6, by + 4, ts * 2 - 12, ts); // pillow
        ctx.fillStyle = outfit.torso;
        ctx.fillRect(bx + 6, by + ts * 3 - 6, ts * 2 - 12, 10); // blanket fold
        // Bed headboard
        ctx.fillStyle = shade(outfit.legs, -30);
        ctx.fillRect(bx + 2, by - 6, ts * 2 - 4, 10);

        // ── Bookshelf (back-left wall) ───────────────────
        const shX = ox + ts, shY = oy + ts;
        ctx.fillStyle = "#5a3010";
        ctx.fillRect(shX, shY, ts * 3, ts);
        // Books
        const bkColors = ["#8b2020","#2060a0","#207030","#906010","#602080"];
        for (let b = 0; b < 7; b++) {
          ctx.fillStyle = bkColors[b % bkColors.length];
          ctx.fillRect(shX + 4 + b * (ts*3/7), shY + 6, ts*3/7 - 2, ts - 8);
        }

        // ── Table + candle (right side, rows 2-3) ────────
        const taX = ox + ts * 8, taY = oy + ts * 2;
        ctx.fillStyle = "#7a5828";
        ctx.fillRect(taX, taY, ts * 2, ts * 2);
        ctx.fillStyle = "#5a3820";
        ctx.fillRect(taX + 4, taY + ts * 2, 5, ts);
        ctx.fillRect(taX + ts * 2 - 9, taY + ts * 2, 5, ts);
        // Candle
        const cndX = taX + ts, cndY = taY - 14;
        ctx.fillStyle = "#f0e0a0";
        ctx.fillRect(cndX - 5, cndY, 10, 20);
        const flicker = Math.sin(time * 9 + 1) * 2.5;
        const flicker2 = Math.cos(time * 6) * 1.5;
        ctx.fillStyle = "#ff9020";
        ctx.beginPath();
        ctx.ellipse(cndX + flicker2 * 0.3, cndY - 6 + flicker, 5, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,180,60,0.12)";
        ctx.beginPath();
        ctx.arc(cndX, cndY, ts * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // ── Chest (bottom right, row 5) ───────────────────
        const chX = ox + ts * 8, chY = oy + ts * 5;
        ctx.fillStyle = "#8a6020";
        ctx.fillRect(chX, chY, ts * 2, ts);
        ctx.fillStyle = "#5a3a10";
        ctx.fillRect(chX, chY, ts * 2, 7);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(chX + ts - 5, chY + 1, 10, 8);
        ctx.fillStyle = "#c8a000";
        ctx.fillRect(chX + ts - 3, chY + 3, 6, 4);

        // ── Door (bottom-centre wall) — exit ─────────────
        const dX = ox + ts * 5, dY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#8a5020";
        ctx.fillRect(dX, dY - ts + 4, ts, ts);
        ctx.fillStyle = "#6a3810";
        ctx.fillRect(dX + 2, dY - ts + 4, ts - 4, 4);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(dX + ts - 12, dY - ts/2, 6, 6);

        // ── Player in the room ───────────────────────────
        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        // ── Name sign on wall ────────────────────────────
        const pName = game.save && game.save.player ? game.save.player.name : "Hero";
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(w / 2 - 90, oy + 6, 180, 22);
        ctx.fillStyle = "#f0e0a0";
        ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🏠  ${pName}'s Home`, w / 2, oy + 22);

        // ── Interaction hints ─────────────────────────────
        // ── Context-sensitive hints ───────────────────────
        const ts2 = ts; // alias for clarity
        const bedX = ts2 + ts2, bedY = ts2 * 2 + ts2 * 2;
        const chestX = ts2 * 8 + ts2, chestY = ts2 * 5 + ts2 / 2;
        let hintText = "E — Leave home   Esc — Leave home";
        if (Math.hypot(player.x - bedX, player.y - bedY) < 55)
          hintText = "E — Sleep  (restores HP)";
        else if (Math.hypot(player.x - chestX, player.y - chestY) < 50)
          hintText = "E — Open storage chest";

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(w / 2 - 160, h - 40, 320, 24);
        ctx.fillStyle = "#aaa";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(hintText, w / 2, h - 22);

        ctx.textAlign = "left";
        drawFade();
      }

      // ==================================================
      // === MAIN LOOP ====================================
      // ==================================================

      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        game.elapsed += dt;

        // Consume mouse click once per frame
        mouse.clicked = mouse._rawClick;

        // Update fade
        if (game.fadeDir !== 0) {
          game.fadeAlpha += game.fadeDir * dt * 3.5;
          if (game.fadeDir < 0 && game.fadeAlpha <= -1) {
            game.fadeAlpha = -1;
            if (game.fadeCallback) { game.fadeCallback(); game.fadeCallback = null; }
            game.fadeDir = 1;
          } else if (game.fadeDir > 0 && game.fadeAlpha >= 0) {
            game.fadeAlpha = 0;
            game.fadeDir = 0;
          }
        }

        updateShake(dt);
        if (game.noticeTimer > 0) {
          game.noticeTimer = Math.max(0, game.noticeTimer - dt);
          if (game.noticeTimer === 0) game.noticeText = "";
        }

        // World map toggle (works in any scene except title/char-create)
        if (justPressedKeys.map && game.scene !== SCENE.TITLE && game.scene !== SCENE.CHARACTER_CREATION) {
          worldMapOpen = !worldMapOpen;
          inventory.open = false;
        }
        // Inventory toggle
        if (justPressedKeys.inventory && game.scene !== SCENE.TITLE && game.scene !== SCENE.CHARACTER_CREATION) {
          inventory.open = !inventory.open;
          worldMapOpen = false;
        }

        // Inventory navigation (runs while open, separate from toggle)
        if (inventory.open) {
          const invItems = game.save && game.save.inventory ? game.save.inventory : [];
          if (justPressedKeys.up)   inventory.selected = (inventory.selected - 1 + Math.max(1, invItems.length)) % Math.max(1, invItems.length);
          if (justPressedKeys.down) inventory.selected = (inventory.selected + 1) % Math.max(1, invItems.length);
          if ((justPressedKeys.interact || justPressedKeys.confirm) && invItems.length > 0) useInventoryItem(inventory.selected);
          if (justPressedKeys.pause) inventory.open = false;
        }

        // Scene update
        switch (game.scene) {
          case SCENE.TITLE:              updateTitle();           break;
          case SCENE.CHARACTER_CREATION: updateCharacterCreation(); break;
          case SCENE.CITY:               updateCity(dt);          break;
          case SCENE.DUNGEON:            updateDungeonScene(dt);  break;
          case SCENE.HOUSE_INTERIOR:     updateHouseInterior(dt); break;
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Scene draw
        switch (game.scene) {
          case SCENE.TITLE:              drawTitle(game.elapsed);            break;
          case SCENE.CHARACTER_CREATION: drawCharacterCreation(game.elapsed); break;
          case SCENE.CITY:               drawCity(game.elapsed);             break;
          case SCENE.DUNGEON:            drawDungeonScene(game.elapsed);     break;
          case SCENE.HOUSE_INTERIOR:     drawHouseInterior(game.elapsed);    break;
        }

        drawFade();
        if (worldMapOpen) drawWorldMap();
        if (inventory.open) drawInventory();

        clearJustPressed();
        requestAnimationFrame(tick);
      }

      // ==================================================
      // === STARTUP ======================================
      // ==================================================

      (function startup() {
        buildMap();
        initNpcs();
        initDogs();
        const saved = loadSave();
        game.save = saved;
        // If a save exists, go straight to title (Continue is lit)
        // New game always starts at TITLE
        game.scene = SCENE.TITLE;
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
</html>
