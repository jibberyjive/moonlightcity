          ctx.fillRect(winX, winY + 12, ts * 1.4, ts * 1.15);
          ctx.strokeStyle = "#d6ab32";
          ctx.lineWidth = 3;
          ctx.strokeRect(winX, winY + 12, ts * 1.4, ts * 1.15);
          ctx.beginPath();
          ctx.moveTo(winX + ts * 0.7, winY + 12);
          ctx.lineTo(winX + ts * 0.7, winY + 12 + ts * 1.15);
          ctx.moveTo(winX, winY + 12 + ts * 0.58);
          ctx.lineTo(winX + ts * 1.4, winY + 12 + ts * 0.58);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(winX + ts * 0.7, winY + 12, ts * 0.7, Math.PI, 0);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,220,120,0.18)";
          ctx.fillRect(winX - 4, winY + 8, ts * 1.4 + 8, ts * 2.2);
        });

        const chandX = ox + roomW * ts / 2;
        const chandY = oy + 36;
        const chandGlow = ctx.createRadialGradient(chandX, chandY + 10, 10, chandX, chandY + 10, ts * 2.8);
        chandGlow.addColorStop(0, `rgba(255,224,150,${0.28 * chandelierPulse})`);
        chandGlow.addColorStop(1, "rgba(255,224,150,0)");
        ctx.fillStyle = chandGlow;
        ctx.beginPath();
        ctx.arc(chandX, chandY + 10, ts * 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#e1ba48";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(chandX, oy + 4);
        ctx.lineTo(chandX, chandY - 8);
        ctx.stroke();
        ctx.fillStyle = "#d8b24c";
        ctx.beginPath();
        ctx.moveTo(chandX, chandY - 3);
        ctx.lineTo(chandX - 18, chandY + 10);
        ctx.lineTo(chandX, chandY + 22);
        ctx.lineTo(chandX + 18, chandY + 10);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff1b5";
        ctx.beginPath();
        ctx.arc(chandX, chandY + 10, 5, 0, Math.PI * 2);
        ctx.fill();

        const pedestals = [
          { x: 2, y: 3.15, item: FURNITURE_ITEMS[0], color: "#9b3a3a" },
          { x: 4, y: 3.15, item: FURNITURE_ITEMS[1], color: "#8c6ad8" },
          { x: 6, y: 3.15, item: FURNITURE_ITEMS[2], color: "#7e5930" },
          { x: 2.5, y: 5.1, item: FURNITURE_ITEMS[3], color: "#6b4d2a" },
          { x: 5, y: 5.1, item: FURNITURE_ITEMS[4], color: "#c0a060" },
          { x: 7.2, y: 5.1, item: FURNITURE_ITEMS[7], color: "#6f4b8a" },
        ];
        for (const pedestal of pedestals) {
          const px = ox + ts * pedestal.x;
          const py = oy + ts * pedestal.y;
          ctx.fillStyle = pedestal.color;
          ctx.fillRect(px, py, ts * 0.9, ts * 0.55);
          ctx.fillStyle = "#ead8b8";
          ctx.fillRect(px + 4, py + 4, ts * 0.9 - 8, ts * 0.55 - 8);
          ctx.fillStyle = upgrades.includes(pedestal.item.id) ? "#d8b24c" : "#ffffff";
          ctx.font = "20px Arial";
          ctx.textAlign = "center";
          ctx.fillText(pedestal.item.emoji, px + ts * 0.45, py - 2);
        }

        const fountainX = ox + ts * 5.1;
        const fountainY = oy + ts * 5.05;
        ctx.fillStyle = upgrades.includes("garden_fountain") ? "#9fd8ff" : "rgba(255,255,255,0.12)";
        ctx.beginPath();
        ctx.arc(fountainX, fountainY + 8, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#b89540";
        ctx.fillRect(fountainX - 5, fountainY - 14, 10, 24);
        ctx.fillRect(fountainX - 14, fountainY + 8, 28, 8);
        if (upgrades.includes("garden_fountain")) {
          ctx.fillStyle = "rgba(140,220,255,0.5)";
          ctx.beginPath();
          ctx.ellipse(fountainX, fountainY - 8, 8, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const counterX = ox + ts * 7.2;
        const counterY = oy + ts * 2.15;
        ctx.fillStyle = "#4a1a08";
        ctx.fillRect(counterX, counterY, ts * 2.1, ts * 3.5);
        ctx.fillStyle = "#2f1005";
        ctx.fillRect(counterX + 4, counterY + 6, ts * 2.1 - 8, ts * 0.48);
        ctx.fillStyle = "#d8b24c";
        ctx.fillRect(counterX, counterY, ts * 2.1, 4);
        ctx.fillStyle = "#f4d27a";
        ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("💎 Prestige Furnishings", w / 2, oy + 22);
        ctx.textAlign = "left";

        const dX = ox + ts * 5, dY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#4a1a08";
        ctx.fillRect(dX, dY - ts + 4, ts, ts);
        ctx.fillStyle = "#2a0f06";
        ctx.fillRect(dX + 2, dY - ts + 4, ts - 4, 4);
        ctx.fillStyle = "#e8c55a";
        ctx.fillRect(dX + ts - 12, dY - ts / 2, 6, 6);

        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        const nearCounter = Math.hypot(player.x - (8 * 36 + 18), player.y - (3 * 36 + 18)) < 90;
        const nearDoor = Math.hypot(player.x - (5 * 36 + 18), player.y - (7 * 36 + 18)) < 60;
        if (nearCounter && !prestigeShop.open) {
          ctx.fillStyle = "rgba(0,0,0,0.74)";
          roundRect(ctx, w / 2 - 96, h - 82, 192, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#f7e8ba";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to browse", w / 2, h - 63);
        }
        if (nearDoor && !prestigeShop.open) {
          ctx.fillStyle = "rgba(0,0,0,0.72)";
          roundRect(ctx, w / 2 - 88, h - 48, 176, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#f7e8ba";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to leave", w / 2, h - 29);
        }
        ctx.textAlign = "left";

        if (prestigeShop.open) {
          const mx = Math.round(w / 2 - 235);
          const my = Math.round(h / 2 - 175);
          const mw = 470;
          const mh = 350;
          ctx.fillStyle = "rgba(22,14,8,0.92)";
          roundRect(ctx, mx, my, mw, mh, 16);
          ctx.fill();
          ctx.strokeStyle = "#d8b24c";
          ctx.lineWidth = 3;
          roundRect(ctx, mx, my, mw, mh, 16);
          ctx.stroke();

          ctx.fillStyle = "#f8e4a2";
          ctx.font = "bold 20px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Prestige Furnishings", mx + mw / 2, my + 30);
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.fillText(`Gold: ${getCarriedGold()} ⬡`, mx + mw / 2, my + 48);

          FURNITURE_ITEMS.forEach((item, i) => {
            const owned = upgrades.includes(item.id);
            const iy = my + 68 + i * 32;
            const selected = i === prestigeShop.selected;
            ctx.fillStyle = selected ? "rgba(216,178,76,0.26)" : "rgba(255,255,255,0.04)";
            roundRect(ctx, mx + 16, iy - 18, mw - 32, 28, 8);
            ctx.fill();
            ctx.strokeStyle = selected ? "#f0d27a" : "rgba(255,255,255,0.06)";
            ctx.lineWidth = 1;
            roundRect(ctx, mx + 16, iy - 18, mw - 32, 28, 8);
            ctx.stroke();

            ctx.font = "18px Arial";
            ctx.textAlign = "left";
            ctx.fillStyle = owned ? "#8ea18d" : "#fff2cf";
            ctx.fillText(item.emoji, mx + 26, iy + 1);
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillText(item.name, mx + 56, iy);
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = owned ? "#8ea18d" : "#ceb98f";
            ctx.fillText(item.desc, mx + 172, iy);
            ctx.textAlign = "right";
            ctx.fillStyle = owned ? "#7dd687" : "#f0d27a";
            ctx.fillText(owned ? "✓ Owned" : `${item.price} ⬡`, mx + mw - 28, iy);
          });

          ctx.textAlign = "center";
          ctx.fillStyle = "rgba(245,232,192,0.78)";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillText("↑↓ navigate • E to buy • Esc to close", mx + mw / 2, my + mh - 16);
          ctx.textAlign = "left";
        }
      }

      function drawMansionInterior(time) {
        const w = canvas.width, h = canvas.height;
        const ts = 36, roomW = 13, roomH = 9;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);
        const upgrades = game.save && game.save.houseUpgrades ? game.save.houseUpgrades : [];
        const hasUpgrade = id => upgrades.includes(id);

        ctx.fillStyle = "#080612";
        ctx.fillRect(0, 0, w, h);

        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? "#f0ece8" : "#d8d4d0";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            ctx.strokeStyle = "rgba(140,140,150,0.18)";
            ctx.lineWidth = 1;
            ctx.strokeRect(ox + tx * ts, oy + ty * ts, ts, ts);
          }
        }

        ctx.fillStyle = "#1a2a6c";
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        ctx.fillStyle = "#1a2a6c";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox, oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW - 1) * ts, oy + ty * ts, ts, ts);
        }
        ctx.fillRect(ox + ts, oy + (roomH - 1) * ts, (roomW - 2) * ts, ts);
        ctx.fillStyle = "#c8a020";
        ctx.fillRect(ox + ts, oy + ts * 2 - 8, (roomW - 2) * ts, 8);
        ctx.fillRect(ox + ts, oy + (roomH - 1) * ts, (roomW - 2) * ts, 8);
        for (let tx = 1; tx < roomW - 1; tx += 3) {
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.fillRect(ox + tx * ts + ts - 6, oy, 5, ts * 2);
        }

        const rugX = ox + ts * 3;
        const rugY = oy + ts * 3;
        ctx.fillStyle = "#7a1020";
        ctx.fillRect(rugX, rugY, ts * 5, ts * 3);
        ctx.strokeStyle = "#d8b24c";
        ctx.lineWidth = 3;
        ctx.strokeRect(rugX + 4, rugY + 4, ts * 5 - 8, ts * 3 - 8);
        ctx.strokeStyle = "rgba(216,178,76,0.55)";
        ctx.strokeRect(rugX + 12, rugY + 12, ts * 5 - 24, ts * 3 - 24);

        const chandX = ox + roomW * ts / 2;
        const chandY = oy + 42;
        const glow = ctx.createRadialGradient(chandX, chandY + 8, 10, chandX, chandY + 8, 115);
        glow.addColorStop(0, "rgba(255,230,170,0.3)");
        glow.addColorStop(1, "rgba(255,230,170,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(chandX, chandY + 8, 115, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d8b24c";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(chandX, oy + 2);
        ctx.lineTo(chandX, chandY - 12);
        ctx.stroke();
        ctx.fillStyle = "#d8b24c";
        ctx.beginPath();
        ctx.ellipse(chandX, chandY, 30, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        for (let a = 0; a < 8; a++) {
          const ang = (a / 8) * Math.PI * 2;
          const ax = chandX + Math.cos(ang) * 26;
          const ay = chandY + Math.sin(ang) * 9;
          ctx.strokeStyle = "#e6c45c";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(chandX, chandY);
          ctx.lineTo(ax, ay);
          ctx.stroke();
          ctx.fillStyle = "#ffcf5a";
          ctx.beginPath();
          ctx.ellipse(ax, ay - 5 + Math.sin(time * 7 + a) * 1.5, 3, 6, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const archWindows = [4, 8];
        for (const tx of archWindows) {
          const wx = ox + tx * ts;
          const wy = oy + ts * 0.55;
          ctx.fillStyle = "#fff0a0";
          ctx.fillRect(wx + 8, wy + 10, ts * 1.25, ts * 1.45);
          ctx.beginPath();
          ctx.arc(wx + ts * 0.625 + 8, wy + 10, ts * 0.625, Math.PI, 0);
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3;
          ctx.strokeRect(wx + 8, wy + 10, ts * 1.25, ts * 1.45);
          ctx.beginPath();
          ctx.moveTo(wx + 8 + ts * 0.625, wy + 10);
          ctx.lineTo(wx + 8 + ts * 0.625, wy + 10 + ts * 1.45);
          ctx.moveTo(wx + 8, wy + 10 + ts * 0.72);
          ctx.lineTo(wx + 8 + ts * 1.25, wy + 10 + ts * 0.72);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(wx + ts * 0.625 + 8, wy + 10, ts * 0.625, Math.PI, 0);
          ctx.stroke();
        }

        const bookX = ox + ts * 1.2;
        const bookY = oy + ts * 1.25;
        ctx.fillStyle = "#4a2a18";
        ctx.fillRect(bookX, bookY, ts * 1.45, ts * 2.9);
        for (let row = 0; row < 4; row++) {
          ctx.fillStyle = "#2a140a";
          ctx.fillRect(bookX + 4, bookY + 8 + row * 23, ts * 1.45 - 8, 3);
          const colors = ["#8a2f2f", "#2f5a8a", "#8a6a2f", "#3f7a4a", "#6a3f7a"];
          for (let col = 0; col < 6; col++) {
            ctx.fillStyle = colors[(row + col) % colors.length];
            ctx.fillRect(bookX + 8 + col * 7, bookY + 12 + row * 23, 5, 14);
          }
        }

        const fpX = ox + ts + 4;
        const fpY = oy + ts * 3;
        ctx.fillStyle = "#f0ece8";
        ctx.fillRect(fpX, fpY, ts * 2.05, ts * 2.2);
        ctx.fillStyle = "#c8a020";
        ctx.fillRect(fpX - 4, fpY - 8, ts * 2.05 + 8, 10);
        ctx.fillStyle = "#d8d4d0";
        ctx.fillRect(fpX + 10, fpY + 12, ts * 1.5, ts * 1.45);
        ctx.fillStyle = "#120804";
        ctx.fillRect(fpX + 14, fpY + 16, ts * 1.28, ts * 1.2);
        for (let f = 0; f < 5; f++) {
          const flk = Math.sin(time * 6 + f * 1.2) * 3;
          ctx.fillStyle = ["#ff4a00", "#ff7a00", "#ffc020", "#ff6600", "#ffd060"][f];
          ctx.beginPath();
          ctx.ellipse(fpX + 24 + f * 9, fpY + ts * 1.7 + flk, 5, 10 + flk, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        const tableX = ox + ts * 4.1;
        const tableY = oy + ts * 3.25;
        ctx.fillStyle = "#4a1a12";
        ctx.fillRect(tableX, tableY, ts * 3.2, ts * 1.35);
        ctx.fillStyle = "#2c0e09";
        ctx.fillRect(tableX + 8, tableY + 8, ts * 3.2 - 16, ts * 1.35 - 16);
        for (const chair of [
          [tableX + 8, tableY - 12], [tableX + ts * 2.2, tableY - 12],
          [tableX + 8, tableY + ts * 1.35 - 2], [tableX + ts * 2.2, tableY + ts * 1.35 - 2]
        ]) {
          ctx.fillStyle = "#5a2418";
          ctx.fillRect(chair[0], chair[1], 24, 12);
          ctx.fillRect(chair[0] + 3, chair[1] - 12, 18, 12);
        }

        for (const c of [tableX - 26, tableX + ts * 3.2 + 14]) {
          ctx.strokeStyle = "#d8b24c";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(c, tableY + ts * 1.1);
          ctx.lineTo(c, tableY - 6);
          ctx.stroke();
          ctx.fillStyle = "#d8b24c";
          ctx.fillRect(c - 4, tableY - 6, 8, 22);
          for (let arm = -1; arm <= 1; arm++) {
            ctx.beginPath();
            ctx.moveTo(c, tableY - 2);
            ctx.lineTo(c + arm * 10, tableY - 10);
            ctx.stroke();
            ctx.fillStyle = "#ffcf5a";
            ctx.beginPath();
            ctx.ellipse(c + arm * 10, tableY - 13 + Math.sin(time * 7 + arm) * 1.3, 2.5, 5, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const stairX = ox + ts * 9.35;
        const stairY = oy + ts * 2.15;
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i % 2 === 0 ? "#7a4a28" : "#6a3a1e";
          ctx.fillRect(stairX + i * 8, stairY + i * 24, ts * 1.55, 18);
          ctx.strokeStyle = "#c8a020";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(stairX + i * 8 + ts * 1.42, stairY + i * 24);
          ctx.lineTo(stairX + i * 8 + ts * 1.42, stairY + i * 24 + 18);
          ctx.stroke();
        }
        ctx.strokeStyle = "#c8a020";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(stairX + ts * 1.52, stairY - 8);
        ctx.lineTo(stairX + ts * 1.72, stairY + ts * 3.3);
        ctx.stroke();

        ctx.fillStyle = "#f7dc7a";
        ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🏰 Moonlight Mansion", w / 2, oy + 24);
        ctx.textAlign = "left";

        const doorX = ox + ts * 6;
        const doorY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#230705";
        ctx.fillRect(doorX, doorY - ts + 4, ts, ts);
        ctx.fillStyle = "#3a0a08";
        ctx.fillRect(doorX + 2, doorY - ts + 4, ts - 4, ts - 4);
        ctx.fillStyle = "#e8c55a";
        ctx.fillRect(doorX + ts - 12, doorY - ts / 2, 6, 6);

        if (hasUpgrade("royal_bed")) {
          ctx.fillStyle = "#6a2040";
          ctx.fillRect(ox + ts * 9.2, oy + ts * 5.6, ts * 2.2, ts * 1.2);
          ctx.fillStyle = "#d8b24c";
          ctx.fillRect(ox + ts * 9.15, oy + ts * 5.35, ts * 2.3, 8);
          ctx.fillStyle = "#f2e6d8";
          ctx.fillRect(ox + ts * 9.35, oy + ts * 5.85, ts * 1.8, ts * 0.7);
        }
        if (hasUpgrade("gold_mirror")) {
          ctx.strokeStyle = "#d8b24c";
          ctx.lineWidth = 4;
          ctx.strokeRect(ox + ts * 10.1, oy + ts * 2.4, ts * 0.9, ts * 1.4);
          ctx.fillStyle = "rgba(190,220,255,0.35)";
          ctx.fillRect(ox + ts * 10.1 + 4, oy + ts * 2.4 + 4, ts * 0.9 - 8, ts * 1.4 - 8);
        }
        if (hasUpgrade("trophy_case")) {
          ctx.fillStyle = "#5a3a18";
          ctx.fillRect(ox + ts * 10.05, oy + ts * 4.2, ts * 0.95, ts * 1.5);
          ctx.fillStyle = "rgba(220,240,255,0.18)";
          ctx.fillRect(ox + ts * 10.1, oy + ts * 4.25, ts * 0.85, ts * 1.35);
          ctx.font = "18px Arial";
          ctx.fillStyle = "#f0d27a";
          ctx.fillText("🏆", ox + ts * 10.28, oy + ts * 5.15);
        }
        if (hasUpgrade("garden_fountain")) {
          const fx = ox + ts * 2.2, fy = oy + ts * 6.3;
          ctx.fillStyle = "#9fd8ff";
          ctx.beginPath();
          ctx.arc(fx, fy, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#c8a020";
          ctx.fillRect(fx - 5, fy - 18, 10, 22);
          ctx.fillRect(fx - 14, fy + 8, 28, 8);
        }
        if (hasUpgrade("bookcase")) {
          ctx.fillStyle = "#3a2412";
          ctx.fillRect(ox + ts * 2.1, oy + ts * 1.6, ts * 0.9, ts * 2.2);
          for (let row = 0; row < 3; row++) {
            ctx.fillStyle = "#221208";
            ctx.fillRect(ox + ts * 2.1 + 3, oy + ts * 1.8 + row * 24, ts * 0.9 - 6, 3);
          }
        }
        if (hasUpgrade("chandelier")) {
          ctx.fillStyle = "rgba(255,230,170,0.12)";
          ctx.fillRect(ox + ts * 2, oy + ts * 2, ts * 9, ts * 5);
        }
        if (hasUpgrade("velvet_rug")) {
          ctx.strokeStyle = "#f2c8c8";
          ctx.lineWidth = 1;
          ctx.strokeRect(rugX + 18, rugY + 18, ts * 5 - 36, ts * 3 - 36);
        }
        if (hasUpgrade("fireplace")) {
          ctx.fillStyle = "#f7dc7a";
          ctx.font = "20px Arial";
          ctx.fillText("🔥", fpX + ts * 0.65, fpY - 14);
        }

        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        const nearDoor = Math.hypot(player.x - (6 * 36 + 18), player.y - (7 * 36 + 18)) < 60;
        if (nearDoor) {
          ctx.fillStyle = "rgba(0,0,0,0.72)";
          roundRect(ctx, w / 2 - 88, h - 48, 176, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#f7e8ba";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to leave", w / 2, h - 29);
          ctx.textAlign = "left";
        }
      }

      function drawTheaterInterior(time) {
        const W = canvas.width, H = canvas.height;
        const ts = 36;
        const roomW = 11, roomH = 8;
        const ox = Math.floor((W - roomW * ts) / 2);
        const oy = Math.floor((H - roomH * ts) / 2);

        // Dark background — cinema atmosphere
        ctx.fillStyle = "#0a0608";
        ctx.fillRect(0, 0, W, H);

        // Floor — dark red carpet
        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? "#4a1018" : "#3a0c12";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            // Carpet pattern dots
            ctx.fillStyle = "rgba(200,50,80,0.15)";
            ctx.fillRect(ox + tx * ts + 8, oy + ty * ts + 8, 4, 4);
            ctx.fillRect(ox + tx * ts + 22, oy + ty * ts + 22, 4, 4);
          }
        }

        // Walls
        for (let tx = 0; tx < roomW; tx++) {
          ctx.fillStyle = "#180810"; ctx.fillRect(ox + tx * ts, oy, ts, ts);
          ctx.fillStyle = "#180810"; ctx.fillRect(ox + tx * ts, oy + (roomH-1)*ts, ts, ts);
        }
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillStyle = "#180810"; ctx.fillRect(ox, oy + ty * ts, ts, ts);
          ctx.fillStyle = "#180810"; ctx.fillRect(ox + (roomW-1)*ts, oy + ty * ts, ts, ts);
        }

        // Curtains on left and right walls (red drapes)
        const curtainPulse = 0.9 + 0.1 * Math.sin(time * 0.5);
        ctx.fillStyle = `rgba(160,20,30,${curtainPulse})`;
        ctx.fillRect(ox + ts, oy + ts, ts - 4, (roomH - 2) * ts);
        ctx.fillRect(ox + (roomW-2) * ts + 4, oy + ts, ts - 4, (roomH - 2) * ts);
        // Curtain fold lines
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        for (let fold = 0; fold < 5; fold++) {
          ctx.fillRect(ox + ts + fold * 7, oy + ts, 2, (roomH - 2) * ts);
          ctx.fillRect(ox + (roomW-2)*ts + 4 + fold * 7, oy + ts, 2, (roomH - 2) * ts);
        }

        // ── Movie screen ─────────────────────────────────────────
        const scrX = ox + 2 * ts, scrY = oy + ts + 4;
        const scrW = (roomW - 4) * ts, scrH = ts * 3 - 8;
        // Screen glow
        const scrGlow = 0.7 + 0.3 * Math.sin(time * 0.8);
        ctx.fillStyle = `rgba(100,120,200,${scrGlow * 0.15})`;
        ctx.fillRect(scrX - 8, scrY - 8, scrW + 16, scrH + 16);
        // Screen border
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(scrX - 4, scrY - 4, scrW + 8, scrH + 8);
        // Screen surface (animated movie)
        const mx = scrX, my = scrY;
        // Sky
        ctx.fillStyle = "#1a2a5a";
        ctx.fillRect(mx, my, scrW, scrH);
        // Ground
        ctx.fillStyle = "#2a4a1a";
        ctx.fillRect(mx, my + scrH * 0.6, scrW, scrH * 0.4);
        // Animated scene elements (simple shapes that move)
        const sceneT = (time * 0.3) % 1;
        // Hero silhouette
        ctx.fillStyle = "#000";
        ctx.fillRect(mx + scrW * 0.3 + sceneT * scrW * 0.4, my + scrH * 0.35, 12, 28);
        // Stars
        for (let s = 0; s < 8; s++) {
          const st = (s * 0.137 + time * 0.5) % 1;
          ctx.fillStyle = `rgba(255,255,200,${0.5 + 0.5 * Math.sin(time * 2 + s)})`;
          ctx.fillRect(mx + (s * 47 + 10) % scrW, my + (s * 31 + 5) % (scrH * 0.55), 2, 2);
        }
        // "NOW SHOWING" text on screen
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "bold 10px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎬 NOW SHOWING", mx + scrW / 2, my + scrH - 8);
        ctx.textAlign = "left";

        // ── Seat rows ─────────────────────────────────────────────
        for (let row = 0; row < 3; row++) {
          const rowY = oy + ts * 4 + row * (ts - 2);
          const seatColor = row === 0 ? "#8a1a2a" : "#6a1020";
          for (let col = 1; col < roomW - 1; col++) {
            if (col === 5) continue; // center aisle
            const seatX = ox + col * ts + 4;
            // Seat back
            ctx.fillStyle = seatColor;
            ctx.fillRect(seatX, rowY, ts - 8, ts - 10);
            ctx.fillStyle = shade(seatColor, 20);
            ctx.fillRect(seatX, rowY, ts - 8, 5);
            // Seat base
            ctx.fillStyle = shade(seatColor, -10);
            ctx.fillRect(seatX, rowY + ts - 14, ts - 8, 8);
            // Armrests
            ctx.fillStyle = "#3a3a3a";
            ctx.fillRect(seatX - 1, rowY, 3, ts - 6);
            ctx.fillRect(seatX + ts - 10, rowY, 3, ts - 6);
          }
        }

        // ── Popcorn stand near entrance ───────────────────────────
        ctx.fillStyle = "#e84020";
        ctx.fillRect(ox + ts * 9 + 4, oy + ts * 6 + 2, ts - 8, ts - 8);
        ctx.fillStyle = "#fff8d0";
        ctx.fillRect(ox + ts * 9 + 6, oy + ts * 6 + 4, ts - 12, ts - 12);
        // Popcorn dots
        for (let pp = 0; pp < 8; pp++) {
          ctx.fillStyle = ["#ffe040","#fff8c0","#f0c050","#fff0a0"][pp % 4];
          ctx.fillRect(ox + ts * 9 + 6 + (pp % 4) * 6, oy + ts * 6 + 4 + Math.floor(pp / 4) * 6, 4, 4);
        }
        ctx.fillStyle = "#fff";
        ctx.font = "bold 7px Arial";
        ctx.textAlign = "center";
        ctx.fillText("POPCORN", ox + ts * 9 + ts/2, oy + ts * 6 - 2);
        ctx.textAlign = "left";

        // Screen glow illuminates floor
        ctx.fillStyle = `rgba(80,100,180,${0.08 + 0.04 * scrGlow})`;
        ctx.fillRect(ox + ts, oy + ts * 4, (roomW - 2) * ts, ts * 3);

        // ── Player ────────────────────────────────────────────────
        ctx.save();
        ctx.translate(player.x, player.y);
        drawPlayerSprite(time, { ...player, x: 0, y: 0 });
        ctx.restore();

        // ── Movie selection menu ──────────────────────────────────
        const distToScreen = Math.hypot(player.x - (W / 2), player.y - (oy + ts * 3 + ts / 2));
        if (!game.theater.movieMenu) {
          if (distToScreen < ts * 2.5) {
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(W / 2 - 120, H - 42, 240, 24);
            ctx.fillStyle = "#f0e8c0";
            ctx.font = "12px Trebuchet MS, Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Press E to choose a movie", W / 2, H - 25);
            ctx.textAlign = "left";
          }
        } else {
          // Movie menu overlay
          const mw = 360, mh = 220;
          const mx2 = Math.floor((W - mw) / 2), my2 = Math.floor((H - mh) / 2);
          ctx.fillStyle = "rgba(10,5,15,0.95)";
          roundRect(ctx, mx2, my2, mw, mh, 10); ctx.fill();
          ctx.strokeStyle = "#c82050"; ctx.lineWidth = 2;
          roundRect(ctx, mx2, my2, mw, mh, 10); ctx.stroke();
          ctx.fillStyle = "#f0d0d8";
          ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("🎬 Moonlight Cinemas", W / 2, my2 + 28);
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#a09098";
          ctx.fillText("↑↓ choose  •  E to watch  •  Esc to cancel", W / 2, my2 + 46);
          ctx.textAlign = "left";
          for (let i = 0; i < MOVIES.length; i++) {
            const mv = MOVIES[i];
            const sel = game.theater.selected === i;
            const iy = my2 + 64 + i * 52;
            ctx.fillStyle = sel ? "rgba(200,30,60,0.25)" : "rgba(255,255,255,0.05)";
            ctx.fillRect(mx2 + 12, iy, mw - 24, 46);
            if (sel) { ctx.strokeStyle = "#c82050"; ctx.lineWidth = 1; ctx.strokeRect(mx2 + 12, iy, mw - 24, 46); }
            ctx.fillStyle = sel ? "#ffe0e8" : "#d0b8c0";
            ctx.font = `bold 14px Trebuchet MS, Arial, sans-serif`;
            ctx.fillText(`${mv.emoji} ${mv.title}`, mx2 + 22, iy + 18);
            ctx.fillStyle = "#a09098";
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillText(`${mv.desc}  ·  ${mv.price}⬡`, mx2 + 22, iy + 36);
          }
        }

        // Exit hint
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(W / 2 - 80, H - 20, 160, 18);
        ctx.fillStyle = "#907080";
        ctx.font = "10px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Backspace / Back to exit", W / 2, H - 7);
        ctx.textAlign = "left";
      }

      function drawPetShopInterior(time) {
        const w = canvas.width, h = canvas.height;
        const ts = 36, roomW = 11, roomH = 8;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);

        ctx.fillStyle = "#120d0b";
        ctx.fillRect(0, 0, w, h);

        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = (tx + ty) % 2 === 0 ? "#c49462" : "#b88555";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
          }
        }

        ctx.fillStyle = "#d8c2a0";
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        ctx.fillStyle = "#5a3c20";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox, oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW - 1) * ts, oy + ty * ts, ts, ts);
        }
        ctx.fillRect(ox + ts, oy + (roomH - 1) * ts, (roomW - 2) * ts, ts);
        ctx.fillStyle = "#8a6438";
        ctx.fillRect(ox + ts, oy + (roomH - 2) * ts + ts - 6, (roomW - 2) * ts, 6);

        ctx.fillStyle = "#7a4f2a";
        ctx.fillRect(ox + ts * 3, oy + ts * 2, ts * 4, ts);
        ctx.fillStyle = "#5a361b";
        ctx.fillRect(ox + ts * 3, oy + ts * 2 + ts - 8, ts * 4, 8);
        ctx.fillStyle = "#f5ead6";
        ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🐾 Pawsome Pets", w / 2, oy + 22);
        ctx.textAlign = "left";

        const pens = [
          { x: ox + ts * 1.25, y: oy + ts * 3.1, pet: PETS_FOR_SALE[0] },
          { x: ox + ts * 2.65, y: oy + ts * 3.1, pet: PETS_FOR_SALE[1] },
          { x: ox + ts * 6.1,  y: oy + ts * 3.1, pet: PETS_FOR_SALE[2] },
          { x: ox + ts * 7.5,  y: oy + ts * 3.1, pet: PETS_FOR_SALE[3] },
          { x: ox + ts * 4.4,  y: oy + ts * 5.15, pet: PETS_FOR_SALE[4] }
        ];
        for (const pen of pens) {
          ctx.strokeStyle = "#6a4524";
          ctx.lineWidth = 2;
          ctx.strokeRect(pen.x, pen.y, ts * 1.2, ts * 1.1);
          ctx.fillStyle = "#ead8b8";
          ctx.fillRect(pen.x + 2, pen.y + 2, ts * 1.2 - 4, ts * 1.1 - 4);
          ctx.fillStyle = pen.pet.color;
          ctx.font = "22px Arial";
          ctx.textAlign = "center";
          ctx.fillText(pen.pet.emoji, pen.x + ts * 0.6, pen.y + 24 + Math.sin(time * 3 + pen.x * 0.01) * 2);
          ctx.textAlign = "left";
        }

        const counterX = 4 * 36 + 18, counterY = 3 * 36 + 18;
        const nearCounter = Math.hypot(player.x - counterX, player.y - counterY) < 90;
        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        if (!petShopState.open && nearCounter) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          roundRect(ctx, w / 2 - 110, h - 50, 220, 28, 8);
          ctx.fill();
          ctx.fillStyle = "#f5ead6";
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Press E to browse pets", w / 2, h - 31);
          ctx.textAlign = "left";
        }

        if (petShopState.open) {
          ctx.fillStyle = "rgba(10,6,4,0.82)";
          ctx.fillRect(0, 0, w, h);
          const mw = 360, mh = 56 + PETS_FOR_SALE.length * 46 + 54;
          const mx = Math.round((w - mw) / 2), my = Math.round((h - mh) / 2);
          ctx.fillStyle = "#2f1b12";
          roundRect(ctx, mx, my, mw, mh, 14);
          ctx.fill();
          ctx.strokeStyle = "#c89a62";
          ctx.lineWidth = 2;
          roundRect(ctx, mx, my, mw, mh, 14);
          ctx.stroke();
          ctx.font = "bold 16px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#f9e6d0";
          ctx.textAlign = "center";
          ctx.fillText("🐾 Adopt a Companion", mx + mw / 2, my + 28);
          ctx.font = "12px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#ffd680";
          ctx.fillText(`⬡ ${getCarriedGold()} gold`, mx + mw / 2, my + 46);
          ctx.textAlign = "left";
          for (let i = 0; i < PETS_FOR_SALE.length; i++) {
            const pet = PETS_FOR_SALE[i];
            const iy = my + 58 + i * 46;
            const selected = i === petShopState.selected;
            const owned = (game.save.ownedPets || []).includes(pet.id);
            const canAfford = getCarriedGold() >= pet.price;
            ctx.fillStyle = selected ? "rgba(240,180,120,0.25)" : "rgba(255,255,255,0.05)";
            roundRect(ctx, mx + 12, iy, mw - 24, 40, 8);
            ctx.fill();
            ctx.font = "20px Arial";
            ctx.fillStyle = owned ? "#9ec89e" : "#ffffff";
            ctx.fillText(pet.emoji, mx + 22, iy + 26);
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = owned ? "#9ec89e" : canAfford ? "#f9e6d0" : "#8b7262";
            ctx.fillText(pet.name, mx + 54, iy + 16);
            ctx.font = "11px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = owned ? "#82b782" : "#c4b0a2";
            ctx.fillText(owned ? "Already adopted" : `${pet.kind === "cat" ? "Cat" : "Dog"} companion`, mx + 54, iy + 31);
            ctx.textAlign = "right";
            ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
            ctx.fillStyle = owned ? "#9ec89e" : canAfford ? "#ffd680" : "#8b7262";
            ctx.fillText(owned ? "Owned" : `⬡ ${pet.price}`, mx + mw - 22, iy + 24);
            ctx.textAlign = "left";
          }
          ctx.textAlign = "center";
          ctx.font = "11px Trebuchet MS, Arial, sans-serif";
          ctx.fillStyle = "#c9b39e";
          ctx.fillText("↑↓ choose  •  E to adopt  •  Esc to close", mx + mw / 2, my + mh - 14);
          ctx.textAlign = "left";
        }
      }

      function drawHouseInterior(time) {
        if (game.inPrestigeStore) { drawPrestigeStoreInterior(time); return; }
        if (game.inMansion) { drawMansionInterior(time); return; }
        if (game.inCandyStore) { drawCandyStoreInterior(time); return; }
        if (game.inSchool) { drawSchoolInterior(time); return; }
        if (game.inTheater) { drawTheaterInterior(time); return; }
        if (game.inPetShop) { drawPetShopInterior(time); return; }
        const w = canvas.width, h = canvas.height;
        const ts = 36; // interior tile size (slightly larger for cozy feel)
        const roomW = 11, roomH = 8;
        const ox = Math.floor((w - roomW * ts) / 2);
        const oy = Math.floor((h - roomH * ts) / 2);
        const outfit = OUTFIT_COLORS[player.outfit] || OUTFIT_COLORS[0];
        const upgrades = game.save && game.save.houseUpgrades ? game.save.houseUpgrades : [];
        const hasUpgrade = id => upgrades.includes(id);

        // Dark outer background
        ctx.fillStyle = "#0d0a14";
        ctx.fillRect(0, 0, w, h);

        // Floor tiles — warm wood planks
        for (let ty = 1; ty < roomH - 1; ty++) {
          for (let tx = 1; tx < roomW - 1; tx++) {
            ctx.fillStyle = ty % 2 === 0 ? "#6b4020" : "#7a4e28";
            ctx.fillRect(ox + tx * ts, oy + ty * ts, ts, ts);
            // Plank lines
            if (tx % 3 === 1) {
              ctx.fillStyle = "rgba(0,0,0,0.2)";
              ctx.fillRect(ox + tx * ts, oy + ty * ts, 2, ts);
            }
          }
        }

        // ── Velvet Rug (drawn on floor after floor tiles) ──
        if (hasUpgrade("velvet_rug")) {
          ctx.fillStyle = "#8b1a1a";
          ctx.fillRect(ox + ts * 2, oy + ts * 3, ts * 7, ts * 2);
          ctx.strokeStyle = "#c84040";
          ctx.lineWidth = 3;
          ctx.strokeRect(ox + ts * 2 + 4, oy + ts * 3 + 4, ts * 7 - 8, ts * 2 - 8);
          ctx.strokeStyle = "#f0c0a0";
          ctx.lineWidth = 1;
          ctx.strokeRect(ox + ts * 2 + 10, oy + ts * 3 + 10, ts * 7 - 20, ts * 2 - 20);
        }

        // Walls — plaster
        ctx.fillStyle = "#c0a87a";
        // Top wall
        ctx.fillRect(ox + ts, oy, (roomW - 2) * ts, ts * 2);
        // Side walls
        ctx.fillStyle = "#2a1e10";
        for (let ty = 0; ty < roomH; ty++) {
          ctx.fillRect(ox,                  oy + ty * ts, ts, ts);
          ctx.fillRect(ox + (roomW-1) * ts, oy + ty * ts, ts, ts);
        }
        // Floor border
        ctx.fillRect(ox + ts, oy + (roomH-1) * ts, (roomW - 2) * ts, ts);
        // Skirting board
        ctx.fillStyle = "#5a3818";
        ctx.fillRect(ox + ts, oy + (roomH-2) * ts + ts - 6, (roomW-2) * ts, 6);

        // ── Chandelier ────────────────────────────────────
        if (hasUpgrade("chandelier")) {
          const cx = ox + ts * 5 + ts / 2, cy = oy + ts + 8;
          // Warm glow
          const cGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, ts * 3.5);
          cGlow.addColorStop(0, "rgba(255,220,80,0.30)");
          cGlow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = cGlow;
          ctx.fillRect(ox, oy, roomW * ts, roomH * ts);
          // Chain
          ctx.strokeStyle = "#c8a020";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cx, oy); ctx.lineTo(cx, cy); ctx.stroke();
          // Body
          ctx.fillStyle = "#d8b24c";
          ctx.beginPath(); ctx.ellipse(cx, cy, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
          // Arms
          for (let a = 0; a < 6; a++) {
            const ang = (a / 6) * Math.PI * 2;
            const ax = cx + Math.cos(ang) * 18, ay = cy + Math.sin(ang) * 6;
            ctx.strokeStyle = "#c8a020"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + Math.cos(ang) * 10, ay + 8); ctx.stroke();
            // Candle flame
            const flk = Math.sin(time * 7 + a) * 1.5;
            ctx.fillStyle = "#ffcc44";
            ctx.beginPath(); ctx.ellipse(ax + Math.cos(ang) * 10, ay + 4 + flk, 2.5, 4, 0, 0, Math.PI * 2); ctx.fill();
          }
        }

        // ── Fireplace (left wall, rows 3-5) ───────────────
        if (hasUpgrade("fireplace")) {
          const fpX = ox + ts + 2, fpY = oy + ts * 3;
          // Stone surround
          ctx.fillStyle = "#7a6858";
          ctx.fillRect(fpX, fpY, ts * 2, ts * 2);
          // Inner firebox
          ctx.fillStyle = "#1a0a00";
          ctx.fillRect(fpX + 8, fpY + 12, ts * 2 - 16, ts * 2 - 18);
          // Mantelpiece
          ctx.fillStyle = "#5a3818";
          ctx.fillRect(fpX - 4, fpY - 8, ts * 2 + 8, 10);
          // Animated flames
          for (let f = 0; f < 4; f++) {
            const flk = Math.sin(time * 6 + f * 1.2) * 3;
            const flc = ["#ff4400","#ff8800","#ffcc00","#ff6600"][f];
            ctx.fillStyle = flc;
            ctx.beginPath();
            ctx.ellipse(fpX + 14 + f * 8, fpY + ts * 2 - 16 + flk, 5, 10 + flk, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          // Fire glow
          const fGlow = ctx.createRadialGradient(fpX + ts, fpY + ts * 1.5, 4, fpX + ts, fpY + ts, ts * 1.5);
          fGlow.addColorStop(0, "rgba(255,120,20,0.22)");
          fGlow.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = fGlow;
          ctx.fillRect(ox, oy, roomW * ts, roomH * ts);
        }

        // ── Window (back wall centre) — moonlit ───────────
        const winX = ox + ts * 4, winY = oy + ts;
        ctx.fillStyle = "#0d1a2e";
        ctx.fillRect(winX, winY, ts * 3, ts * 2 - 4);
        // Stars
        ctx.fillStyle = "#ffffff";
        [[winX+12,winY+8],[winX+ts*2,winY+12],[winX+ts+6,winY+22],[winX+ts*2+10,winY+28]].forEach(([sx,sy]) => {
          ctx.fillRect(sx, sy, 2, 2);
        });
        // Moon
        ctx.fillStyle = "#f0f0c0";
        ctx.beginPath();
        ctx.arc(winX + ts * 1.5, winY + ts * 0.7, 12, 0, Math.PI * 2);
        ctx.fill();
        // Moonlight spill on floor
        const glow = ctx.createRadialGradient(winX + ts*1.5, winY+ts, 8, winX+ts*1.5, winY+ts, ts*4);
        glow.addColorStop(0, "rgba(180,200,255,0.18)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(ox, oy, roomW*ts, roomH*ts);
        // Window frame
        ctx.strokeStyle = "#8a6030";
        ctx.lineWidth = 3;
        ctx.strokeRect(winX+1, winY+1, ts*3-2, ts*2-6);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(winX + ts*1.5, winY+2); ctx.lineTo(winX + ts*1.5, winY + ts*2-6);
        ctx.moveTo(winX+2, winY + ts - 2); ctx.lineTo(winX + ts*3 - 2, winY + ts - 2);
        ctx.stroke();

        if (hasUpgrade("velvet_rug")) {
          const rugX = ox + ts + 8;
          const rugY = oy + ts * 3;
          ctx.fillStyle = "#7a1020";
          ctx.fillRect(rugX, rugY, ts * 8, ts * 2);
          ctx.strokeStyle = "#c99a66";
          ctx.lineWidth = 3;
          ctx.strokeRect(rugX + 1, rugY + 1, ts * 8 - 2, ts * 2 - 2);
          ctx.strokeStyle = "#4b0a14";
          ctx.lineWidth = 1;
          ctx.strokeRect(rugX + 8, rugY + 8, ts * 8 - 16, ts * 2 - 16);
        }

        if (hasUpgrade("chandelier")) {
          const cx = ox + ts * 5.5;
          const cy = oy + 26;
          const chandGlow = ctx.createRadialGradient(cx, cy + 6, 8, cx, cy + 6, ts * 2.5);
          chandGlow.addColorStop(0, "rgba(255,220,140,0.30)");
          chandGlow.addColorStop(1, "rgba(255,220,140,0)");
          ctx.fillStyle = chandGlow;
          ctx.beginPath();
          ctx.arc(cx, cy + 6, ts * 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#d8b24c";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx, oy + 2);
          ctx.lineTo(cx, cy - 8);
          ctx.stroke();
          ctx.fillStyle = "#d8b24c";
          ctx.beginPath();
          ctx.moveTo(cx, cy - 2);
          ctx.lineTo(cx - 16, cy + 10);
          ctx.lineTo(cx, cy + 20);
          ctx.lineTo(cx + 16, cy + 10);
          ctx.closePath();
          ctx.fill();
        }

        if (hasUpgrade("fireplace")) {
          const fx = ox + ts + 4;
          const fy = oy + ts * 4;
          ctx.fillStyle = "#68432b";
          ctx.fillRect(fx, fy, ts * 1.2, ts * 1.1);
          ctx.fillStyle = "#3a2416";
          ctx.fillRect(fx + 6, fy + 10, ts * 1.2 - 12, ts * 0.72);
          const flame = Math.sin(time * 8) * 4;
          ctx.fillStyle = "#ff9a24";
          ctx.beginPath();
          ctx.moveTo(fx + ts * 0.6, fy + 16);
          ctx.lineTo(fx + 12, fy + ts * 0.82);
          ctx.lineTo(fx + ts * 0.6, fy + ts * 0.45 + flame);
          ctx.lineTo(fx + ts * 1.2 - 12, fy + ts * 0.82);
          ctx.closePath();
          ctx.fill();
        }

        // ── Bed (left, y rows 2-5) ──────────────────────
        const bx = ox + ts, by = oy + ts * 2;
        ctx.fillStyle = shade(outfit.legs, -15);
        ctx.fillRect(bx + 2, by, ts * 2 - 4, ts * 4); // frame
        ctx.fillStyle = hasUpgrade("royal_bed") ? "#8b2040" : shade(outfit.torso, 10);
        ctx.fillRect(bx + 6, by + 4, ts * 2 - 12, ts * 3); // mattress
        ctx.fillStyle = "#f5f0e0";
        ctx.fillRect(bx + 6, by + 4, ts * 2 - 12, ts); // pillow
        ctx.fillStyle = hasUpgrade("royal_bed") ? "#b88a2c" : outfit.torso;
        ctx.fillRect(bx + 6, by + ts * 3 - 6, ts * 2 - 12, 10); // blanket fold
        // Bed headboard
        ctx.fillStyle = hasUpgrade("royal_bed") ? "#d8b24c" : shade(outfit.legs, -30);
        ctx.fillRect(bx + 2, by - 6, ts * 2 - 4, 10);

        // ── Bookshelf (back-left wall) ───────────────────
        const shX = ox + ts, shY = oy + ts;
        ctx.fillStyle = "#5a3010";
        ctx.fillRect(shX, hasUpgrade("bookcase") ? shY - ts : shY, ts * 3, hasUpgrade("bookcase") ? ts * 2 : ts);
        if (hasUpgrade("bookcase")) {
          ctx.fillStyle = "#d8b24c";
          ctx.fillRect(shX, shY - ts, ts * 3, 4);
          ctx.fillRect(shX, shY - 4, ts * 3, 4);
        }
        // Books
        const bkColors = ["#8b2020","#2060a0","#207030","#906010","#602080"];
        const shelfRows = hasUpgrade("bookcase") ? [shY - ts + 6, shY + 6] : [shY + 6];
        for (const rowY of shelfRows) {
          for (let b = 0; b < 7; b++) {
            ctx.fillStyle = bkColors[b % bkColors.length];
            ctx.fillRect(shX + 4 + b * (ts*3/7), rowY, ts*3/7 - 2, ts - 8);
          }
        }

        // ── Table + candle (right side, rows 2-3) ────────
        const taX = ox + ts * 8, taY = oy + ts * 2;
        ctx.fillStyle = "#7a5828";
        ctx.fillRect(taX, taY, ts * 2, ts * 2);
        ctx.fillStyle = "#5a3820";
        ctx.fillRect(taX + 4, taY + ts * 2, 5, ts);
        ctx.fillRect(taX + ts * 2 - 9, taY + ts * 2, 5, ts);
        // Candle
        const cndX = taX + ts, cndY = taY - 14;
        ctx.fillStyle = "#f0e0a0";
        ctx.fillRect(cndX - 5, cndY, 10, 20);
        const flicker = Math.sin(time * 9 + 1) * 2.5;
        const flicker2 = Math.cos(time * 6) * 1.5;
        ctx.fillStyle = "#ff9020";
        ctx.beginPath();
        ctx.ellipse(cndX + flicker2 * 0.3, cndY - 6 + flicker, 5, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,180,60,0.12)";
        ctx.beginPath();
        ctx.arc(cndX, cndY, ts * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // ── Chest (bottom right, row 5) ───────────────────
        const chX = ox + ts * 8, chY = oy + ts * 5;
        ctx.fillStyle = "#8a6020";
        ctx.fillRect(chX, chY, ts * 2, ts);
        ctx.fillStyle = "#5a3a10";
        ctx.fillRect(chX, chY, ts * 2, 7);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(chX + ts - 5, chY + 1, 10, 8);
        ctx.fillStyle = "#c8a000";
        ctx.fillRect(chX + ts - 3, chY + 3, 6, 4);

        if (hasUpgrade("gold_mirror")) {
          const mx = ox + ts * 9;
          const my = oy + ts * 2;
          ctx.fillStyle = "#d8b24c";
          ctx.fillRect(mx, my, ts * 0.8, ts * 1.3);
          ctx.fillStyle = "#9fc0d8";
          ctx.fillRect(mx + 5, my + 5, ts * 0.8 - 10, ts * 1.3 - 10);
          ctx.strokeStyle = "#f7e3a5";
          ctx.lineWidth = 2;
          ctx.strokeRect(mx + 2, my + 2, ts * 0.8 - 4, ts * 1.3 - 4);
        }

        if (hasUpgrade("trophy_case")) {
          const tx = ox + ts * 8;
          const ty = oy + ts * 4.2;
          ctx.fillStyle = "#7a5828";
          ctx.fillRect(tx, ty, ts * 1.8, ts * 1.25);
          ctx.fillStyle = "rgba(200,230,255,0.22)";
          ctx.fillRect(tx + 4, ty + 4, ts * 1.8 - 8, ts * 1.25 - 8);
          ctx.fillStyle = "#d8b24c";
          ctx.font = "16px Arial";
          ctx.textAlign = "center";
          ctx.fillText("🏆", tx + ts * 0.9, ty + 24);
          ctx.textAlign = "left";
        }

        if (hasUpgrade("garden_fountain")) {
          const gx = ox + ts * 5.5;
          const gy = oy + ts * 5.45;
          ctx.fillStyle = "#a8ddff";
          ctx.beginPath();
          ctx.arc(gx, gy, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#b89540";
          ctx.fillRect(gx - 4, gy - 18, 8, 22);
          ctx.fillRect(gx - 12, gy + 4, 24, 6);
        }

        // ── Door (bottom-centre wall) — exit ─────────────
        const dX = ox + ts * 5, dY = oy + (roomH - 1) * ts;
        ctx.fillStyle = "#8a5020";
        ctx.fillRect(dX, dY - ts + 4, ts, ts);
        ctx.fillStyle = "#6a3810";
        ctx.fillRect(dX + 2, dY - ts + 4, ts - 4, 4);
        ctx.fillStyle = "#ffd700";
        ctx.fillRect(dX + ts - 12, dY - ts/2, 6, 6);

        // ── Player in the room ───────────────────────────
        drawPlayerSprite(time, { ...player, x: ox + player.x, y: oy + player.y });

        // ── Name sign on wall ────────────────────────────
        const pName = game.save && game.save.player ? game.save.player.name : "Hero";
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(w / 2 - 90, oy + 6, 180, 22);
        ctx.fillStyle = "#f0e0a0";
        ctx.font = "bold 13px Trebuchet MS, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🏠  ${pName}'s Home`, w / 2, oy + 22);

        // ── Interaction hints ─────────────────────────────
        // ── Context-sensitive hints ───────────────────────
        const ts2 = ts; // alias for clarity
        const bedX = ts2 + ts2, bedY = ts2 * 2 + ts2 * 2;
        const chestX = ts2 * 8 + ts2, chestY = ts2 * 5 + ts2 / 2;
        let hintText = "E — Leave home   Esc — Leave home";
        if (Math.hypot(player.x - bedX, player.y - bedY) < 55)
          hintText = "E — Sleep  (restores HP)";
        else if (Math.hypot(player.x - chestX, player.y - chestY) < 50)
          hintText = "E — Open storage chest";

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(w / 2 - 160, h - 40, 320, 24);
        ctx.fillStyle = "#aaa";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(hintText, w / 2, h - 22);

        ctx.textAlign = "left";
      }

      // ==================================================
      // === MAIN LOOP ====================================
      // ==================================================

      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.033);
        lastTime = now;
        game.elapsed += dt;

        // Consume mouse click once per frame
        mouse.clicked = mouse._rawClick;

        // Update fade
        if (game.fadeDir !== 0) {
          game.fadeAlpha += game.fadeDir * dt * 3.5;
          if (game.fadeDir < 0 && game.fadeAlpha <= -1) {
            game.fadeAlpha = -1;
            if (game.fadeCallback) { game.fadeCallback(); game.fadeCallback = null; }
            game.fadeDir = 1;
          } else if (game.fadeDir > 0 && game.fadeAlpha >= 0) {
            game.fadeAlpha = 0;
            game.fadeDir = 0;
          }
        }

        updateShake(dt);
        if (game.noticeTimer > 0) {
          game.noticeTimer = Math.max(0, game.noticeTimer - dt);
          if (game.noticeTimer === 0) game.noticeText = "";
        }
        if (cheatBox.flashTimer > 0) {
          cheatBox.flashTimer = Math.max(0, cheatBox.flashTimer - dt);
          if (cheatBox.flashTimer === 0) cheatBox.flash = "";
        }

        // World map toggle (works in any scene except title/char-create)
        if (justPressedKeys.map && game.scene !== SCENE.TITLE && game.scene !== SCENE.CHARACTER_CREATION) {
          worldMapOpen = !worldMapOpen;
          inventory.open = false;
        }
        // Inventory toggle
        if (justPressedKeys.inventory && game.scene !== SCENE.TITLE && game.scene !== SCENE.CHARACTER_CREATION) {
          inventory.open = !inventory.open;
          worldMapOpen = false;
        }

        // Inventory navigation (runs while open, separate from toggle)
        if (inventory.open) {
          const invItems = game.save && game.save.inventory ? game.save.inventory : [];
          if (justPressedKeys.up)   inventory.selected = (inventory.selected - 1 + Math.max(1, invItems.length)) % Math.max(1, invItems.length);
          if (justPressedKeys.down) inventory.selected = (inventory.selected + 1) % Math.max(1, invItems.length);
          if ((justPressedKeys.interact || justPressedKeys.confirm) && invItems.length > 0) useInventoryItem(inventory.selected);
          if (justPressedKeys.pause) inventory.open = false;
        }

        // Scene update
        switch (game.scene) {
          case SCENE.TITLE:              updateTitle();           break;
          case SCENE.CHARACTER_CREATION: updateCharacterCreation(); break;
          case SCENE.CITY:               updateCity(dt);          break;
          case SCENE.DUNGEON:            updateDungeonScene(dt);  break;
          case SCENE.HOUSE_INTERIOR:     updateHouseInterior(dt); break;
        }

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Scene draw
        switch (game.scene) {
          case SCENE.TITLE:              drawTitle(game.elapsed);            break;
          case SCENE.CHARACTER_CREATION: drawCharacterCreation(game.elapsed); break;
          case SCENE.CITY:               drawCity(game.elapsed);             break;
          case SCENE.DUNGEON:            drawDungeonScene(game.elapsed);     break;
          case SCENE.HOUSE_INTERIOR:     drawHouseInterior(game.elapsed);    break;
        }

        drawFade();
        if (worldMapOpen) drawWorldMap();
        if (inventory.open) drawInventory();
        drawCheatBox(game.elapsed);

        clearJustPressed();
        requestAnimationFrame(tick);
      }

      // ==================================================
      // === STARTUP ======================================
      // ==================================================

      (function startup() {
        buildMap();
        game.save = loadSave();
        player = createPlayer(game.save);
        initNpcs();
        initDogs();
        // If a save exists, go straight to title (Continue is lit)
        // New game always starts at TITLE
        game.scene = SCENE.TITLE;
        requestAnimationFrame(tick);
      })();
    })();
  </script>
</body>
